<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Analysis AI</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.0.5/assets/chessground.base.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.0.5/assets/chessground.brown.css">

    <style>
        :root { --bg: #161512; --panel: #262421; --accent: #81b64c; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
        
        /* Container Utama */
        .wrapper { width: 100%; max-width: 400px; }
        
        /* Area Papan */
        .board-box { width: 100%; aspect-ratio: 1/1; margin-bottom: 15px; }
        .cg-wrap { width: 100%; height: 100%; }

        /* Panel Review */
        .panel { background: var(--panel); padding: 15px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .eval-display { display: flex; justify-content: space-between; align-items: center; background: #1a1917; padding: 10px; border-radius: 5px; margin-bottom: 10px; border-left: 5px solid var(--accent); }
        #eval-score { font-size: 24px; font-weight: bold; }
        #move-type { font-size: 14px; font-weight: bold; }

        /* Badge Icons */
        .badges { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 15px; }
        .badge { font-size: 10px; padding: 8px; text-align: center; font-weight: bold; border-radius: 4px; opacity: 0.1; border: 1px solid rgba(255,255,255,0.1); }
        .active { opacity: 1; border: 1px solid white; box-shadow: 0 0 10px var(--accent); }

        .brilliant { background: #01ebbb; color: #000; }
        .great { background: #5b89b1; }
        .excellent { background: #95bb4a; }
        .book { background: #a88865; }
        .mistake { background: #f6c045; color: #000; }
        .blunder { background: #f9412d; }

        textarea { width: 100%; height: 60px; background: #111; color: #ccc; border: 1px solid #444; border-radius: 5px; padding: 8px; font-size: 12px; margin-bottom: 10px; box-sizing: border-box; }
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 5px; width: 100%; padding: 15px; transition: 0.2s; }
        .btn-main { background: var(--accent); color: white; margin-bottom: 8px; }
        .nav-btns { display: flex; gap: 8px; }
        .btn-nav { background: #3c3a37; color: white; flex: 1; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="board-box">
            <div id="board" class="cg-wrap brown"></div>
        </div>

        <div class="panel">
            <div class="eval-display">
                <span id="eval-score">+0.30</span>
                <span id="move-type">Ready</span>
            </div>

            <div class="badges">
                <div id="m-brilliant" class="badge brilliant">!! BRILLIANT</div>
                <div id="m-great" class="badge great">! GREAT</div>
                <div id="m-excellent" class="badge excellent">🌟 EXCELLENT</div>
                <div id="m-book" class="badge book">📕 BOOK</div>
                <div id="m-mistake" class="badge mistake">?! MISTAKE</div>
                <div id="m-blunder" class="badge blunder">?? BLUNDER</div>
            </div>

            <textarea id="pgnInput" placeholder="Tempel PGN di sini..."></textarea>
            <button class="btn-main" onclick="importPGN()">START REVIEW</button>
            
            <div class="nav-btns">
                <button class="btn-nav" onclick="navigate(-1)">⬅ PREV</button>
                <button class="btn-nav" onclick="navigate(1)">NEXT ➡</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chessground@9.0.5/dist/chessground.js"></script>

    <script>
        let ground, game = new Chess(), history = [], index = -1, lastEval = 0.3;
        const stockfish = new Worker("https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js");

        // Inisialisasi Papan Chessground (SVG - Pasti Muncul)
        const boardEl = document.getElementById('board');
        ground = Chessground(boardEl, {
            fen: game.fen(),
            movable: { color: 'both', free: false }
        });

        function runAnalysis(fen, san) {
            stockfish.postMessage('position fen ' + fen);
            stockfish.postMessage('go depth 13');
            
            stockfish.onmessage = (e) => {
                if (e.data.includes('score cp')) {
                    let cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                    let score = (cp / 100).toFixed(2);
                    document.getElementById('eval-score').innerText = score > 0 ? '+' + score : score;
                    
                    // Logic Badge Review
                    let diff = Math.abs(lastEval - score);
                    document.querySelectorAll('.badge').forEach(b => b.classList.remove('active'));

                    if (diff >= 2.0) {
                        document.getElementById('m-blunder').classList.add('active');
                        document.getElementById('move-type').innerText = "BLUNDER";
                    } else if (diff >= 0.8) {
                        document.getElementById('m-mistake').classList.add('active');
                        document.getElementById('move-type').innerText = "MISTAKE";
                    } else if (index <= 8) {
                        document.getElementById('m-book').classList.add('active');
                        document.getElementById('move-type').innerText = "BOOK MOVE";
                    } else if (san.includes('x') && diff < 0.2) {
                        document.getElementById('m-brilliant').classList.add('active');
                        document.getElementById('move-type').innerText = "BRILLIANT!!";
                    } else {
                        document.getElementById('m-excellent').classList.add('active');
                        document.getElementById('move-type').innerText = "EXCELLENT";
                    }
                    lastEval = parseFloat(score);
                }
            };
        }

        function importPGN() {
            let pgn = document.getElementById('pgnInput').value;
            if (game.load_pgn(pgn)) {
                history = game.history({ verbose: true });
                game.reset();
                index = -1;
                ground.set({ fen: game.fen() });
                alert("PGN Loaded! Klik NEXT untuk analisa.");
            }
        }

        function navigate(dir) {
            if (dir === 1 && index < history.length - 1) {
                index++;
                game.move(history[index].san);
                ground.set({ 
                    fen: game.fen(), 
                    lastMove: [history[index].from, history[index].to] 
                });
                runAnalysis(game.fen(), history[index].san);
            } else if (dir === -1 && index >= 0) {
                game.undo();
                index--;
                ground.set({ fen: game.fen() });
            }
        }
    </script>
</body>
</html>
