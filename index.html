<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Game Reviewer Pro</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <style>
        :root {
            --bg: #1a1918; --panel: #262421; --green: #81b64c;
            --brilliant: #15d0b1; --great: #5c8bb0; --best: #96bc4b;
            --good: #96bc4b; --inaccuracy: #f0c15c; --mistake: #e58f2a;
            --miss: #ff6b6b; --blunder: #fa4143;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        /* Panel Coach */
        .coach-card { width: 100%; max-width: 400px; background: var(--panel); border-radius: 10px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 4px solid #111; box-sizing: border-box; }
        .coach-img { font-size: 40px; background: #333; padding: 10px; border-radius: 50%; border: 2px solid var(--green); }
        .coach-bubble { flex: 1; font-size: 14px; line-height: 1.4; }

        /* Papan Catur */
        #board-area { width: 100%; max-width: 400px; aspect-ratio: 1/1; background: #2b2927; border: 4px solid #3d3a37; border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        #board { width: 100% !important; height: 100% !important; }

        /* Kontrol */
        .controls-panel { width: 100%; max-width: 400px; background: var(--panel); padding: 15px; border-radius: 10px; margin-top: 15px; box-sizing: border-box; }
        .nav-btns { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #fff; transition: 0.2s; font-size: 20px; }
        .btn-dark { background: #3d3a37; }
        .btn-green { background: var(--green); font-size: 16px; margin-top: 10px; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }

        textarea { width: 100%; padding: 10px; background: #121211; border: 1px solid #444; color: #fff; border-radius: 5px; margin-bottom: 10px; box-sizing: border-box; resize: none; font-size: 12px; }
        
        /* Bar Evaluasi */
        .eval-bar { display: flex; justify-content: space-between; align-items: center; background: #121211; padding: 12px; border-radius: 5px; border-left: 6px solid #444; }
        .move-name { font-weight: bold; font-size: 18px; }
        .move-label { font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="coach-card">
        <div class="coach-img" id="coachIco">👨‍🏫</div>
        <div class="coach-bubble" id="coachTxt">
            Halo! Saya Coach kamu. Tempelkan PGN game kamu di bawah, lalu klik <b>START REVIEW</b>.
        </div>
    </div>

    <div id="board-area">
        <div id="board"></div>
    </div>

    <div class="controls-panel">
        <div class="nav-btns">
            <button class="btn btn-dark" onclick="goPrev()"> ❮ </button>
            <button class="btn btn-dark" onclick="board.flip()" style="font-size: 14px;">Flip</button>
            <button class="btn btn-dark" onclick="goNext()"> ❯ </button>
        </div>

        <textarea id="inputPgn" rows="3" placeholder="Paste PGN di sini..."></textarea>
        <button class="btn btn-green" onclick="startReview()">START GAME REVIEW</button>

        <div class="eval-bar" id="evalBar">
            <div>
                <div id="txtMove" class="move-name">Langkah --</div>
                <div id="txtQuality" class="move-label">SIAP ANALISIS</div>
            </div>
            <div id="txtScore" style="font-family: monospace; font-size: 20px;">0.0</div>
        </div>
    </div>

    <script>
        var board = null;
        var game = new Chess();
        var engine = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        var historyMoves = [];
        var currentIdx = -1;
        var lastEval = 0.3;

        // Inisialisasi Papan
        function init() {
            var cfg = {
                position: 'start',
                draggable: false,
                // Gunakan link gambar HTTPS Wikipedia yang paling stabil
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = Chessboard('board', cfg);
            $(window).resize(board.resize);
            
            // Force resize agar papan tidak hitam saat load awal
            setTimeout(board.resize, 1000);
        }

        function startReview() {
            var pgn = $('#inputPgn').val();
            if (!game.load_pgn(pgn)) {
                alert("PGN Tidak Valid! Pastikan kamu copy seluruh teks game.");
                return;
            }
            historyMoves = game.history();
            game.reset();
            board.start();
            currentIdx = -1;
            lastEval = 0.3;
            updateCoach("👨‍🏫", "Review siap! Klik tombol <b>❯</b> untuk mulai menganalisis langkah demi langkah.");
        }

        function goNext() {
            if (currentIdx < historyMoves.length - 1) {
                currentIdx++;
                var move = historyMoves[currentIdx];
                game.move(move);
                board.position(game.fen());
                analyzeMove(move);
            }
        }

        function goPrev() {
            if (currentIdx >= 0) {
                game.undo();
                currentIdx--;
                board.position(game.fen());
                $('#txtMove').text("Langkah " + (currentIdx + 1));
                updateCoach("🤔", "Melihat kembali posisi sebelumnya...");
            }
        }

        function analyzeMove(moveStr) {
            updateCoach("🧐", "Sebentar, saya hitung dulu...");
            engine.postMessage("position fen " + game.fen());
            engine.postMessage("go depth 12");

            engine.onmessage = function(e) {
                if (e.data.includes("score cp")) {
                    var cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                    var score = (game.turn() === 'b' ? cp : -cp) / 100;
                    showFeedback(moveStr, score);
                }
            };
        }

        function showFeedback(move, score) {
            var diff = score - lastEval;
            var label = "Good", color = "var(--good)", icon = "🙂";

            // Logika Klasifikasi (Brilliant, Best, Blunder, dsb)
            if (Math.abs(diff) < 0.2) { label = "Best Move"; color = "var(--best)"; icon = "🎯"; }
            else if (diff > 1.8) { label = "Brilliant!!"; color = "var(--brilliant)"; icon = "🤩"; }
            else if (diff > 0.8) { label = "Great Move!"; color = "var(--great)"; icon = "🔥"; }
            else if (diff < -2.0) { label = "Blunder??"; color = "var(--blunder)"; icon = "😱"; }
            else if (diff < -1.2) { label = "Mistake?"; color = "var(--mistake)"; icon = "🥴"; }
            else if (diff < -0.5) { label = "Inaccuracy?!"; color = "var(--inaccuracy)"; icon = "🤨"; }

            $('#txtMove').text((currentIdx + 1) + ". " + move);
            $('#txtScore').text((score > 0 ? "+" : "") + score.toFixed(1));
            $('#txtQuality').text(label).css('color', color);
            $('#evalBar').css('border-left-color', color);
            
            updateCoach(icon, `Langkah <b>${move}</b> adalah <b>${label}</b>. Evaluasi: ${score.toFixed(1)}`);
            lastEval = score;
        }

        function updateCoach(ico, txt) {
            $('#coachIco').text(ico);
            $('#coachTxt').html(txt);
        }

        $(document).ready(init);
    </script>
</body>
</html>
