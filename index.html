<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Chess | Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        body { background-color: #312e2b; color: #fff; font-family: sans-serif; overflow-x: hidden; }
        .bg-chess-dark { background-color: #262421; }
        .bg-chess-button { background-color: #454241; }
        .bg-chess-green { background-color: #81b64c; }
        .bg-chess-green:hover { background-color: #a3d16a; }
        #mainBoard { width: 100%; max-width: 500px; margin: 0 auto; }
        .active-side { border: 3px solid #81b64c !important; }
    </style>
</head>
<body>

<div id="screen-menu" class="flex flex-col items-center justify-center min-h-screen p-4">
    <h1 class="text-5xl font-extrabold mb-12 text-white tracking-tighter">PRACTICE CHESS</h1>
    <div class="grid grid-cols-1 gap-4 w-full max-w-xs">
        <button onclick="showSection('screen-setup')" class="bg-chess-green py-5 rounded-xl font-bold text-xl shadow-lg transform transition active:scale-95 text-white">Play Bot</button>
        <button onclick="showSection('screen-training')" class="bg-chess-button hover:bg-[#555] py-4 rounded-xl font-semibold transition">Training</button>
        <button class="bg-chess-button opacity-50 py-4 rounded-xl font-semibold cursor-not-allowed">Game Review (Soon)</button>
        <button onclick="alert('Belum ada riwayat permainan.')" class="bg-chess-button hover:bg-[#555] py-4 rounded-xl font-semibold transition">History</button>
    </div>
</div>

<div id="screen-setup" class="hidden min-h-screen p-6">
    <button onclick="showSection('screen-menu')" class="mb-6 text-gray-400 hover:text-white">← Kembali</button>
    <div class="max-w-md mx-auto bg-chess-dark p-8 rounded-2xl shadow-2xl">
        <h2 class="text-2xl font-bold mb-6">Game Settings</h2>
        
        <div class="space-y-6">
            <div>
                <label class="block text-sm text-gray-400 mb-2">Pilih Bot</label>
                <select id="bot-config" class="w-full bg-[#3d3a37] p-3 rounded-lg border border-gray-600 outline-none">
                    <option value="0|Martin|400">Martin (400)</option>
                    <option value="2|David|700">David (700)</option>
                    <option value="5|Nelson|1200">Nelson (1200)</option>
                    <option value="10|Levy|1500">Levy (1500)</option>
                    <option value="20|Magnus|2882">Magnus (2882)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">Play as</label>
                <div class="flex gap-3">
                    <button onclick="setSide('w')" id="side-w" class="flex-1 bg-chess-button py-2 rounded font-bold active-side">White</button>
                    <button onclick="setSide('b')" id="side-b" class="flex-1 bg-chess-button py-2 rounded font-bold">Black</button>
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">Variant</label>
                <select id="variant-config" class="w-full bg-[#3d3a37] p-3 rounded-lg border border-gray-600 outline-none text-sm">
                    <option value="standard">Standard</option>
                    <option value="all-queen">All Queen</option>
                    <option value="all-rook">All Rook</option>
                </select>
            </div>

            <button onclick="initGame()" class="w-full bg-chess-green py-4 rounded-xl font-bold text-lg mt-4 shadow-inner text-white">MULAI MAIN</button>
        </div>
    </div>
</div>

<div id="screen-game" class="hidden min-h-screen flex flex-col lg:flex-row items-center justify-center p-4 gap-8">
    <div class="w-full max-w-[500px]">
        <div class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gray-600 rounded"></div>
                <span id="display-bot-name" class="font-bold text-lg text-white">Bot</span>
                <span class="text-xs bg-gray-700 px-1 rounded" id="display-bot-elo">400</span>
            </div>
            <div class="bg-black px-3 py-1 rounded font-mono text-xl" id="bot-timer">--:--</div>
        </div>

        <div id="mainBoard"></div>

        <div class="flex justify-between items-center mt-2">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded"></div>
                <span class="font-bold text-lg text-white">You</span>
            </div>
            <div class="bg-black px-3 py-1 rounded font-mono text-xl" id="player-timer">--:--</div>
        </div>
    </div>

    <div class="w-full lg:w-80 bg-chess-dark rounded-lg flex flex-col h-[400px]">
        <div class="p-3 border-b border-gray-700 font-bold text-gray-400 italic">Notasi Catur</div>
        <div id="pgn-output" class="flex-1 p-4 overflow-y-auto font-mono text-sm grid grid-cols-2 gap-x-4 content-start bg-[#1b1917]"></div>
        <div class="p-4 grid grid-cols-2 gap-2">
            <button onclick="undoMove()" class="bg-chess-button p-2 rounded hover:bg-gray-600 font-bold">Undo</button>
            <button onclick="location.reload()" class="bg-red-900 p-2 rounded hover:bg-red-800 font-bold text-white text-xs">Resign</button>
        </div>
    </div>
</div>

<div id="screen-training" class="hidden min-h-screen p-8 max-w-4xl mx-auto">
    <button onclick="showSection('screen-menu')" class="mb-6 text-gray-400 hover:text-white">← Kembali</button>
    <h2 class="text-4xl font-bold mb-8 italic">Training Openings</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-chess-dark p-6 rounded-xl border-l-8 border-chess-green shadow-xl">
            <h3 class="text-2xl font-bold">Italian Game</h3>
            <p class="text-gray-400 mt-2 italic text-sm">1. e4 e5 2. Nf3 Nc6 3. Bc4</p>
            <button onclick="startTraining('r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3')" class="mt-4 bg-chess-green px-4 py-2 rounded font-bold text-white">Latih Sekarang →</button>
        </div>
        <div class="bg-chess-dark p-6 rounded-xl border-l-8 border-chess-green shadow-xl">
            <h3 class="text-2xl font-bold">Queen's Gambit</h3>
            <p class="text-gray-400 mt-2 italic text-sm">1. d4 d5 2. c4</p>
            <button onclick="startTraining('rnbqkbnr/ppp1pppp/8/3p4/2PP4/8/PP2PPPP/RNBQKBNR b KQkq c3 0 2')" class="mt-4 bg-chess-green px-4 py-2 rounded font-bold text-white">Latih Sekarang →</button>
        </div>
    </div>
</div>

<script>
    let board = null;
    let game = new Chess();
    let playerSide = 'w';
    let stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
    let currentSkill = 0;

    function showSection(id) {
        document.getElementById('screen-menu').classList.add('hidden');
        document.getElementById('screen-setup').classList.add('hidden');
        document.getElementById('screen-game').classList.add('hidden');
        document.getElementById('screen-training').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }

    function setSide(s) {
        playerSide = s;
        document.getElementById('side-w').classList.toggle('active-side', s === 'w');
        document.getElementById('side-b').classList.toggle('active-side', s === 'b');
    }

    function handleMove(source, target) {
        let move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';
        
        updateHistory();
        window.setTimeout(makeEngineMove, 500);
    }

    function makeEngineMove() {
        if (game.game_over()) return;
        stockfish.postMessage(`position fen ${game.fen()}`);
        stockfish.postMessage(`go depth ${currentSkill + 5}`);
        
        stockfish.onmessage = function(e) {
            if (e.data.startsWith('bestmove')) {
                const moveStr = e.data.split(' ')[1];
                game.move({ from: moveStr.substring(0, 2), to: moveStr.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
                updateHistory();
            }
        };
    }

    function updateHistory() {
        const hist = game.history();
        const out = document.getElementById('pgn-output');
        out.innerHTML = '';
        hist.forEach((m, i) => {
            if(i % 2 === 0) out.innerHTML += `<span class="text-gray-500">${(i/2)+1}.</span>`;
            out.innerHTML += `<span class="font-bold text-white">${m}</span>`;
        });
        out.scrollTop = out.scrollHeight;
    }

    function initGame() {
        const botData = document.getElementById('bot-config').value.split('|');
        currentSkill = parseInt(botData[0]);
        document.getElementById('display-bot-name').innerText = botData[1];
        document.getElementById('display-bot-elo').innerText = botData[2];

        game = new Chess();
        const variant = document.getElementById('variant-config').value;
        if(variant === 'all-queen') game.load('qqqqkqqq/pppppppp/8/8/8/8/PPPPPPPP/QQQQKQQQ w KQkq - 0 1');
        if(variant === 'all-rook') game.load('r r r r k r r r/pppppppp/8/8/8/8/PPPPPPPP/R R R R K R R R w KQkq - 0 1');

        showSection('screen-game');
        
        board = Chessboard('mainBoard', {
            draggable: true,
            position: game.fen(),
            orientation: playerSide === 'w' ? 'white' : 'black',
            onDrop: handleMove,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        if (playerSide === 'b') window.setTimeout(makeEngineMove, 500);
    }

    function startTraining(fen) {
        game = new Chess(fen);
        playerSide = 'w';
        showSection('screen-game');
        board = Chessboard('mainBoard', {
            draggable: true,
            position: game.fen(),
            onDrop: handleMove,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });
        alert("Training Mode: Silakan lanjutkan langkah opening ini.");
    }

    function undoMove() {
        game.undo(); game.undo();
        board.position(game.fen());
        updateHistory();
    }
</script>
</body>
</html>
