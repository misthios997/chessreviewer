<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Review Pro - Vercel Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root { --bg: #161512; --panel: #262421; --accent: #81b64c; --white: #ebecd0; --black: #779556; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        
        /* PAPAN MANUAL - Tanpa Library Gambar Luar */
        .board { width: 360px; height: 360px; display: grid; grid-template-columns: repeat(8, 1fr); border: 2px solid #333; margin-top: 10px; }
        .square { width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; font-size: 32px; }
        .w { background-color: var(--white); }
        .b { background-color: var(--black); }
        
        .panel { width: 360px; background: var(--panel); padding: 15px; border-radius: 8px; margin-top: 15px; box-sizing: border-box; }
        .eval-box { text-align: center; background: #1a1917; padding: 12px; border-radius: 4px; margin-bottom: 10px; border-left: 5px solid var(--accent); }
        #score { font-size: 28px; font-weight: bold; }
        
        .badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
        .badge { font-size: 10px; padding: 10px; text-align: center; font-weight: bold; border-radius: 4px; opacity: 0.1; border: 1px solid rgba(255,255,255,0.1); }
        .active { opacity: 1; border: 1px solid white; box-shadow: 0 0 10px var(--accent); }
        
        .brilliant { background: #01ebbb; color: #000; } .great { background: #5b89b1; }
        .excellent { background: #95bb4a; } .book { background: #a88865; }
        .mistake { background: #f6c045; color: #000; } .blunder { background: #f9412d; }

        textarea { width: 100%; height: 60px; background: #000; color: #fff; border: 1px solid #444; margin-bottom: 10px; padding: 8px; box-sizing: border-box; font-size: 11px; }
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 4px; width: 100%; padding: 15px; margin-bottom: 8px; }
        .btn-main { background: var(--accent); color: white; }
        .nav-wrap { display: flex; justify-content: space-between; gap: 10px; }
        .btn-nav { background: #3c3a37; color: white; flex: 1; }
    </style>
</head>
<body>

    <div id="chess-board" class="board"></div>

    <div class="panel">
        <div class="eval-box">
            <div id="score">+0.30</div>
            <small id="status">Stockfish AI Ready</small>
        </div>

        <div class="badge-grid">
            <div id="b-brilliant" class="badge brilliant">!! BRILLIANT</div>
            <div id="b-great" class="badge great">! GREAT</div>
            <div id="b-excellent" class="badge excellent">🌟 EXCELLENT</div>
            <div id="b-book" class="badge book">📕 BOOK</div>
            <div id="b-mistake" class="badge mistake">?! MISTAKE</div>
            <div id="b-blunder" class="badge blunder">?? BLUNDER</div>
        </div>

        <textarea id="pgnInput" placeholder="Tempel PGN di sini..."></textarea>
        <button class="btn-main" onclick="importPGN()">START REVIEW</button>
        <div class="nav-wrap">
            <button class="btn-nav" onclick="nav(-1)">PREV</button>
            <button class="btn-nav" onclick="nav(1)">NEXT</button>
        </div>
    </div>

    <script>
        const game = new Chess();
        const boardEl = document.getElementById('chess-board');
        const stockfish = new Worker("https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js");
        let history = [], index = -1, lastEval = 0.3;

        // Bidak Unicode (Pasti Muncul di semua browser/HP)
        const pieces = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        function renderBoard() {
            boardEl.innerHTML = '';
            const layout = game.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.className = `square ${(r + c) % 2 === 0 ? 'w' : 'b'}`;
                    const p = layout[r][c];
                    if (p) {
                        const span = document.createElement('span');
                        span.style.color = p.color === 'w' ? '#fff' : '#000';
                        span.innerText = p.color === 'w' ? pieces[p.type.toUpperCase()] : pieces[p.type.toLowerCase()];
                        square.appendChild(span);
                    }
                    boardEl.appendChild(square);
                }
            }
        }

        function analyze(fen, san) {
            document.getElementById('status').innerText = "Analyzing...";
            stockfish.postMessage('position fen ' + fen);
            stockfish.postMessage('go depth 13');
            stockfish.onmessage = (e) => {
                if (e.data.includes('score cp')) {
                    let cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                    let score = (cp / 100).toFixed(2);
                    document.getElementById('score').innerText = score > 0 ? '+' + score : score;
                    
                    let diff = Math.abs(lastEval - score);
                    document.querySelectorAll('.badge').forEach(b => b.classList.remove('active'));

                    if (diff >= 1.5) document.getElementById('b-blunder').classList.add('active');
                    else if (diff >= 0.7) document.getElementById('b-mistake').classList.add('active');
                    else if (index <= 10) document.getElementById('b-book').classList.add('active');
                    else if (san.includes('x') && diff < 0.2) document.getElementById('b-brilliant').classList.add('active');
                    else if (diff <= 0.3) document.getElementById('b-excellent').classList.add('active');
                    else document.getElementById('b-great').classList.add('active');

                    lastEval = parseFloat(score);
                    document.getElementById('status').innerText = "Move Evaluated";
                }
            };
        }

        function importPGN() {
            const pgn = document.getElementById('pgnInput').value;
            if (game.load_pgn(pgn)) {
                history = game.history({ verbose: true });
                game.reset(); index = -1; renderBoard();
                alert("Game Loaded!");
            }
        }

        function nav(d) {
            if (d === 1 && index < history.length - 1) {
                index++; game.move(history[index].san);
                renderBoard(); analyze(game.fen(), history[index].san);
            } else if (d === -1 && index >= 0) {
                game.undo(); index--; renderBoard();
            }
        }

        renderBoard();
    </script>
</body>
</html>
