<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Reviewer Mobile</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        :root { --bg: #262421; --panel: #312e2b; --accent: #81b64c; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: var(--bg); color: white; margin: 0; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 10px; box-sizing: border-box;
        }

        /* PERBAIKAN UTAMA: Ukuran Board Responsif */
        #board-container {
            width: 100%;
            max-width: 400px; /* Maksimal lebar di HP */
            margin-bottom: 15px;
        }
        #board { width: 100% !important; }

        .info-panel { 
            width: 100%; max-width: 400px; 
            background: var(--panel); padding: 15px; 
            border-radius: 8px; box-sizing: border-box;
        }

        .input-group { display: flex; gap: 5px; margin-bottom: 10px; }
        input, textarea { 
            flex: 1; background: #2a2825; border: 1px solid #403d39; 
            color: white; padding: 10px; border-radius: 4px; font-size: 14px;
        }

        button { 
            background: var(--accent); color: white; border: none; 
            padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; 
        }

        .game-list { 
            max-height: 120px; overflow-y: auto; background: #1b1a17; 
            margin: 10px 0; border-radius: 4px; font-size: 12px;
        }
        .game-item { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; }

        .analysis-log { 
            height: 200px; overflow-y: auto; background: #1b1a17; 
            padding: 10px; border-radius: 4px; font-size: 13px; font-family: monospace;
        }
        
        /* Analysis Colors */
        .brilliant { color: #15d0b1; font-weight: bold; }
        .blunder { color: #fa4143; font-weight: bold; }
        .mistake { color: #ffa459; }
        .best { color: #95bb4a; }

        h2 { font-size: 1.2rem; margin: 10px 0; }
    </style>
</head>
<body>

    <h2>♟️ Chess Reviewer Pro</h2>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <div class="info-panel">
        <div class="input-group">
            <input type="text" id="username" placeholder="Username Chess.com">
            <button onclick="fetchGames()">Load</button>
        </div>
        
        <div id="gameList" class="game-list"></div>

        <textarea id="pgnInput" rows="2" placeholder="Atau paste PGN di sini..."></textarea>
        <button onclick="loadPgn()" style="width:100%; margin-top:5px;">Analyze Review</button>

        <div style="display:flex; justify-content:space-between; margin-top:15px;">
            <span>Review Analysis</span>
            <span id="evalScore" style="color:var(--accent)">0.0</span>
        </div>
        <div id="analysisLog" class="analysis-log"></div>
    </div>

<script>
    let board = null;
    let game = new Chess();
    let engine = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
    let moveHistory = [];
    let currentIdx = 0;
    let lastEval = 0.3;

    // Inisialisasi Board dengan ukuran otomatis
    function initBoard() {
        board = Chessboard('board', {
            position: 'start',
            draggable: true,
            onDrop: (s, t) => {
                let move = game.move({ from: s, to: t, promotion: 'q' });
                if (move === null) return 'snapback';
                analyzeSingle();
            }
        });
        $(window).resize(board.resize); // Biar responsif kalau layar diputar
    }

    async function fetchGames() {
        const user = $('#username').val();
        const list = $('#gameList').html("Loading...");
        try {
            const date = new Date();
            const res = await fetch(`https://api.chess.com/pub/player/${user}/games/${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}`);
            const data = await res.json();
            list.html("");
            data.games.reverse().slice(0, 5).forEach(g => {
                $(`<div class="game-item">vs ${g.white.username === user ? g.black.username : g.white.username}</div>`)
                .click(() => { $('#pgnInput').val(g.pgn); loadPgn(); })
                .appendTo(list);
            });
        } catch(e) { list.html("Gagal ambil data."); }
    }

    function loadPgn() {
        if (game.load_pgn($('#pgnInput').val())) {
            board.position(game.fen());
            moveHistory = game.history();
            game.reset();
            currentIdx = 0;
            $('#analysisLog').html("Menganalisis...");
            runReview();
        }
    }

    function runReview() {
        if (currentIdx >= moveHistory.length) return;
        let move = moveHistory[currentIdx];
        game.move(move);
        board.position(game.fen());

        engine.postMessage("position fen " + game.fen());
        engine.postMessage("go depth 12");
        engine.onmessage = (e) => {
            if (e.data.includes("score cp")) {
                let cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                let score = (game.turn() === 'b' ? cp : -cp) / 100;
                updateLog(move, score);
                currentIdx++;
                setTimeout(runReview, 200);
            }
        };
    }

    function updateLog(move, score) {
        let diff = Math.abs(score - lastEval);
        let label = "Good", cls = "best";
        if (diff > 2.5) { label = "!! Brilliant"; cls = "brilliant"; }
        else if (diff > 1.5) { label = "?? Blunder"; cls = "blunder"; }
        else if (diff > 0.8) { label = "? Mistake"; cls = "mistake"; }

        $('#analysisLog').append(`<div style="display:flex; justify-content:space-between">
            <span>${currentIdx+1}. ${move}</span>
            <span class="${cls}">${label} (${score})</span>
        </div>`);
        $('#evalScore').text(score);
        lastEval = score;
        const log = document.getElementById('analysisLog');
        log.scrollTop = log.scrollHeight;
    }

    function analyzeSingle() {
        engine.postMessage("position fen " + game.fen());
        engine.postMessage("go depth 13");
        engine.onmessage = (e) => {
            if (e.data.includes("score cp")) {
                let cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                $('#evalScore').text((game.turn() === 'w' ? cp : -cp) / 100);
            }
        };
    }

    initBoard();
</script>
</body>
</html>
