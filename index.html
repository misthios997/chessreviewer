<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Reviewer Pro | Vercel Edition</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    
    <style>
        :root { --bg: #161512; --panel: #262421; --accent: #81b64c; --text: #bababa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        .main-wrapper { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        
        /* Papan Catur */
        #board { width: 100%; border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }

        /* Panel Evaluasi */
        .review-card { background: var(--panel); padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        
        .eval-header { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        #score { font-size: 36px; font-weight: 800; display: block; letter-spacing: -1px; }
        #accuracy-bar { font-size: 12px; color: var(--accent); font-weight: bold; text-transform: uppercase; }

        /* Badge Klasifikasi */
        .badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .badge { font-size: 10px; padding: 12px; text-align: center; font-weight: bold; border-radius: 6px; opacity: 0.1; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid rgba(255,255,255,0.05); }
        .active { opacity: 1; transform: scale(1.05); border: 1px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }

        .brilliant { background: #01ebbb; color: #000; }
        .great { background: #5b89b1; }
        .excellent { background: #95bb4a; }
        .book { background: #a88865; }
        .mistake { background: #f6c045; color: #000; }
        .blunder { background: #f9412d; }

        /* Input & Navigasi */
        textarea { width: 100%; height: 70px; background: #1a1917; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 10px; font-size: 12px; box-sizing: border-box; margin-bottom: 10px; resize: none; }
        
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 8px; transition: 0.2s; }
        .btn-import { background: var(--accent); color: white; width: 100%; padding: 15px; font-size: 14px; margin-bottom: 10px; }
        .btn-import:hover { background: #95cc5a; }
        
        .nav-group { display: flex; gap: 10px; }
        .btn-nav { background: #3c3a37; color: white; flex: 1; padding: 18px; font-size: 16px; }
        .btn-nav:active { background: #45423e; transform: translateY(2px); }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div id="board"></div>

        <div class="review-card">
            <div class="eval-header">
                <span id="score">0.00</span>
                <span id="accuracy-bar">Engine Ready</span>
            </div>

            <div class="badge-grid">
                <div id="m-brilliant" class="badge brilliant">!! BRILLIANT</div>
                <div id="m-great" class="badge great">! GREAT</div>
                <div id="m-excellent" class="badge excellent">🌟 EXCELLENT</div>
                <div id="m-book" class="badge book">📕 BOOK</div>
                <div id="m-mistake" class="badge mistake">?! MISTAKE</div>
                <div id="m-blunder" class="badge blunder">?? BLUNDER</div>
            </div>

            <textarea id="pgnInput" placeholder="Paste PGN here..."></textarea>
            
            <button class="btn-import" onclick="importPGN()">IMPORT & ANALYZE</button>
            
            <div class="nav-group">
                <button class="btn-nav" onclick="step(-1)">PREV</button>
                <button class="btn-nav" onclick="step(1)">NEXT</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        let board, game = new Chess(), history = [], index = -1, lastScore = 0.3;
        
        // Stockfish 10 Worker
        const stockfish = new Worker("https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js");

        function init() {
            board = Chessboard('board', {
                position: 'start',
                draggable: true,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            $(window).resize(board.resize);
        }

        function analyze(fen, san) {
            document.getElementById('accuracy-bar').innerText = "Analyzing Depth 14...";
            stockfish.postMessage('position fen ' + fen);
            stockfish.postMessage('go depth 14');

            stockfish.onmessage = (e) => {
                if (e.data.includes('score cp')) {
                    let cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                    let score = (cp / 100).toFixed(2);
                    
                    document.getElementById('score').innerText = score > 0 ? '+' + score : score;
                    
                    // Logic Klasifikasi
                    let diff = Math.abs(lastScore - score);
                    $('.badge').removeClass('active');

                    if (diff >= 2.0) $('#m-blunder').addClass('active');
                    else if (diff >= 0.8) $('#m-mistake').addClass('active');
                    else if (index <= 10) $('#m-book').addClass('active');
                    else if (san.includes('x') && diff < 0.2) $('#m-brilliant').addClass('active');
                    else if (diff <= 0.3) $('#m-excellent').addClass('active');
                    else $('#m-great').addClass('active');

                    lastScore = parseFloat(score);
                    document.getElementById('accuracy-bar').innerText = "Analysis Complete";
                }
            };
        }

        function importPGN() {
            const pgn = document.getElementById('pgnInput').value;
            if (game.load_pgn(pgn)) {
                history = game.history({ verbose: true });
                game.reset();
                index = -1;
                board.start();
                lastScore = 0.3;
                alert("Game Imported!");
            }
        }

        function step(d) {
            if (d === 1 && index < history.length - 1) {
                index++;
                game.move(history[index].san);
                board.position(game.fen());
                analyze(game.fen(), history[index].san);
            } else if (d === -1 && index >= 0) {
                game.undo();
                index--;
                board.position(game.fen());
                document.getElementById('score').innerText = "...";
            }
        }

        $(document).ready(init);
    </script>
</body>
</html>
