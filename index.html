<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Reviewer Pro - Fix</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    
    <style>
        :root { --bg: #1a1917; --panel: #262421; --green: #81b64c; --brilliant: #15d0b1; --blunder: #fa4143; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        /* Header Coach */
        .header-box { width: 100%; max-width: 400px; background: var(--panel); border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; border-bottom: 4px solid #3d3a37; box-sizing: border-box; }
        .coach-icon { font-size: 30px; background: #333; padding: 8px; border-radius: 50%; }
        
        /* Board Area - Pastikan ukuran terlihat */
        #board-resizer { width: 100%; max-width: 400px; margin-bottom: 15px; min-height: 300px; }
        #board { width: 100% !important; border: 2px solid #444; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

        /* Controls */
        .main-panel { width: 100%; max-width: 400px; background: var(--panel); padding: 15px; border-radius: 8px; box-sizing: border-box; }
        
        /* Navigasi */
        .nav-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn-nav { flex: 1; padding: 15px; border: none; border-radius: 4px; background: #3d3a37; color: white; font-weight: bold; cursor: pointer; font-size: 20px; }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Inputs */
        .input-group { display: flex; gap: 5px; margin-bottom: 10px; }
        input { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #121211; color: white; }
        textarea { width: 100%; height: 60px; background: #121211; color: #ccc; border: 1px solid #444; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-size: 11px; resize: none; box-sizing: border-box; }
        
        .btn-start { width: 100%; padding: 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; background: var(--green); font-size: 16px; margin-bottom: 10px; }
        .info-bar { display: flex; justify-content: space-between; background: #121211; padding: 10px; border-radius: 4px; font-size: 14px; font-weight: bold; }
        .game-list { max-height: 80px; overflow-y: auto; font-size: 12px; color: var(--green); cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header-box">
        <div class="coach-icon">👨‍🏫</div>
        <div id="statusText" style="font-size: 13px;">Coach: Siap menganalisis! Masukkan PGN lalu klik Start.</div>
    </div>

    <div id="board-resizer">
        <div id="board"></div>
    </div>

    <div class="main-panel">
        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Username Chess.com">
            <button onclick="loadUserGames()" style="padding: 10px; background: #444; color: white; border: none; border-radius: 4px;">Cari Game</button>
        </div>
        <div id="gameList" class="game-list"></div>

        <div class="nav-row">
            <button class="btn-nav" id="prevBtn" onclick="prevMove()" disabled> &lt; </button>
            <button class="btn-nav" id="nextBtn" onclick="nextMove()" disabled> &gt; </button>
        </div>

        <textarea id="pgnArea" placeholder="Paste PGN lengkap di sini..."></textarea>
        
        <button class="btn-start" onclick="initReview()">START GAME REVIEW</button>
        
        <div class="info-bar">
            <span id="moveDisplay">Langkah: --</span>
            <span id="evalDisplay">0.0</span>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var engine = null;
        var moveHistory = [];
        var currentIdx = -1;
        var analysisCache = {};

        // Inisialisasi Papan & Engine saat halaman siap
        $(document).ready(function() {
            initBoard();
            initEngine();
        });

        function initBoard() {
            var config = {
                position: 'start',
                draggable: false, // Draggable off selama review
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = Chessboard('board', config);
            $(window).resize(board.resize);
        }

        function initEngine() {
            try {
                engine = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
            } catch (e) {
                $('#statusText').text("Gagal memuat Stockfish Engine.");
            }
        }

        async function loadUserGames() {
            let user = $('#usernameInput').val();
            if(!user) return;
            $('#gameList').text("Mencari...");
            try {
                let r = await fetch(`https://api.chess.com/pub/player/${user}/games/2026/01`);
                let d = await r.json();
                $('#gameList').empty();
                d.games.reverse().slice(0, 5).forEach(g => {
                    let opponent = (g.white.username.toLowerCase() == user.toLowerCase() ? g.black.username : g.white.username);
                    $(`<div style="padding:5px; border-bottom:1px solid #333;">vs ${opponent}</div>`)
                    .click(() => { $('#pgnArea').val(g.pgn); $('#statusText').text("PGN Terpilih! Klik START."); })
                    .appendTo('#gameList');
                });
            } catch(e) { $('#gameList').text("Gagal ambil game."); }
        }

        function initReview() {
            let pgn = $('#pgnArea').val();
            if (!game.load_pgn(pgn)) {
                alert("Format PGN tidak dikenal!");
                return;
            }
            moveHistory = game.history();
            game.reset();
            board.start();
            currentIdx = -1;
            analysisCache = {};
            
            $('#statusText').text("Review dimulai! Gunakan tombol panah > untuk melangkah.");
            updateNavUI();
        }

        function nextMove() {
            if (currentIdx < moveHistory.length - 1) {
                currentIdx++;
                let move = moveHistory[currentIdx];
                game.move(move);
                board.position(game.fen());
                analyzePos(move);
                updateNavUI();
            }
        }

        function prevMove() {
            if (currentIdx >= 0) {
                game.undo();
                currentIdx--;
                board.position(game.fen());
                if (currentIdx >= 0) {
                    let prevMoveData = moveHistory[currentIdx];
                    showResult(prevMoveData, analysisCache[currentIdx] || 0);
                } else {
                    $('#moveDisplay').text("Posisi Awal");
                    $('#evalDisplay').text("0.0");
                }
                updateNavUI();
            }
        }

        function analyzePos(move) {
            $('#statusText').text("Coach sedang berpikir...");
            engine.postMessage("position fen " + game.fen());
            engine.postMessage("go depth 12");
            
            engine.onmessage = function(e) {
                if (e.data.includes("score cp")) {
                    let match = e.data.match(/score cp (-?\d+)/);
                    if (match) {
                        let score = (game.turn() === 'b' ? parseInt(match[1]) : -parseInt(match[1])) / 100;
                        analysisCache[currentIdx] = score;
                        showResult(move, score);
                    }
                }
            };
        }

        function showResult(move, score) {
            let label = "Langkah Bagus";
            let color = "var(--green)";
            
            if (score > 2.5) { label = "!! Brilliant"; color = "var(--brilliant)"; }
            else if (score < -1.5) { label = "?? Blunder"; color = "var(--blunder)"; }
            
            $('#moveDisplay').text((currentIdx + 1) + ". " + move);
            $('#evalDisplay').text(score).css('color', color);
            $('#statusText').text(`Langkah ${move}: ${label}`).css('color', color);
        }

        function updateNavUI() {
            $('#prevBtn').prop('disabled', currentIdx < 0);
            $('#nextBtn').prop('disabled', currentIdx >= moveHistory.length - 1);
        }
    </script>
</body>
</html>
