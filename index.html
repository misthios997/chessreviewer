<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Bot Mastery - Real Stockfish</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root {
            --bg-color: #2c3e50;
            --container-bg: #34495e;
            --accent-color: #27ae60;
            --text-color: #ffffff;
        }

        /* Lock Screen: Mencegah scroll dan zoom */
        html, body { 
            overflow: hidden; 
            position: fixed; 
            width: 100%; 
            height: 100%;
            touch-action: none; /* Mematikan gesture zoom bawaan */
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: 0; 
        }

        .container { 
            background: var(--container-bg); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            text-align: center; 
            width: 95%; 
            max-width: 400px;
            touch-action: auto; /* Izinkan interaksi di dalam container */
        }

        .hidden { display: none; }

        input, button { 
            padding: 12px; 
            margin: 8px; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px; 
        }

        button { 
            cursor: pointer; 
            background: var(--accent-color); 
            color: white; 
            font-weight: bold; 
        }

        .bot-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .bot-card { 
            background: #2c3e50; 
            padding: 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            border: 2px solid transparent;
            font-size: 13px;
        }

        .bot-card.selected { border-color: #f1c40f; background: #3e5871; }

        #board { 
            width: 100%; 
            margin: 15px auto; 
            border: 4px solid #1a252f;
        }

        .info-panel { 
            display: flex; 
            justify-content: space-between; 
            padding: 10px; 
            background: #1a252f; 
            border-radius: 8px; 
            font-size: 13px;
            margin-bottom: 5px;
        }

        .role { font-weight: bold; padding: 2px 5px; border-radius: 4px; font-size: 10px; margin-right: 4px; }
        .role-gm { background: #e74c3c; }
        .role-cm { background: #f39c12; }
        
        /* Highlight untuk Tap & Move */
        .highlight-square { box-shadow: inset 0 0 3px 3px yellow; }
    </style>
</head>
<body>

<div id="scene1" class="container">
    <h2>Chess Bot Pro</h2>
    <input type="text" id="username" placeholder="Username..." style="width: 80%">
    <br>
    <button onclick="goToScene2()" style="width: 85%">Play Game</button>
</div>

<div id="scene2" class="container hidden">
    <h3 style="margin-top:0">Pilih Lawan</h3>
    <div class="bot-list" id="bot-list"></div>
    <div style="display:flex; justify-content: space-around;">
        <button onclick="setSide('w')">White</button>
        <button onclick="setSide('b')">Black</button>
        <button onclick="setSide('r')">Random</button>
    </div>
</div>

<div id="scene3" class="container hidden">
    <div class="info-panel" id="opponent-info"></div>
    <div id="board"></div>
    <div class="info-panel"><span id="display-username">Player</span></div>
    <div style="display:flex; justify-content: center; gap: 10px;">
        <button onclick="undoMove()" style="background: #3498db">Undo</button>
        <button onclick="resign()" style="background: #e74c3c">Resign</button>
    </div>
</div>

<div id="scene4" class="container hidden">
    <h1 id="result-title"></h1>
    <p id="result-desc"></p>
    <button onclick="location.reload()">Main Lagi</button>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    let board = null;
    let game = new Chess();
    let playerColor = 'w';
    let selectedBotIdx = null;
    let sfWorker = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
    let sourceSquare = null;

    const bots = [
        { name: "Martin", elo: 400, depth: 1 },
        { name: "David", elo: 700, depth: 2 },
        { name: "Nelson", elo: 1000, depth: 4 },
        { name: "Poltak", elo: 1500, depth: 8 },
        { name: "Paul", elo: 2000, depth: 12 },
        { name: "Hikaru Nakamura", elo: 2500, depth: 15 },
        { name: "Magnus Carlsen", elo: 2882, depth: 18 },
        { name: "Engine", elo: 3293, depth: 20 }
    ];

    // Tap & Move Logic
    function onSquareClick(square) {
        if (game.turn() !== playerColor[0]) return;

        if (sourceSquare === null) {
            const piece = game.get(square);
            if (piece && piece.color === playerColor[0]) {
                sourceSquare = square;
                highlight(square);
            }
        } else {
            let move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
            removeHighlights();
            sourceSquare = null;

            if (move === null) {
                onSquareClick(square); // Cek apakah tap di bidak lain
            } else {
                board.position(game.fen());
                checkGameOver();
                if (!game.game_over()) setTimeout(askStockfish, 250);
            }
        }
    }

    function highlight(square) { $('#board .square-' + square).addClass('highlight-square'); }
    function removeHighlights() { $('#board .square-55d6').removeClass('highlight-square'); }

    // Stockfish Communication
    function askStockfish() {
        const depth = bots[selectedBotIdx].depth;
        sfWorker.postMessage('position fen ' + game.fen());
        sfWorker.postMessage('go depth ' + depth);
    }

    sfWorker.onmessage = function(event) {
        if (event.data.includes('bestmove')) {
            const move = event.data.split(' ')[1];
            game.move({ from: move.substring(0, 2), to: move.substring(2, 4), promotion: 'q' });
            board.position(game.fen());
            checkGameOver();
        }
    };

    // UI Logic
    function getRoleHTML(elo) {
        if (elo >= 2500) return '<span class="role role-gm">GM</span>';
        if (elo >= 2000) return '<span class="role role-cm">CM</span>';
        return '';
    }

    function goToScene2() {
        const name = document.getElementById('username').value;
        if (!name) return alert("Username wajib diisi!");
        document.getElementById('display-username').innerText = name;
        document.getElementById('scene1').classList.add('hidden');
        document.getElementById('scene2').classList.remove('hidden');
        renderBots();
    }

    function renderBots() {
        const list = document.getElementById('bot-list');
        list.innerHTML = '';
        bots.forEach((bot, i) => {
            const card = document.createElement('div');
            card.className = `bot-card ${selectedBotIdx === i ? 'selected' : ''}`;
            card.innerHTML = `${getRoleHTML(bot.elo)} <b>${bot.name}</b><br>ELO ${bot.elo}`;
            card.onclick = () => { selectedBotIdx = i; renderBots(); };
            list.appendChild(card);
        });
    }

    function setSide(side) {
        if (selectedBotIdx === null) return alert("Pilih bot!");
        playerColor = side === 'r' ? (Math.random() > 0.5 ? 'w' : 'b') : side;
        document.getElementById('scene2').classList.add('hidden');
        document.getElementById('scene3').classList.remove('hidden');
        
        const bot = bots[selectedBotIdx];
        document.getElementById('opponent-info').innerHTML = `<span>${getRoleHTML(bot.elo)} ${bot.name}</span>`;
        
        initBoard();
        if (playerColor === 'b') askStockfish();
    }

    function initBoard() {
        board = Chessboard('board', {
            draggable: true,
            position: 'start',
            orientation: playerColor === 'w' ? 'white' : 'black',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDrop: (source, target) => {
                let move = game.move({ from: source, to: target, promotion: 'q' });
                if (move === null) return 'snapback';
                checkGameOver();
                setTimeout(askStockfish, 250);
            },
            onSnapEnd: () => board.position(game.fen())
        });
        // Aktifkan Tap & Move
        $('#board').on('click', '.square-55d6', function() {
            onSquareClick($(this).attr('data-square'));
        });
    }

    function checkGameOver() {
        if (game.in_checkmate()) showResult(game.turn() === 'w' ? "Black Wins" : "White Wins", "by Checkmate");
        else if (game.in_draw()) showResult("Draw", "Stalemate / Repetition");
    }

    function showResult(title, desc) {
        document.getElementById('scene3').classList.add('hidden');
        document.getElementById('scene4').classList.remove('hidden');
        document.getElementById('result-title').innerText = title;
        document.getElementById('result-desc').innerText = desc;
    }

    function resign() { showResult(playerColor === 'w' ? "Black Wins" : "White Wins", "by Resignation"); }
    function undoMove() { game.undo(); game.undo(); board.position(game.fen()); }
</script>
</body>
</html>
