<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Reviewer Pro - Touch Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root { --bg: #161512; --panel: #262421; --green: #81b64c; --light: #dee3e6; --dark: #8ca2ad; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; -webkit-tap-highlight-color: transparent; }
        #chess-board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 92vw; height: 92vw; max-width: 380px; border: 4px solid #333; }
        .square { display: flex; justify-content: center; align-items: center; position: relative; }
        .white { background-color: var(--light); }
        .black { background-color: var(--dark); }
        .piece { width: 90%; height: 90%; z-index: 10; pointer-events: none; }
        .eval-icon { position: absolute; top: -5%; right: -5%; width: 45%; height: 45%; border-radius: 50%; z-index: 100; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: white; border: 1.5px solid #fff; }
        #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .ui-card { width: 100%; max-width: 400px; background: var(--panel); padding: 15px; border-radius: 8px; box-sizing: border-box; margin-top: 10px; }
        .btn { padding: 12px; border: none; border-radius: 4px; font-weight: bold; color: white; cursor: pointer; }
        .btn-nav { flex: 1; background: #3d3a37; font-size: 24px; }
        .btn-main { width: 100%; background: #444; margin-top: 10px; padding: 16px; font-size: 16px; border-bottom: 4px solid #222; transition: 0.2s; }
        .active-btn { background: var(--green) !important; border-bottom: 4px solid #5d8437 !important; }
        #list { max-height: 150px; overflow-y: auto; background: #111; margin-bottom: 10px; border: 1px solid #444; border-radius: 4px; }
        .game-item { padding: 16px; border-bottom: 1px solid #333; color: var(--green); cursor: pointer; touch-action: manipulation; }
        .selected { background: #2d4a1a !important; color: white !important; font-weight: bold; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <h1 id="load-pct" style="font-size: 60px; color: var(--green); margin: 0;">0%</h1>
    <p id="load-msg">Menganalisis...</p>
</div>

<div id="chess-board"></div>

<div class="ui-card">
    <div style="display:flex; gap:5px; margin-bottom: 10px;">
        <input type="text" id="userInp" placeholder="Username Chess.com" style="flex:1; padding:12px; background:#111; color:white; border:1px solid #444; border-radius:4px;">
        <button class="btn" style="background:#555;" onclick="loadGames()">CARI</button>
    </div>
    
    <div id="list" onclick="handleListClick(event)">
        <div style="padding:20px; color:#666; text-align:center; font-size:14px;">Masukkan username & klik cari</div>
    </div>
    
    <div style="display:flex; gap:10px;">
        <button class="btn btn-nav" onclick="go(-1)">❮</button>
        <button class="btn btn-nav" onclick="go(1)">❯</button>
    </div>
    
    <button class="btn btn-main" id="btnAnalisis" onclick="startAnalysis()">ANALISIS GAME TERPILIH</button>

    <div id="status" style="margin-top:15px; padding:12px; background:#000; border-left:5px solid #444; display:flex; justify-content:space-between; align-items:center;">
        <div>
            <div id="moveDisplay" style="font-weight:bold;">Langkah --</div>
            <div id="labelDisplay" style="font-size:12px; font-weight:bold; color:#ff4444;">PILIH GAME DULU</div>
        </div>
        <div id="scoreDisplay" style="font-size:24px; font-weight:bold; color:var(--green);">0.0</div>
    </div>
</div>

<script>
    const engine = new Worker('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js');
    let game = new Chess(), gHistory = [], gIdx = -1, analysisResults = [];
    window.finalPgnData = ""; 

    function drawBoard() {
        const b = document.getElementById('chess-board'); b.innerHTML = '';
        const pos = game.board();
        for(let r=7; r>=0; r--) {
            for(let c=0; c<8; c++) {
                const sq = document.createElement('div');
                sq.className = `square ${(r+c)%2==0 ? 'black' : 'white'}`;
                const p = pos[7-r][c];
                if(p) {
                    const img = document.createElement('img');
                    img.className = 'piece';
                    img.src = `https://www.chess.com/chess-themes/pieces/neo/150/${p.color}${p.type}.png`;
                    sq.appendChild(img);
                }
                const res = analysisResults[gIdx];
                if(res && gHistory[gIdx] && gHistory[gIdx].to === (String.fromCharCode(97+c)+(r+1))) {
                    const icon = document.createElement('div');
                    icon.className = 'eval-icon';
                    icon.style.backgroundColor = res.color;
                    icon.innerText = res.sym;
                    sq.appendChild(icon);
                }
                b.appendChild(sq);
            }
        }
    }

    async function loadGames() {
        const u = document.getElementById('userInp').value;
        const listDiv = document.getElementById('list');
        if(!u) return;
        listDiv.innerHTML = "<div style='padding:20px;'>Mencari di Chess.com...</div>";
        try {
            const res = await fetch(`https://api.chess.com/pub/player/${u}/games/archives`);
            const data = await res.json();
            const last = await (await fetch(data.archives[data.archives.length-1])).json();
            listDiv.innerHTML = "";
            last.games.reverse().slice(0,10).forEach((g, index) => {
                const opp = g.white.username.toLowerCase() === u.toLowerCase() ? g.black.username : g.white.username;
                const item = document.createElement('div');
                item.className = 'game-item';
                item.dataset.pgn = g.pgn; // Simpan PGN di elemen
                item.innerText = `vs ${opp} (${g.time_class})`;
                listDiv.appendChild(item);
            });
        } catch(e) { listDiv.innerHTML = "<div style='padding:20px;'>User tidak ditemukan.</div>"; }
    }

    // PENANGGULANGAN BUG KLIK MOBILE
    function handleListClick(e) {
        const target = e.target.closest('.game-item');
        if (!target) return;

        // Ambil data PGN
        window.finalPgnData = target.dataset.pgn;

        // Visual feedback
        document.querySelectorAll('.game-item').forEach(x => x.classList.remove('selected'));
        target.classList.add('selected');
        
        const btn = document.getElementById('btnAnalisis');
        btn.classList.add('active-btn');
        
        document.getElementById('labelDisplay').innerText = "PGN TERKUNCI";
        document.getElementById('labelDisplay').style.color = "#81b64c";
        
        if (window.navigator.vibrate) window.navigator.vibrate(50); // Getar singkat
    }

    function getEval(fen) {
        return new Promise((resolve) => {
            engine.onmessage = (e) => {
                if (e.data.includes("score cp")) {
                    const match = e.data.match(/score cp (-?\d+)/);
                    if (match) resolve(parseInt(match[1]) / 100);
                }
            };
            engine.postMessage("position fen " + fen);
            engine.postMessage("go movetime 1000"); // 1 detik per langkah agar akurat
        });
    }

    async function startAnalysis() {
        if(!window.finalPgnData) return alert("Sentuh nama lawan di daftar dulu!");
        document.getElementById('loading-overlay').style.display = 'flex';
        
        let temp = new Chess();
        temp.load_pgn(window.finalPgnData);
        gHistory = temp.history({verbose: true});
        temp.reset();
        analysisResults = [];
        let lastScore = 0.2;

        for(let i=0; i < gHistory.length; i++) {
            temp.move(gHistory[i].san);
            document.getElementById('load-pct').innerText = Math.round(((i+1)/gHistory.length)*100) + "%";
            
            const raw = await getEval(temp.fen());
            const score = temp.turn() === 'b' ? raw : -raw;
            const diff = score - lastScore;

            let res = { sym: '✓', color: '#81b64c', label: 'Good' };
            if (diff < -1.5) res = { sym: '??', color: '#fa4143', label: 'Blunder' };
            else if (diff < -0.8) res = { sym: '?', color: '#e6912c', label: 'Mistake' };
            else if (diff > 0.5) res = { sym: '!', color: '#5c8bb0', label: 'Great' };
            else if (Math.abs(diff) < 0.1) res = { sym: '★', color: '#96bc4b', label: 'Best' };

            analysisResults.push({...res, score: score});
            lastScore = score;
        }
        game.reset(); gIdx = -1;
        document.getElementById('loading-overlay').style.display = 'none';
        drawBoard();
    }

    function go(d) {
        if(d === 1 && gIdx < gHistory.length - 1) { gIdx++; game.move(gHistory[gIdx].san); }
        else if(d === -1 && gIdx >= 0) { game.undo(); gIdx--; }
        const r = analysisResults[gIdx];
        if(r) {
            document.getElementById('moveDisplay').innerText = `${gIdx+1}. ${gHistory[gIdx].san}`;
            document.getElementById('scoreDisplay').innerText = (r.score > 0 ? "+" : "") + r.score.toFixed(1);
            document.getElementById('labelDisplay').innerText = r.label;
            document.getElementById('labelDisplay').style.color = r.color;
        }
        drawBoard();
    }
    window.onload = drawBoard;
</script>
</body>
</html>
