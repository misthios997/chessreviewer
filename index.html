<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Review Pro</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    
    <style>
        :root { --bg: #262421; --panel: #312e2b; --green: #81b64c; --brilliant: #15d0b1; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        /* Gambar Coach diganti dengan icon stabil */
        .coach-box { width: 100%; max-width: 400px; background: var(--panel); border-radius: 8px; padding: 15px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; border-bottom: 3px solid #3d3a37; box-sizing: border-box; }
        .coach-icon { font-size: 40px; background: #444; border-radius: 50%; padding: 10px; line-height: 1; }
        .coach-msg { flex: 1; font-size: 14px; color: #ddd; }

        /* Board Container */
        #board-wrapper { width: 100%; max-width: 400px; margin-bottom: 10px; }
        #myBoard { width: 100% !important; border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        /* Controls */
        .footer { width: 100%; max-width: 400px; background: var(--panel); padding: 15px; border-radius: 8px; box-sizing: border-box; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; background: #1b1a17; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .btn { width: 100%; background: var(--green); color: white; border: none; padding: 14px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 5px; }
        
        .status-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; color: #aaa; }
    </style>
</head>
<body>

    <div class="coach-box">
        <div class="coach-icon">👨‍🏫</div>
        <div class="coach-msg" id="coachMsg">"Halo! Tempelkan PGN atau klik Load Games untuk mulai analisis."</div>
    </div>

    <div id="board-wrapper">
        <div id="myBoard"></div>
    </div>

    <div class="footer">
        <input type="text" id="userInput" placeholder="Username Chess.com">
        <button class="btn" style="background: #444;" onclick="getGames()">1. Load Games</button>
        
        <div id="gameList" style="max-height: 80px; overflow-y: auto; margin-bottom: 10px; font-size: 12px;"></div>

        <textarea id="pgnBox" rows="3" placeholder="Atau paste PGN di sini..."></textarea>
        
        <div class="status-row">
            <span>Evaluasi: <b id="eval">0.0</b></span>
            <span id="moveLabel">--</span>
        </div>
        
        <button class="btn" onclick="startReview()">2. Start Review Analysis</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        var moves = [];
        var index = 0;
        var prevEval = 0.3;

        // 1. Inisialisasi Papan
        function init() {
            var config = {
                position: 'start',
                draggable: true,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' // Tema bidak standar
            };
            board = Chessboard('myBoard', config);
            $(window).resize(board.resize);
        }

        // 2. Ambil Game Chess.com
        async function getGames() {
            let user = $('#userInput').val();
            if(!user) return alert("Isi username!");
            $('#gameList').html("Loading...");
            try {
                let res = await fetch(`https://api.chess.com/pub/player/${user}/games/2026/01`);
                let data = await res.json();
                $('#gameList').empty();
                data.games.reverse().slice(0, 5).forEach(g => {
                    $('<div style="padding:5px; border-bottom:1px solid #444; cursor:pointer;">vs '+ (g.white.username == user ? g.black.username : g.white.username) +'</div>')
                    .click(() => { $('#pgnBox').val(g.pgn); alert("PGN Termuat! Klik Start Review."); })
                    .appendTo('#gameList');
                });
            } catch(e) { $('#gameList').html("Gagal ambil data."); }
        }

        // 3. Analisis Review
        function startReview() {
            let pgn = $('#pgnBox').val();
            if (!game.load_pgn(pgn)) return alert("PGN tidak valid atau kosong!");
            
            moves = game.history();
            game.reset();
            board.start();
            index = 0;
            prevEval = 0.3;
            $('#coachMsg').text("Memulai analisis setiap langkah...");
            step();
        }

        function step() {
            if (index >= moves.length) {
                $('#coachMsg').text("Review selesai! Mantap.");
                return;
            }

            let m = moves[index];
            game.move(m);
            board.position(game.fen());

            stockfish.postMessage("position fen " + game.fen());
            stockfish.postMessage("go depth 12");
            
            stockfish.onmessage = function(e) {
                if (e.data.includes("score cp")) {
                    let cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                    let currentEval = (game.turn() == 'b' ? cp : -cp) / 100;
                    
                    updateReviewUI(m, currentEval);
                    index++;
                    setTimeout(step, 500); 
                }
            };
        }

        function updateReviewUI(move, score) {
            let diff = Math.abs(score - prevEval);
            let label = "Good";
            let color = "white";

            if (diff > 2.5) { label = "!! Brilliant"; color = "#15d0b1"; }
            else if (diff > 1.5 && score < prevEval) { label = "?? Blunder"; color = "#fa4143"; }
            else if (diff > 0.8) { label = "? Mistake"; color = "#ffa459"; }

            $('#eval').text(score);
            $('#moveLabel').text(move + ": " + label).css('color', color);
            $('#coachMsg').text("Langkah " + move + " dinilai " + label + ". Skor: " + score);
            prevEval = score;
        }

        $(document).ready(init);
    </script>
</body>
</html>
