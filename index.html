<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Review AI - Stable Edition</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.0.5/assets/chessground.base.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.0.5/assets/chessground.brown.css">

    <style>
        :root { --bg: #161512; --panel: #262421; --accent: #81b64c; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
        
        .wrapper { width: 100%; max-width: 400px; }
        
        /* Box Papan - Menggunakan Chessground agar Bidak Muncul via SVG */
        .board-container { width: 100%; aspect-ratio: 1/1; margin-bottom: 15px; border: 2px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .cg-wrap { width: 100%; height: 100%; }

        .panel { background: var(--panel); padding: 15px; border-radius: 12px; box-sizing: border-box; }
        .eval-header { display: flex; justify-content: space-between; align-items: center; background: #1a1917; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid var(--accent); }
        #score { font-size: 28px; font-weight: bold; }
        
        .badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .badge { font-size: 10px; padding: 10px; text-align: center; font-weight: bold; border-radius: 6px; opacity: 0.15; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .active { opacity: 1; border: 1px solid white; box-shadow: 0 0 15px var(--accent); transform: scale(1.03); }

        .brilliant { background: #01ebbb; color: #000; } .excellent { background: #95bb4a; }
        .mistake { background: #f6c045; color: #000; } .blunder { background: #f9412d; }

        textarea { width: 100%; height: 65px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 10px; font-size: 12px; margin-bottom: 10px; box-sizing: border-box; }
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 6px; width: 100%; padding: 16px; margin-bottom: 10px; }
        .btn-main { background: var(--accent); color: white; }
        .nav-wrap { display: flex; gap: 10px; }
        .btn-nav { background: #3c3a37; color: white; flex: 1; height: 50px; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="board-container">
            <div id="board" class="cg-wrap brown"></div>
        </div>

        <div class="panel">
            <div class="eval-header">
                <span id="score">+0.30</span>
                <small id="status">Stockfish 10 Ready</small>
            </div>

            <div class="badge-grid">
                <div id="m-brilliant" class="badge brilliant">!! BRILLIANT</div>
                <div id="m-excellent" class="badge excellent">🌟 EXCELLENT</div>
                <div id="m-mistake" class="badge mistake">?! MISTAKE</div>
                <div id="m-blunder" class="badge blunder">?? BLUNDER</div>
            </div>

            <textarea id="pgnInput" placeholder="Paste PGN here..."></textarea>
            <button class="btn-main" onclick="importPGN()">IMPORT & REVIEW</button>
            
            <div class="nav-wrap">
                <button class="btn-nav" onclick="nav(-1)">PREV</button>
                <button class="btn-nav" onclick="nav(1)">NEXT</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chessground@9.0.5/dist/chessground.js"></script>

    <script>
        let ground, game = new Chess(), history = [], index = -1, lastEval = 0.3;
        const stockfish = new Worker("https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js");

        // Inisialisasi Papan Chessground (Mendukung SVG Inbuilt)
        const boardEl = document.getElementById('board');
        ground = Chessground(boardEl, {
            fen: game.fen(),
            movable: { color: 'both', free: false }
        });

        function analyze(fen, san) {
            document.getElementById('status').innerText = "Analyzing Depth 13...";
            stockfish.postMessage('position fen ' + fen);
            stockfish.postMessage('go depth 13');
            
            stockfish.onmessage = (e) => {
                if (e.data.includes('score cp')) {
                    let cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                    let score = (cp / 100).toFixed(2);
                    document.getElementById('score').innerText = score > 0 ? '+' + score : score;
                    
                    let diff = Math.abs(lastEval - score);
                    document.querySelectorAll('.badge').forEach(b => b.classList.remove('active'));

                    if (diff >= 1.8) document.getElementById('m-blunder').classList.add('active');
                    else if (diff >= 0.8) document.getElementById('m-mistake').classList.add('active');
                    else if (san.includes('x') && diff < 0.2) document.getElementById('m-brilliant').classList.add('active');
                    else document.getElementById('m-excellent').classList.add('active');

                    lastEval = parseFloat(score);
                    document.getElementById('status').innerText = "Analysis Done";
                }
            };
        }

        function importPGN() {
            if (game.load_pgn(document.getElementById('pgnInput').value)) {
                history = game.history({ verbose: true });
                game.reset(); index = -1;
                ground.set({ fen: game.fen() });
                alert("Game Loaded!");
            }
        }

        function nav(d) {
            if (d === 1 && index < history.length - 1) {
                index++; game.move(history[index].san);
                ground.set({ fen: game.fen(), lastMove: [history[index].from, history[index].to] });
                analyze(game.fen(), history[index].san);
            } else if (d === -1 && index >= 0) {
                game.undo(); index--;
                ground.set({ fen: game.fen() });
            }
        }
    </script>
</body>
</html>
