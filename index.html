<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Master Academy</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #161512;
            --bg-sidebar: #262421;
            --accent: #81b64c;
            --text-main: #bababa;
            --neo-light: #ebecd0;
            --neo-dark: #779556;
        }

        body {
            background-color: var(--bg-body);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Sidebar Styling ala Chessreps */
        .sidebar {
            background-color: var(--bg-sidebar);
            height: 100vh;
            border-right: 1px solid #3d3b38;
            padding: 0;
        }

        .nav-item-custom {
            padding: 15px 25px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.2s;
            border-bottom: 1px solid #312e2b;
            text-decoration: none;
        }

        .nav-item-custom:hover, .nav-item-custom.active {
            background-color: #312e2b;
            color: white;
            border-left: 4px solid var(--accent);
        }

        .nav-item-custom.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Board Styling */
        #board {
            width: 100%;
            max-width: 520px;
            margin: auto;
            border: 2px solid #3d3b38;
        }

        .white-1e1d7 { background-color: var(--neo-light) !important; }
        .black-3c85d { background-color: var(--neo-dark) !important; }

        /* Training Panel */
        .training-panel {
            background: #262421;
            border-radius: 4px;
            padding: 20px;
        }

        .btn-action {
            background-color: #3d3b38;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 4px;
        }

        .btn-action:hover { background-color: #4d4b48; }

        .progress-container {
            background: #312e2b;
            height: 8px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .progress-bar-fill {
            background: var(--accent);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s;
        }

        .coach-msg {
            color: var(--accent);
            font-size: 0.95rem;
            line-height: 1.5;
            padding: 15px;
            background: #1a1917;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 sidebar">
            <div class="p-4 border-bottom border-dark">
                <h5 class="m-0 text-white fw-bold"><i class="fas fa-chess-knight me-2"></i>REPS ACADEMY</h5>
            </div>
            <div id="nav-list">
                <a class="nav-item-custom active" onclick="loadModule('basic')">
                    <i class="fas fa-graduation-cap me-3"></i> Basic Class
                </a>
                <a class="nav-item-custom" id="nav-mid" onclick="loadModule('mid')">
                    <i class="fas fa-bolt me-3"></i> Mid Class <i class="fas fa-lock ms-auto small"></i>
                </a>
                <a class="nav-item-custom" id="nav-high" onclick="loadModule('high')">
                    <i class="fas fa-crown me-3"></i> High Class <i class="fas fa-lock ms-auto small"></i>
                </a>
                <a class="nav-item-custom" onclick="loadModule('opening')">
                    <i class="fas fa-book-open me-3"></i> Opening Book
                </a>
                <a class="nav-item-custom" onclick="window.location.reload()">
                    <i class="fas fa-robot me-3"></i> Play vs Bot
                </a>
            </div>
        </div>

        <div class="col-md-9 col-lg-10 p-4">
            <div class="row justify-content-center">
                <div class="col-xl-7">
                    <div id="board"></div>
                    <div class="d-flex mt-3 gap-2">
                        <button class="btn-action" onclick="undoMove()"><i class="fas fa-undo me-1"></i> Undo</button>
                        <button class="btn-action" onclick="resetBoard()"><i class="fas fa-redo me-1"></i> Reset</button>
                    </div>
                </div>
                
                <div class="col-xl-4 mt-4 mt-xl-0">
                    <div class="training-panel">
                        <h4 id="title-text">Basic: Level 1</h4>
                        <div class="progress-container">
                            <div class="progress-bar-fill" id="progress-bar" style="width: 0%"></div>
                        </div>
                        
                        <div class="coach-msg mb-4" id="coach-text">
                            Selamat datang. Mari kita mulai dengan dasar-dasar pergerakan bidak.
                        </div>

                        <div id="lesson-sub-list">
                            </div>

                        <div class="mt-4 pt-4 border-top border-dark small text-secondary">
                            <div>Status: <span id="status-text" class="text-white">Ready</span></div>
                            <div id="history-text" class="mt-2" style="font-family: monospace;">History: -</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    let board = null;
    let game = new Chess();
    let currentModule = 'basic';
    
    // Data Pelajaran Bertahap
    const academyData = {
        basic: [
            { id: 'b1', name: "Pawn Structure", fen: "8/8/8/8/8/8/PPPPPPPP/8 w - - 0 1", msg: "Pion adalah fondasi catur. Ingat, pion tidak bisa mundur!" },
            { id: 'b2', name: "Knight Jumps", fen: "8/8/8/8/8/2N5/8/8 w - - 0 1", msg: "Kuda melompat dengan pola L. Cobalah melangkah ke pusat." },
            { id: 'b3', name: "Bishop Power", fen: "8/8/8/8/8/8/8/2B2B2 w - - 0 1", msg: "Gajah bergerak diagonal di warnanya masing-masing." }
        ],
        mid: [
            { id: 'm1', name: "The Fork", fen: "6k1/8/3n4/8/1P1P4/2P5/8/6K1 b - - 0 1", msg: "Taktik Fork: Mengancam dua perwira sekaligus." },
            { id: 'm2', name: "The Pin", fen: "4r1k1/8/4q3/4R3/8/8/8/6K1 w - - 0 1", msg: "Pin: Membuat perwira lawan tidak bisa bergerak." }
        ],
        high: [
            { id: 'h1', name: "Lucena Position", fen: "1K6/1P1k4/8/8/8/8/1r6/2R5 w - - 0 1", msg: "Teknik endgame paling krusial untuk menang dengan benteng." }
        ],
        opening: [
            { id: 'o1', name: "Sicilian Defense", fen: "rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq c6 0 2", msg: "Pembukaan paling populer untuk melawan e4." }
        ]
    };

    let userProgress = JSON.parse(localStorage.getItem('chess_reps_data')) || {
        completed: [],
        score: 0
    };

    function init() {
        board = Chessboard('board', {
            draggable: true,
            position: 'start',
            onDrop: handleMove,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });
        loadModule('basic');
        updateUI();
    }

    function handleMove(source, target) {
        let move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';

        document.getElementById('status-text').innerText = "Move: " + move.san;
        document.getElementById('history-text').innerText = "History: " + game.history().join(', ');
        
        // Simulasikan kemajuan
        userProgress.score += 1;
        save();
    }

    function loadModule(mod) {
        currentModule = mod;
        const listContainer = document.getElementById('lesson-sub-list');
        listContainer.innerHTML = '';
        
        // Update Sidebar Active State
        document.querySelectorAll('.nav-item-custom').forEach(el => el.classList.remove('active'));
        
        academyData[mod].forEach((lesson, index) => {
            const isCompleted = userProgress.completed.includes(lesson.id);
            const isLocked = index > 0 && !userProgress.completed.includes(academyData[mod][index-1].id);

            const btn = document.createElement('button');
            btn.className = `btn btn-action w-100 mb-2 text-start ${isLocked ? 'opacity-50' : ''}`;
            btn.innerHTML = `${isCompleted ? '✅' : '○'} ${lesson.name} ${isLocked ? '<i class="fas fa-lock float-end mt-1"></i>' : ''}`;
            
            btn.onclick = () => {
                if(!isLocked) startLesson(lesson);
            };
            listContainer.appendChild(btn);
        });

        document.getElementById('title-text').innerText = mod.charAt(0).toUpperCase() + mod.slice(1) + " Modules";
    }

    function startLesson(lesson) {
        game.load(lesson.fen);
        board.position(lesson.fen);
        document.getElementById('coach-text').innerText = lesson.msg;
        
        // Tandai selesai setelah 2 detik
        setTimeout(() => {
            if(!userProgress.completed.includes(lesson.id)) {
                userProgress.completed.push(lesson.id);
                save();
                loadModule(currentModule);
                updateUI();
            }
        }, 3000);
    }

    function updateUI() {
        const basicDone = academyData.basic.every(l => userProgress.completed.includes(l.id));
        const midDone = academyData.mid.every(l => userProgress.completed.includes(l.id));
        
        // Unlock Logic
        if(basicDone) document.getElementById('nav-mid').classList.remove('locked');
        if(midDone) document.getElementById('nav-high').classList.remove('locked');

        // Progress Bar
        let total = academyData.basic.length + academyData.mid.length + academyData.high.length;
        let done = userProgress.completed.length;
        document.getElementById('progress-bar').style.width = (done / total * 100) + "%";
    }

    function save() {
        localStorage.setItem('chess_reps_data', JSON.stringify(userProgress));
    }

    function undoMove() { game.undo(); board.position(game.fen()); }
    function resetBoard() { game.reset(); board.start(); }

    window.onload = init;
    $(window).resize(() => board.resize());
</script>

</body>
</html>
