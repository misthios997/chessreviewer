<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Practice Chess Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { background-color: #312e2b; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        .bg-chess-dark { background-color: #262421; }
        .bg-chess-button { background-color: #454241; }
        .bg-chess-green { background-color: #81b64c; }
        .active-side { border: 3px solid #81b64c !important; }
        #mainBoard { width: 90vw; max-width: 400px; margin: 0 auto; }
        .scroll-v { overflow-y: auto; max-height: 80vh; }
    </style>
</head>
<body>

<div id="screen-menu" class="flex flex-col items-center justify-center min-h-screen p-4">
    <h1 class="text-4xl font-black mb-10 italic tracking-tighter uppercase">Practice Chess</h1>
    <div class="grid grid-cols-1 gap-4 w-full max-w-xs">
        <button onclick="showSection('screen-setup')" class="bg-chess-green py-5 rounded-xl font-bold text-xl active:scale-95 transition-all">Play Bot</button>
        <button onclick="showSection('screen-training')" class="bg-chess-button py-4 rounded-xl font-semibold active:scale-95">Training</button>
        <button class="bg-chess-button opacity-50 py-4 rounded-xl font-semibold cursor-not-allowed text-gray-500">Game Review</button>
        <button onclick="alert('Belum ada riwayat.')" class="bg-chess-button py-4 rounded-xl font-semibold active:scale-95">History</button>
    </div>
</div>

<div id="screen-setup" class="hidden min-h-screen p-4 flex flex-col">
    <button onclick="showSection('screen-menu')" class="mb-4 text-gray-400 self-start">← Kembali</button>
    <div class="bg-chess-dark p-6 rounded-2xl shadow-2xl space-y-5">
        <h2 class="text-xl font-bold text-center border-b border-gray-700 pb-2">GAME SETTINGS</h2>
        
        <div class="space-y-4">
            <div>
                <label class="text-xs text-gray-400">PILIH BOT</label>
                <select id="bot-config" class="w-full bg-[#3d3a37] p-3 rounded-lg mt-1 outline-none">
                    <option value="0|Martin|400">Martin (400)</option>
                    <option value="5|Nelson|1200">Nelson (1200)</option>
                    <option value="20|Magnus|2882">Magnus (2882)</option>
                    <option value="20|Fischer|3100">Fischer (3100)</option>
                </select>
            </div>

            <div>
                <label class="text-xs text-gray-400">PLAY AS</label>
                <div class="flex gap-2 mt-1">
                    <button onclick="setSide('w')" id="side-w" class="flex-1 bg-chess-button py-3 rounded-lg font-bold active-side">White</button>
                    <button onclick="setSide('b')" id="side-b" class="flex-1 bg-chess-button py-3 rounded-lg font-bold">Black</button>
                </div>
            </div>

            <div>
                <label class="text-xs text-gray-400">CHESS VARIANT</label>
                <select id="variant-config" class="w-full bg-[#3d3a37] p-3 rounded-lg mt-1 outline-none">
                    <option value="standard">Standard</option>
                    <option value="all-queen">All Queen</option>
                    <option value="all-rook">All Rook</option>
                </select>
            </div>

            <button onclick="initGame()" class="w-full bg-chess-green py-5 rounded-xl font-black text-xl shadow-lg active:bg-green-400 transition-colors">MULAI MAIN</button>
        </div>
    </div>
</div>

<div id="screen-game" class="hidden h-screen flex flex-col p-2 bg-[#312e2b]">
    <div class="flex items-center gap-2 mb-2">
        <button onclick="showSection('screen-menu')" class="bg-gray-700 px-3 py-1 rounded text-xs">← Menu</button>
        <div class="flex-1 flex justify-between bg-[#262421] p-2 rounded">
            <span id="display-bot-name" class="font-bold text-sm">Bot</span>
            <span id="bot-timer" class="bg-black px-2 rounded font-mono text-sm">--:--</span>
        </div>
    </div>

    <div class="flex-1 flex items-center justify-center">
        <div id="mainBoard"></div>
    </div>

    <div class="flex justify-between items-center p-2 mt-2 bg-[#262421] rounded">
        <span class="font-bold text-sm">YOU</span>
        <span id="player-timer" class="bg-black px-2 rounded font-mono text-sm">--:--</span>
    </div>

    <div class="grid grid-cols-3 gap-2 mt-4 pb-6">
        <button onclick="game.undo(); game.undo(); board.position(game.fen())" class="bg-chess-button py-3 rounded font-bold text-xs">Undo</button>
        <button onclick="alert('Feature coming soon')" class="bg-chess-button py-3 rounded font-bold text-xs opacity-50">Redo</button>
        <button onclick="location.reload()" class="bg-red-900 py-3 rounded font-bold text-xs">Resign</button>
    </div>
</div>

<div id="screen-training" class="hidden h-screen p-6 flex flex-col">
    <button onclick="showSection('screen-menu')" class="mb-4 text-gray-400">← Kembali</button>
    <h2 class="text-2xl font-black mb-6 italic border-b border-gray-700 pb-2">TRAINING MODE</h2>
    <div class="flex-1 scroll-v space-y-4">
        <div onclick="startTraining('r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3', 'Italian Game')" class="bg-chess-dark p-4 rounded-xl border-l-4 border-chess-green active:scale-95 transition-all">
            <h3 class="font-bold">Italian Game</h3>
            <p class="text-xs text-gray-400 mt-1">Latih pembukaan paling klasik.</p>
        </div>
        <div onclick="startTraining('rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq c6 0 2', 'Sicilian Defense')" class="bg-chess-dark p-4 rounded-xl border-l-4 border-blue-500 active:scale-95 transition-all">
            <h3 class="font-bold">Sicilian Defense</h3>
            <p class="text-xs text-gray-400 mt-1">Pembukaan paling tajam untuk Hitam.</p>
        </div>
        <div onclick="startTraining('rnbqkbnr/ppp1pppp/8/3p4/2PP4/8/PP2PPPP/RNBQKBNR b KQkq c3 0 2', 'Queen\'s Gambit')" class="bg-chess-dark p-4 rounded-xl border-l-4 border-yellow-600 active:scale-95 transition-all">
            <h3 class="font-bold">Queen's Gambit</h3>
            <p class="text-xs text-gray-400 mt-1">Korbankan pion untuk dominasi pusat.</p>
        </div>
    </div>
</div>

<script>
    let board = null;
    let game = new Chess();
    let playerSide = 'w';
    let stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
    let skillLevel = 0;

    function showSection(id) {
        $('body > div').addClass('hidden');
        $('#' + id).removeClass('hidden');
    }

    function setSide(s) {
        playerSide = s;
        $('#side-w, #side-b').removeClass('active-side');
        $(`#side-${s}`).addClass('active-side');
    }

    function onDrop(source, target) {
        let move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';
        window.setTimeout(makeEngineMove, 300);
    }

    function makeEngineMove() {
        if (game.game_over()) return;
        stockfish.postMessage(`position fen ${game.fen()}`);
        stockfish.postMessage(`go depth ${skillLevel + 5}`);
        stockfish.onmessage = function(e) {
            if (e.data.startsWith('bestmove')) {
                const m = e.data.split(' ')[1];
                game.move({ from: m.substring(0, 2), to: m.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
            }
        };
    }

    function initGame() {
        // Fix: Update UI data sebelum pindah section
        const botData = $('#bot-config').val().split('|');
        skillLevel = parseInt(botData[0]);
        $('#display-bot-name').text(botData[1]);

        showSection('screen-game');

        // Penting: Inisialisasi papan HARUS setelah elemen visual muncul
        setTimeout(() => {
            game = new Chess();
            const variant = $('#variant-config').val();
            if(variant === 'all-queen') game.load('qqqqkqqq/pppppppp/8/8/8/8/PPPPPPPP/QQQQKQQQ w KQkq - 0 1');
            if(variant === 'all-rook') game.load('rrrrkrrr/pppppppp/8/8/8/8/PPPPPPPP/RRRRKRRR w KQkq - 0 1');

            board = Chessboard('mainBoard', {
                draggable: true,
                position: game.fen(),
                orientation: playerSide === 'w' ? 'white' : 'black',
                onDrop: onDrop,
                onSnapEnd: () => board.position(game.fen()),
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            if (playerSide === 'b') makeEngineMove();
        }, 200);
    }

    function startTraining(fen, name) {
        playerSide = 'w';
        $('#display-bot-name').text(name);
        showSection('screen-game');
        setTimeout(() => {
            game = new Chess(fen);
            board = Chessboard('mainBoard', {
                draggable: true,
                position: fen,
                onDrop: onDrop,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
        }, 200);
    }
</script>
</body>
</html>
