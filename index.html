<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chess Bot Mastery - Fixed</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root {
            --bg-color: #1a252f;
            --container-bg: #2c3e50;
            --accent-color: #27ae60;
        }

        /* FULL LOCK: Mencegah scroll, zoom, dan goyang */
        html, body { 
            overflow: hidden; 
            position: fixed; 
            width: 100%; 
            height: 100%;
            margin: 0;
            padding: 0;
            touch-action: none; /* Kunci semua gesture browser */
            background: var(--bg-color);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container { 
            background: var(--container-bg); 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            width: 90%; 
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            touch-action: auto; /* Izinkan klik di dalam menu */
        }

        .hidden { display: none; }

        input, button { 
            padding: 12px; 
            margin: 5px; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px;
            outline: none;
        }

        button { 
            cursor: pointer; 
            background: var(--accent-color); 
            color: white; 
            font-weight: bold;
            min-width: 80px;
        }

        .bot-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 15px 0;
            max-height: 250px;
            overflow-y: auto;
        }

        .bot-card { 
            background: #1a252f; 
            padding: 8px; 
            border-radius: 6px; 
            border: 2px solid transparent;
            font-size: 12px;
        }

        .bot-card.selected { border-color: #f1c40f; background: #34495e; }

        #board { 
            width: 100%; 
            margin: 10px auto; 
            touch-action: none; /* Pastikan interaksi hanya untuk bidak */
        }

        .info-panel { 
            display: flex; 
            justify-content: space-between; 
            padding: 8px 12px; 
            background: #161d24; 
            border-radius: 6px; 
            font-size: 13px;
            margin-bottom: 5px;
        }

        .role { font-weight: bold; padding: 1px 4px; border-radius: 3px; font-size: 10px; margin-right: 3px; }
        .role-gm { background: #e74c3c; }
        .role-cm { background: #f39c12; }
        
        /* Highlight Square untuk Tap & Move */
        .highlight-yellow {
            box-shadow: inset 0 0 3px 3px yellow;
        }
    </style>
</head>
<body>

<div id="scene1" class="container">
    <h2>Chess Master</h2>
    <input type="text" id="username" placeholder="Username..." style="width: 80%">
    <br>
    <button onclick="goToScene2()" style="width: 85%">Play Game</button>
</div>

<div id="scene2" class="container hidden">
    <h3 style="margin:0">Pilih Lawan</h3>
    <div class="bot-list" id="bot-list"></div>
    <p style="margin:5px; font-size:14px">Main Sebagai:</p>
    <div style="display:flex; justify-content: center; gap: 5px;">
        <button onclick="setSide('w')">White</button>
        <button onclick="setSide('b')">Black</button>
        <button onclick="setSide('r')">Random</button>
    </div>
</div>

<div id="scene3" class="container hidden">
    <div class="info-panel" id="opponent-info"></div>
    <div id="board"></div>
    <div class="info-panel"><span id="display-username">Player</span></div>
    <div style="display:flex; justify-content: center; gap: 8px;">
        <button onclick="undoMove()" style="background: #3498db">Undo</button>
        <button onclick="resign()" style="background: #e74c3c">Resign</button>
    </div>
</div>

<div id="scene4" class="container hidden">
    <h1 id="result-title"></h1>
    <p id="result-desc"></p>
    <button onclick="location.reload()">Back to Menu</button>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    let board = null;
    let game = new Chess();
    let playerColor = 'w';
    let selectedBotIdx = null;
    let sfWorker = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
    let sourceSquare = null;

    const bots = [
        { name: "Martin", elo: 400, depth: 1 },
        { name: "David", elo: 700, depth: 2 },
        { name: "Nelson", elo: 1000, depth: 4 },
        { name: "Poltak", elo: 1500, depth: 8 },
        { name: "Paul", elo: 2000, depth: 12 },
        { name: "Hikaru Nakamura", elo: 2500, depth: 15 },
        { name: "Magnus Carlsen", elo: 2882, depth: 18 },
        { name: "Engine", elo: 3293, depth: 20 }
    ];

    // FIX LOCK: Cegah scrolling pada mobile
    document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

    function getRoleHTML(elo) {
        if (elo >= 2500) return '<span class="role role-gm">GM</span>';
        if (elo >= 2000) return '<span class="role role-cm">CM</span>';
        return '';
    }

    function goToScene2() {
        if (!document.getElementById('username').value) return alert("Isi nama dulu!");
        document.getElementById('display-username').innerText = document.getElementById('username').value;
        document.getElementById('scene1').classList.add('hidden');
        document.getElementById('scene2').classList.remove('hidden');
        renderBots();
    }

    function renderBots() {
        const list = document.getElementById('bot-list');
        list.innerHTML = '';
        bots.forEach((bot, i) => {
            const card = document.createElement('div');
            card.className = `bot-card ${selectedBotIdx === i ? 'selected' : ''}`;
            card.innerHTML = `${getRoleHTML(bot.elo)} <b>${bot.name}</b><br>ELO ${bot.elo}`;
            card.onclick = () => { selectedBotIdx = i; renderBots(); };
            list.appendChild(card);
        });
    }

    function setSide(side) {
        if (selectedBotIdx === null) return alert("Pilih Bot Lawan!");
        playerColor = side === 'r' ? (Math.random() > 0.5 ? 'w' : 'b') : side;
        document.getElementById('scene2').classList.add('hidden');
        document.getElementById('scene3').classList.remove('hidden');
        
        const bot = bots[selectedBotIdx];
        document.getElementById('opponent-info').innerHTML = `<span>${getRoleHTML(bot.elo)} ${bot.name}</span> <small>Bot Thinking...</small>`;
        
        initBoard();
        if (playerColor === 'b') setTimeout(askStockfish, 500);
    }

    // --- LOGIKA TAP & MOVE TERBARU ---
    function removeHighlights() {
        $('#board .square-55d6').removeClass('highlight-yellow');
    }

    function onSquareClick(square) {
        // Hanya jalan jika giliran player
        if (game.turn() !== playerColor[0]) return;

        const piece = game.get(square);

        // Jika klik pertama (pilih bidak)
        if (sourceSquare === null) {
            if (piece && piece.color === playerColor[0]) {
                sourceSquare = square;
                removeHighlights();
                $(`#board .square-${square}`).addClass('highlight-yellow');
            }
        } 
        // Jika klik kedua (pindah bidak)
        else {
            let move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
            
            if (move === null) {
                // Jika tap di bidak sendiri yang lain, pindah pilihan
                if (piece && piece.color === playerColor[0]) {
                    sourceSquare = square;
                    removeHighlights();
                    $(`#board .square-${square}`).addClass('highlight-yellow');
                } else {
                    sourceSquare = null;
                    removeHighlights();
                }
            } else {
                // Langkah Valid
                sourceSquare = null;
                removeHighlights();
                board.position(game.fen());
                checkGameOver();
                if (!game.game_over()) setTimeout(askStockfish, 300);
            }
        }
    }

    function askStockfish() {
        const depth = bots[selectedBotIdx].depth;
        sfWorker.postMessage(`position fen ${game.fen()}`);
        sfWorker.postMessage(`go depth ${depth}`);
    }

    sfWorker.onmessage = function(event) {
        if (event.data.includes('bestmove')) {
            const moveStr = event.data.split(' ')[1];
            game.move({ from: moveStr.substring(0, 2), to: moveStr.substring(2, 4), promotion: 'q' });
            board.position(game.fen());
            checkGameOver();
        }
    };

    function initBoard() {
        const config = {
            draggable: true,
            position: 'start',
            orientation: playerColor === 'w' ? 'white' : 'black',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDrop: function(source, target) {
                let move = game.move({ from: source, to: target, promotion: 'q' });
                if (move === null) return 'snapback';
                removeHighlights();
                sourceSquare = null;
                checkGameOver();
                setTimeout(askStockfish, 300);
            },
            onSnapEnd: () => board.position(game.fen())
        };
        board = Chessboard('board', config);

        // Bind Klik Manual untuk Tap & Move
        $('#board').on('click', '.square-55d6', function() {
            const square = $(this).attr('data-square');
            onSquareClick(square);
        });
    }

    function checkGameOver() {
        if (game.in_checkmate()) showResult(game.turn() === 'w' ? "Black Wins" : "White Wins", "Checkmate!");
        else if (game.in_draw()) showResult("Draw", "Stalemate / Remis");
    }

    function showResult(title, desc) {
        document.getElementById('scene3').classList.add('hidden');
        document.getElementById('scene4').classList.remove('hidden');
        document.getElementById('result-title').innerText = title;
        document.getElementById('result-desc').innerText = desc;
    }

    function undoMove() { 
        game.undo(); game.undo(); 
        board.position(game.fen()); 
        removeHighlights();
        sourceSquare = null;
    }
    
    function resign() { showResult(playerColor === 'w' ? "Black Wins" : "White Wins", "Resignation"); }

</script>
</body>
</html>
