<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chess Master Pro - Ultimate Lock</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root {
            --bg-color: #1a1a1a;
            --container-bg: #2d2d2d;
            --accent-color: #4CAF50;
        }

        /* HARD LOCK: Mematikan Scroll dan Zoom */
        html, body { 
            overflow: hidden; 
            position: fixed; 
            width: 100vw; 
            height: 100vh;
            margin: 0;
            padding: 0;
            touch-action: none; /* Kunci gesture zoom & scroll */
            background: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        .container { 
            background: var(--container-bg); 
            padding: 20px; 
            border-radius: 15px; 
            text-align: center; 
            width: 90%; 
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            touch-action: auto; 
        }

        .hidden { display: none; }

        input, button { 
            padding: 12px; 
            margin: 5px; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px;
            outline: none;
        }

        button { 
            cursor: pointer; 
            background: var(--accent-color); 
            color: white; 
            font-weight: bold;
            transition: 0.2s;
        }

        button:active { transform: scale(0.95); }

        .bot-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .bot-card { 
            background: #1e1e1e; 
            padding: 10px; 
            border-radius: 8px; 
            border: 2px solid #333;
            font-size: 13px;
        }

        .bot-card.selected { border-color: #f1c40f; background: #383838; }

        #board { 
            width: 100%; 
            margin: 15px auto; 
            touch-action: none;
        }

        .info-panel { 
            display: flex; 
            justify-content: space-between; 
            padding: 10px; 
            background: #111; 
            border-radius: 8px; 
            font-size: 13px;
            margin-bottom: 5px;
            border-left: 4px solid var(--accent-color);
        }

        .role { font-weight: bold; padding: 2px 5px; border-radius: 4px; font-size: 10px; margin-right: 5px; }
        .role-gm { background: #ff4d4d; color: white; }
        .role-cm { background: #ffa502; color: white; }
        
        .highlight-sq { box-shadow: inset 0 0 5px 5px rgba(255, 255, 0, 0.7); }
    </style>
</head>
<body>

<div id="scene1" class="container">
    <h2>Chess Master</h2>
    <input type="text" id="username" placeholder="Username..." style="width: 80%">
    <br>
    <button onclick="goToScene2()" style="width: 85%">Play Game</button>
</div>

<div id="scene2" class="container hidden">
    <h3 style="margin:0">Pilih Lawan</h3>
    <div class="bot-list" id="bot-list"></div>
    <div style="display:flex; justify-content: space-around;">
        <button onclick="setSide('w')">White</button>
        <button onclick="setSide('b')">Black</button>
    </div>
</div>

<div id="scene3" class="container hidden">
    <div class="info-panel" id="opponent-info"></div>
    <div id="board"></div>
    <div class="info-panel"><span id="display-username">Player</span></div>
    <div style="display:flex; justify-content: center; gap: 10px;">
        <button onclick="undoMove()" style="background: #2196F3">Undo</button>
        <button onclick="resign()" style="background: #f44336">Resign</button>
    </div>
</div>

<div id="scene4" class="container hidden">
    <h1 id="result-title"></h1>
    <p id="result-desc"></p>
    <button onclick="location.reload()">Main Lagi</button>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    // 1. HARD LOCK SCRIPT
    window.addEventListener('wheel', e => e.preventDefault(), { passive: false });
    window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturestart', e => e.preventDefault());

    let board = null;
    let game = new Chess();
    let playerColor = 'w';
    let selectedBotIdx = null;
    let sfWorker = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
    let sourceSquare = null;

    const bots = [
        { name: "Martin", elo: 400, depth: 1, skill: 1 },
        { name: "David", elo: 700, depth: 2, skill: 4 },
        { name: "Nelson", elo: 1000, depth: 4, skill: 7 },
        { name: "Poltak", elo: 1500, depth: 8, skill: 12 },
        { name: "Paul", elo: 2000, depth: 12, skill: 16 },
        { name: "Hikaru Nakamura", elo: 2500, depth: 16, skill: 20 },
        { name: "Magnus Carlsen", elo: 2882, depth: 20, skill: 20 },
        { name: "Engine", elo: 3293, depth: 22, skill: 20 }
    ];

    function goToScene2() {
        if (!$("#username").val()) return alert("Isi nama!");
        $("#display-username").text($("#username").val());
        $("#scene1").addClass("hidden");
        $("#scene2").removeClass("hidden");
        renderBots();
    }

    function renderBots() {
        const list = $("#bot-list").empty();
        bots.forEach((bot, i) => {
            let role = bot.elo >= 2500 ? '<span class="role role-gm">GM</span>' : (bot.elo >= 2000 ? '<span class="role role-cm">CM</span>' : '');
            let card = $(`<div class="bot-card ${selectedBotIdx === i ? 'selected' : ''}">${role}<b>${bot.name}</b><br>ELO ${bot.elo}</div>`);
            card.click(() => { selectedBotIdx = i; renderBots(); });
            list.append(card);
        });
    }

    function setSide(side) {
        if (selectedBotIdx === null) return alert("Pilih bot!");
        playerColor = side;
        $("#scene2").addClass("hidden");
        $("#scene3").removeClass("hidden");
        
        const b = bots[selectedBotIdx];
        $("#opponent-info").html(`<span>${b.elo >= 2000 ? (b.elo >= 2500 ? '(GM) ' : '(CM) ') : ''}${b.name} (${b.elo})</span>`);
        
        initBoard();
        if (playerColor === 'b') askStockfish();
    }

    // --- TAP & MOVE ENGINE ---
    function handleSquareClick(square) {
        if (game.turn() !== playerColor[0]) return;

        const piece = game.get(square);

        if (sourceSquare === null) {
            if (piece && piece.color === playerColor[0]) {
                sourceSquare = square;
                $(".square-55d6").removeClass("highlight-sq");
                $(".square-" + square).addClass("highlight-sq");
            }
        } else {
            let move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
            $(".square-55d6").removeClass("highlight-sq");
            
            if (move === null) {
                if (piece && piece.color === playerColor[0]) {
                    sourceSquare = square;
                    $(".square-" + square).addClass("highlight-sq");
                } else {
                    sourceSquare = null;
                }
            } else {
                sourceSquare = null;
                board.position(game.fen());
                checkGameOver();
                if (!game.game_over()) setTimeout(askStockfish, 400);
            }
        }
    }

    function askStockfish() {
        const bot = bots[selectedBotIdx];
        sfWorker.postMessage('uci');
        sfWorker.postMessage(`setoption name Skill Level value ${bot.skill}`);
        sfWorker.postMessage('position fen ' + game.fen());
        sfWorker.postMessage('go depth ' + bot.depth);
    }

    sfWorker.onmessage = (e) => {
        if (e.data.includes('bestmove')) {
            const m = e.data.split(' ')[1];
            game.move({ from: m.slice(0,2), to: m.slice(2,4), promotion: 'q' });
            board.position(game.fen());
            checkGameOver();
        }
    };

    function initBoard() {
        board = Chessboard('board', {
            draggable: true,
            position: 'start',
            orientation: playerColor === 'w' ? 'white' : 'black',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDrop: (s, t) => {
                let move = game.move({ from: s, to: t, promotion: 'q' });
                if (move === null) return 'snapback';
                sourceSquare = null;
                $(".square-55d6").removeClass("highlight-sq");
                checkGameOver();
                setTimeout(askStockfish, 400);
            },
            onSnapEnd: () => board.position(game.fen())
        });

        // Event Listener untuk Tap
        $('#board').on('mousedown touchstart', '.square-55d6', function() {
            handleSquareClick($(this).data('square'));
        });
    }

    function checkGameOver() {
        if (game.in_checkmate()) showRes(game.turn() === 'w' ? "Black Wins" : "White Wins", "Checkmate");
        else if (game.in_draw()) showRes("Draw", "Remis");
    }

    function showRes(t, d) {
        $("#scene3").addClass("hidden");
        $("#scene4").removeClass("hidden");
        $("#result-title").text(t);
        $("#result-desc").text(d);
    }

    function undoMove() { game.undo(); game.undo(); board.position(game.fen()); }
    function resign() { showRes(playerColor === 'w' ? "Black Wins" : "White Wins", "Resignation"); }
</script>
</body>
</html>
