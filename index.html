<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Review Fix - Pro</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    
    <style>
        :root { --bg: #1a1917; --panel: #262421; --green: #81b64c; --blue: #5c8bb0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        .coach-card { width: 100%; max-width: 400px; background: var(--panel); border-radius: 8px; padding: 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; box-sizing: border-box; border-bottom: 4px solid #3d3a37; }
        .coach-icon { font-size: 30px; background: #333; padding: 10px; border-radius: 50%; }
        
        #board-area { width: 100%; max-width: 400px; margin-bottom: 10px; }
        #board { width: 100% !important; border-radius: 4px; border: 2px solid #444; }

        .controls { width: 100%; max-width: 400px; background: var(--panel); padding: 15px; border-radius: 8px; box-sizing: border-box; }
        
        /* Tombol Navigasi Review */
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-nav { flex: 1; padding: 15px; border: none; border-radius: 4px; background: #3d3a37; color: white; font-weight: bold; cursor: pointer; font-size: 18px; }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-main { width: 100%; padding: 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; background: var(--green); font-size: 16px; margin-bottom: 10px; }
        
        textarea { width: 100%; height: 50px; background: #121211; color: #ccc; border: 1px solid #444; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-size: 12px; resize: none; }
        .eval-bar { display: flex; justify-content: space-between; background: #121211; padding: 10px; border-radius: 4px; font-size: 14px; border-left: 4px solid var(--green); }
    </style>
</head>
<body>

    <div class="coach-card">
        <div class="coach-icon">👨‍🏫</div>
        <div id="coachText" style="font-size: 14px;">Masukkan PGN, tekan Start, lalu gunakan tombol panah untuk review.</div>
    </div>

    <div id="board-area">
        <div id="board"></div>
    </div>

    <div class="controls">
        <div class="nav-buttons">
            <button class="btn-nav" onclick="moveBack()" id="prevBtn"> < </button>
            <button class="btn-nav" onclick="moveForward()" id="nextBtn"> > </button>
        </div>

        <textarea id="pgnInput" placeholder="Paste PGN di sini..."></textarea>
        
        <button class="btn-main" onclick="startReview()">START REVIEW ANALYSIS</button>
        
        <div class="eval-bar">
            <span id="moveInfo">Langkah: --</span>
            <span id="evalScore" style="color: var(--green);">0.0</span>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        let board = null;
        let game = new Chess();
        let engine = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        
        let moveHistory = [];
        let currentIndex = -1;
        let analysisCache = {}; // Untuk menyimpan hasil eval agar tidak lambat saat back/next

        function init() {
            board = Chessboard('board', {
                position: 'start',
                draggable: true,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            $(window).resize(board.resize);
        }

        function startReview() {
            const pgn = $('#pgnInput').val();
            if (!game.load_pgn(pgn)) {
                alert("Format PGN salah! Pastikan meng-copy seluruh teks PGN.");
                return;
            }
            
            moveHistory = game.history();
            game.reset();
            board.start();
            currentIndex = -1;
            analysisCache = {};
            
            $('#coachText').text("Review dimulai! Klik tombol '>' untuk langkah pertama.");
            updateNavButtons();
        }

        function moveForward() {
            if (currentIndex < moveHistory.length - 1) {
                currentIndex++;
                let move = moveHistory[currentIndex];
                game.move(move);
                board.position(game.fen());
                analyzeCurrentPosition(move);
                updateNavButtons();
            }
        }

        function moveBack() {
            if (currentIndex >= 0) {
                game.undo();
                currentIndex--;
                board.position(game.fen());
                
                if (currentIndex >= 0) {
                    let prevMove = moveHistory[currentIndex];
                    displayStoredAnalysis(prevMove);
                } else {
                    $('#moveInfo').text("Posisi Awal");
                    $('#evalScore').text("0.0");
                }
                updateNavButtons();
            }
        }

        function analyzeCurrentPosition(move) {
            $('#coachText').text("Coach sedang berpikir...");
            
            engine.postMessage("position fen " + game.fen());
            engine.postMessage("go depth 12");
            
            engine.onmessage = function(e) {
                if (e.data.includes("score cp")) {
                    let cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                    let score = (game.turn() === 'b' ? cp : -cp) / 100;
                    
                    analysisCache[currentIndex] = { move: move, score: score };
                    displayAnalysis(move, score);
                }
            };
        }

        function displayAnalysis(move, score) {
            let label = "Good Move";
            let color = "#81b64c";

            // Logika Klasifikasi Sederhana
            if (score > 2.0) { label = "!! Brilliant"; color = "#15d0b1"; }
            else if (score < -1.5) { label = "?? Blunder"; color = "#fa4143"; }
            
            $('#moveInfo').text((currentIndex + 1) + ". " + move + " (" + label + ")");
            $('#evalScore').text(score).css('color', color);
            $('#coachText').text("Langkah " + move + " dinilai " + label + ".");
        }

        function displayStoredAnalysis(move) {
            if (analysisCache[currentIndex]) {
                displayAnalysis(move, analysisCache[currentIndex].score);
            }
        }

        function updateNavButtons() {
            $('#prevBtn').prop('disabled', currentIndex < 0);
            $('#nextBtn').prop('disabled', currentIndex >= moveHistory.length - 1);
        }

        $(document).ready(init);
    </script>
</body>
</html>
