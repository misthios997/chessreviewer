<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Reviewer Pro | Vercel</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        :root { --bg: #161512; --panel: #262421; --accent: #81b64c; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        .container { width: 100%; max-width: 380px; }
        #board { width: 100%; border-radius: 4px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        .panel { background: var(--panel); margin-top: 15px; padding: 15px; border-radius: 8px; box-sizing: border-box; }
        .eval-box { text-align: center; background: #1a1917; padding: 10px; border-radius: 4px; margin-bottom: 15px; border-left: 5px solid var(--accent); }
        #score { font-size: 32px; font-weight: bold; }
        
        .badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .badge { font-size: 10px; padding: 10px; text-align: center; font-weight: bold; border-radius: 4px; opacity: 0.1; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .active { opacity: 1; transform: scale(1.05); border: 1px solid white; box-shadow: 0 0 10px rgba(129, 182, 76, 0.5); }

        .brilliant { background: #01ebbb; color: #000; }
        .great { background: #5b89b1; }
        .excellent { background: #95bb4a; }
        .book { background: #a88865; }
        .mistake { background: #f6c045; color: #000; }
        .blunder { background: #f9412d; }

        textarea { width: 100%; height: 60px; background: #000; color: #81b64c; border: 1px solid #444; border-radius: 4px; padding: 8px; font-size: 11px; margin-bottom: 10px; box-sizing: border-box; resize: none; }
        button { cursor: pointer; border: none; font-weight: bold; border-radius: 4px; width: 100%; padding: 15px; margin-bottom: 10px; font-size: 14px; }
        .btn-main { background: var(--accent); color: white; }
        .nav-wrap { display: flex; gap: 10px; }
        .btn-nav { background: #3c3a37; color: white; flex: 1; }
    </style>
</head>
<body>

    <div class="container">
        <div id="board"></div>

        <div class="panel">
            <div class="eval-box">
                <div id="score">0.30</div>
                <small id="status">Ready to Analyze</small>
            </div>

            <div class="badge-grid">
                <div id="m-brilliant" class="badge brilliant">!! BRILLIANT</div>
                <div id="m-great" class="badge great">! GREAT</div>
                <div id="m-excellent" class="badge excellent">🌟 EXCELLENT</div>
                <div id="m-book" class="badge book">📕 BOOK</div>
                <div id="m-mistake" class="badge mistake">?! MISTAKE</div>
                <div id="m-blunder" class="badge blunder">?? BLUNDER</div>
            </div>

            <textarea id="pgnInput" placeholder="Tempel PGN Game Anda di sini..."></textarea>
            
            <button class="btn-main" onclick="importGame()">IMPORT & ANALYZE</button>
            
            <div class="nav-wrap">
                <button class="btn-nav" onclick="move(-1)">PREV</button>
                <button class="btn-nav" onclick="move(1)">NEXT</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        let board, game = new Chess(), history = [], index = -1, lastScore = 0.3;
        const stockfish = new Worker("https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js");

        function init() {
            // FIX: Menggunakan Piece Theme dari URL yang paling stabil
            board = Chessboard('board', {
                position: 'start',
                draggable: true,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            $(window).resize(board.resize);
        }

        function analyze(fen, san) {
            document.getElementById('status').innerText = "Stockfish is thinking...";
            stockfish.postMessage('position fen ' + fen);
            stockfish.postMessage('go depth 13');
            
            stockfish.onmessage = (e) => {
                if (e.data.includes('score cp')) {
                    let cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                    let score = (cp / 100).toFixed(2);
                    document.getElementById('score').innerText = score > 0 ? '+' + score : score;
                    
                    // Logic Badge
                    let diff = Math.abs(lastScore - score);
                    $('.badge').removeClass('active');

                    if (diff >= 2.0) $('#m-blunder').addClass('active');
                    else if (diff >= 0.8) $('#m-mistake').addClass('active');
                    else if (index <= 10) $('#m-book').addClass('active');
                    else if (san.includes('x') && diff < 0.2) $('#m-brilliant').addClass('active');
                    else if (diff <= 0.3) $('#m-excellent').addClass('active');
                    else $('#m-great').addClass('active');

                    lastScore = parseFloat(score);
                    document.getElementById('status').innerText = "Analysis Finished";
                }
            };
        }

        function importGame() {
            const pgn = document.getElementById('pgnInput').value;
            if (game.load_pgn(pgn)) {
                history = game.history({ verbose: true });
                game.reset();
                index = -1;
                board.start();
                lastScore = 0.3;
                alert("Game Imported! Klik NEXT untuk review.");
            } else {
                alert("PGN Tidak Valid!");
            }
        }

        function move(d) {
            if (d === 1 && index < history.length - 1) {
                index++;
                game.move(history[index].san);
                board.position(game.fen());
                analyze(game.fen(), history[index].san);
            } else if (d === -1 && index >= 0) {
                game.undo();
                index--;
                board.position(game.fen());
                document.getElementById('score').innerText = "...";
            }
        }

        $(document).ready(init);
    </script>
</body>
</html>
