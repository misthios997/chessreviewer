<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Review Fix</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    
    <style>
        :root { --bg: #1a1917; --panel: #262421; --green: #81b64c; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        .coach-card { width: 100%; max-width: 400px; background: var(--panel); border-radius: 8px; padding: 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; box-sizing: border-box; border-bottom: 4px solid #3d3a37; }
        .coach-icon { font-size: 30px; background: #333; padding: 10px; border-radius: 50%; }
        
        #board-area { width: 100%; max-width: 400px; margin-bottom: 10px; }
        #board { width: 100% !important; border-radius: 4px; }

        .controls { width: 100%; max-width: 400px; background: var(--panel); padding: 15px; border-radius: 8px; box-sizing: border-box; }
        textarea { width: 100%; height: 60px; background: #121211; color: #aaa; border: 1px solid #444; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-size: 12px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; margin-bottom: 8px; }
        .btn-green { background: var(--green); }
        .btn-gray { background: #3d3a37; }
        
        .move-info { display: flex; justify-content: space-between; background: #121211; padding: 10px; border-radius: 4px; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="coach-card">
        <div class="coach-icon">👨‍🏫</div>
        <div id="coachText" style="font-size: 14px;">Siap menganalisis! Paste PGN lalu tekan 'Start Review'.</div>
    </div>

    <div id="board-area">
        <div id="board"></div>
    </div>

    <div class="controls">
        <textarea id="pgnInput" placeholder="Paste PGN di sini..."></textarea>
        
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <input type="text" id="user" placeholder="Username" style="flex:1; padding:8px; border-radius:4px; border:1px solid #444; background:#121211; color:white;">
            <button class="btn btn-gray" onclick="loadUserGames()" style="width: auto; margin:0;">Get Games</button>
        </div>
        
        <div id="gameList" style="max-height: 60px; overflow-y: auto; font-size: 11px; margin-bottom: 10px; color: #81b64c;"></div>

        <button class="btn btn-green" onclick="startAnalysis()">START REVIEW ANALYSIS</button>
        
        <div class="move-info">
            <span id="moveName">Langkah: --</span>
            <span id="evalScore" style="color: #81b64c;">0.0</span>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        let board = null;
        let game = new Chess();
        let engine = null;
        let moveHistory = [];
        let moveIndex = 0;
        let lastEval = 0.3;

        // Inisialisasi Engine Stockfish
        function initEngine() {
            // Menggunakan Stockfish.js versi asinkron yang lebih stabil
            engine = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
            engine.onmessage = function(e) {
                if (e.data.includes("score cp")) {
                    const match = e.data.match(/score cp (-?\d+)/);
                    if (match) {
                        let cp = parseInt(match[1]);
                        let score = (game.turn() === 'b' ? cp : -cp) / 100;
                        handleAnalysisResult(score);
                    }
                }
            };
        }

        function initBoard() {
            board = Chessboard('board', {
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            $(window).resize(board.resize);
        }

        async function loadUserGames() {
            let u = $('#user').val();
            if(!u) return;
            $('#gameList').text("Loading...");
            try {
                let r = await fetch(`https://api.chess.com/pub/player/${u}/games/2026/01`);
                let d = await r.json();
                $('#gameList').empty();
                d.games.reverse().slice(0, 5).forEach(g => {
                    $(`<div style="padding:5px; border-bottom:1px solid #333; cursor:pointer;">vs ${g.white.username == u ? g.black.username : g.white.username}</div>`)
                    .click(() => { $('#pgnInput').val(g.pgn); $('#coachText').text("PGN Dimuat! Klik Start."); })
                    .appendTo('#gameList');
                });
            } catch(e) { $('#gameList').text("Error load game."); }
        }

        function startAnalysis() {
            const pgn = $('#pgnInput').val();
            if (!game.load_pgn(pgn)) {
                alert("PGN Error! Pastikan format benar.");
                return;
            }
            
            moveHistory = game.history();
            game.reset();
            board.start();
            moveIndex = 0;
            lastEval = 0.3;
            
            if (!engine) initEngine();
            analyzeStep();
        }

        function analyzeStep() {
            if (moveIndex >= moveHistory.length) {
                $('#coachText').text("Review Selesai! Analisis 100% selesai.");
                return;
            }

            let m = moveHistory[moveIndex];
            game.move(m);
            board.position(game.fen());

            engine.postMessage("position fen " + game.fen());
            engine.postMessage("go depth 12");
        }

        function handleAnalysisResult(score) {
            let diff = Math.abs(score - lastEval);
            let label = "Good";
            let color = "#81b64c";

            if (diff > 2.0) { label = "!! Brilliant"; color = "#15d0b1"; }
            else if (diff > 1.2 && score < lastEval) { label = "?? Blunder"; color = "#fa4143"; }
            else if (diff > 0.8) { label = "? Mistake"; color = "#ffa459"; }

            $('#evalScore').text(score).css('color', color);
            $('#moveName').text(moveIndex + 1 + ". " + moveHistory[moveIndex] + " (" + label + ")");
            $('#coachText').text("Langkah " + moveHistory[moveIndex] + " dinilai " + label);
            
            lastEval = score;
            moveIndex++;
            setTimeout(analyzeStep, 600);
        }

        $(document).ready(() => {
            initBoard();
            initEngine();
        });
    </script>
</body>
</html>
