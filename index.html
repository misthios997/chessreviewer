<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Reviewer Pro Fix</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root { 
            --bg: #1a1917; --panel: #262421; --green: #81b64c; 
            --best: #96bc4b; --blunder: #fa4143; 
        }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        /* FIX: Kontainer papan harus punya ukuran jelas agar tidak 0px */
        #board-container { width: 100%; max-width: 400px; aspect-ratio: 1/1; background: #333; margin-bottom: 15px; border: 2px solid #444; }
        #board { width: 100% !important; }

        .controls { width: 100%; max-width: 400px; background: var(--panel); padding: 15px; border-radius: 8px; box-sizing: border-box; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-main { background: var(--green); color: white; width: 100%; margin-top: 10px; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #121211; color: white; border: 1px solid #444; box-sizing: border-box; }
        .status { background: #121211; padding: 10px; border-left: 4px solid var(--green); font-size: 14px; }
    </style>
</head>
<body>

    <h3 style="margin: 10px 0;">Chess Reviewer Pro</h3>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <div class="controls">
        <div class="btn-row">
            <button onclick="goPrev()" style="background: #3d3a37; color: white; font-size: 20px;">❮</button>
            <button onclick="board.flip()" style="background: #444; color: white;">🔄 Flip</button>
            <button onclick="goNext()" style="background: #3d3a37; color: white; font-size: 20px;">❯</button>
        </div>

        <input type="text" id="username" placeholder="Username Chess.com">
        <button onclick="getGames()" style="background: #444; color: white; width: 100%; margin-bottom: 10px;">Cari Game</button>
        <div id="gameLinks" style="font-size: 12px; color: var(--green); margin-bottom: 10px;"></div>

        <textarea id="pgnBox" rows="3" placeholder="Paste PGN di sini..."></textarea>
        <button class="btn-main" onclick="startReview()">START GAME REVIEW</button>

        <div class="status" id="statusLine">
            <b id="moveLabel">Langkah: --</b><br>
            <span id="evalLabel">Siap Analisis</span>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/chess.js@0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var moveList = [];
        var currentIdx = -1;

        // Inisialisasi Papan
        function init() {
            var config = {
                position: 'start',
                // FIX: Gunakan template gambar Wikipedia dari server terpercaya
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = Chessboard('board', config);
            
            // Paksa refresh ukuran agar muncul di HP
            setTimeout(() => { board.resize(); }, 500);
        }

        async function getGames() {
            let user = $('#username').val();
            if(!user) return;
            $('#gameLinks').text("Loading...");
            try {
                let r = await fetch(`https://api.chess.com/pub/player/${user}/games/2026/01`);
                let d = await r.json();
                $('#gameLinks').empty();
                d.games.reverse().slice(0, 3).forEach((g, i) => {
                    $(`<div style="cursor:pointer; padding:5px; border-bottom:1px solid #333;">Game ${i+1} (Klik untuk pilih)</div>`)
                    .click(() => { $('#pgnBox').val(g.pgn); alert("PGN Terpilih!"); })
                    .appendTo('#gameLinks');
                });
            } catch(e) { $('#gameLinks').text("Gagal ambil data."); }
        }

        function startReview() {
            let pgn = $('#pgnBox').val();
            if (!game.load_pgn(pgn)) return alert("PGN Kosong atau Error!");
            
            moveList = game.history();
            game.reset();
            board.start();
            currentIdx = -1;
            $('#statusLine').show();
            $('#evalLabel').text("Review Dimulai. Tekan panah ❯");
        }

        function goNext() {
            if (currentIdx < moveList.length - 1) {
                currentIdx++;
                game.move(moveList[currentIdx]);
                board.position(game.fen());
                $('#moveLabel').text("Langkah: " + (currentIdx + 1) + ". " + moveList[currentIdx]);
                // Logika evaluasi sederhana untuk label
                $('#evalLabel').text("Menganalisis langkah...");
            }
        }

        function goPrev() {
            if (currentIdx >= 0) {
                game.undo();
                currentIdx--;
                board.position(game.fen());
                $('#moveLabel').text("Langkah: " + (currentIdx + 1));
            }
        }

        $(document).ready(init);
    </script>
</body>
</html>
