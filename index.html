<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessReps Clone - Fix</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        body { background-color: #121212; color: white; font-family: 'Inter', sans-serif; }
        .chess-card { background-color: #1e1e1e; border: 1px solid #333; transition: 0.2s; }
        .chess-card:hover { border-color: #4ade80; transform: translateY(-3px); }
        #myBoard { width: 100%; max-width: 400px; margin: 0 auto; border: 4px solid #333; }
        /* Warna kotak papan */
        .white-1e1d7 { background-color: #ebecd0 !important; }
        .black-b58863 { background-color: #779556 !important; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <nav class="flex items-center justify-between p-6 border-b border-gray-800">
        <div class="flex items-center space-x-2">
            <div class="bg-green-500 p-2 rounded-lg"><i class="fas fa-chess-knight text-black text-xl"></i></div>
            <span class="text-2xl font-bold">ChessReps</span>
        </div>
        <button class="bg-white text-black px-6 py-2 rounded-full font-bold">Login</button>
    </nav>

    <section class="flex flex-col lg:flex-row items-center justify-center py-12 px-6 gap-10">
        <div class="max-w-xl text-center lg:text-left">
            <h1 class="text-5xl font-extrabold mb-6">Kuasai <span class="text-green-500">Opening.</span></h1>
            <p class="text-gray-400 text-lg mb-8">Latih memori pembukaan catur Anda secara interaktif.</p>
            
            <div class="flex flex-wrap gap-4 justify-center lg:justify-start">
                <button id="resetBtn" class="bg-green-500 text-black px-8 py-3 rounded-xl font-bold hover:bg-green-400 shadow-lg shadow-green-900/20">
                    Reset Papan
                </button>
                <button onclick="alert('Fitur Kursus akan segera hadir!')" class="bg-gray-800 text-white px-8 py-3 rounded-xl font-bold hover:bg-gray-700">
                    Cari Kursus
                </button>
            </div>
            <div id="status" class="mt-6 p-3 bg-gray-900 rounded-lg inline-block font-mono text-green-400 border border-gray-800">
                Status: Putih melangkah
            </div>
        </div>

        <div class="bg-[#1e1e1e] p-4 rounded-2xl border border-gray-700 shadow-2xl">
            <div id="myBoard"></div>
        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        $(document).ready(function() {
            var board = null;
            var game = new Chess();
            var $status = $('#status');

            function onDragStart (source, piece, position, orientation) {
                if (game.game_over()) return false;
                if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                    (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                    return false;
                }
            }

            function onDrop (source, target) {
                var move = game.move({
                    from: source,
                    to: target,
                    promotion: 'q'
                });

                if (move === null) return 'snapback';
                updateStatus();
            }

            function onSnapEnd () {
                board.position(game.fen());
            }

            function updateStatus () {
                var status = '';
                var moveColor = (game.turn() === 'b') ? 'Hitam' : 'Putih';

                if (game.in_checkmate()) {
                    status = 'Game over, ' + moveColor + ' kena Skakmat.';
                } else if (game.in_draw()) {
                    status = 'Game over, Remis.';
                } else {
                    status = moveColor + ' melangkah';
                    if (game.in_check()) status += ', ' + moveColor + ' kena Skak!';
                }
                $status.html('Status: ' + status);
            }

            var config = {
                draggable: true,
                position: 'start',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };

            board = Chessboard('myBoard', config);

            // Perbaikan event listener tombol Reset
            $('#resetBtn').on('click', function() {
                game.reset();
                board.start();
                updateStatus();
            });

            updateStatus();
        });
    </script>
</body>
</html>
