<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bethel Chess Elite</title>
    
    <!-- Libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --chess-bg: #161512;
            --chess-green: #81b64c;
            --chess-panel: #262421;
        }

        body {
            background-color: var(--chess-bg);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            touch-action: manipulation;
        }

        .screen { display: none; height: calc(100vh - 80px); flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .screen.active { display: flex; }

        .btn-green {
            background-color: var(--chess-green);
            color: black;
            font-weight: 800;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 0 #5f8e3a;
            width: 100%;
            text-align: center;
            text-transform: uppercase;
            cursor: pointer;
        }
        .btn-green:active { transform: translateY(2px); box-shadow: 0 2px 0 #5f8e3a; }

        .card-menu {
            background: var(--chess-panel);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            user-select: none;
        }

        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 80px; background: #21201d;
            display: flex; border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 9999;
        }

        .nav-item {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: #7d7d7d; font-size: 10px; font-weight: 700;
            cursor: pointer;
        }
        .nav-item.active { color: white; }

        #board { width: 92vw; max-width: 400px; margin: 0 auto; }
        .white-1e1d7 { background-color: #ebecd0 !important; }
        .black-3c85d { background-color: #779556 !important; }

        .timer {
            background: #21201d; padding: 8px 16px; border-radius: 4px;
            font-family: monospace; font-size: 24px; font-weight: bold;
            min-width: 90px; text-align: center;
        }
        .timer.active { background: white; color: black; }
    </style>
</head>
<body>

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active p-6">
        <div class="mt-4 mb-8">
            <div id="btn-play-online" class="btn-green text-xl">
                PLAY ONLINE
            </div>
        </div>

        <div id="go-bots" class="card-menu">
            <div class="w-12 h-12 bg-blue-500 rounded flex items-center justify-center pointer-events-none">
                <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
            </div>
            <div class="pointer-events-none">
                <div class="font-bold text-lg leading-tight uppercase">PLAY BOTS</div>
                <div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Lawan Engine Stockfish</div>
            </div>
        </div>

        <div id="go-history" class="card-menu">
            <div class="w-12 h-12 bg-gray-600 rounded flex items-center justify-center pointer-events-none">
                <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>
            </div>
            <div class="pointer-events-none">
                <div class="font-bold text-lg leading-tight uppercase">HISTORY</div>
                <div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Lihat Hasil Pertandingan</div>
            </div>
        </div>
    </div>

    <!-- BOTS SCREEN -->
    <div id="screen-bots" class="screen p-4">
        <h2 class="text-xl font-black mb-4 px-2 uppercase italic">Pilih Lawan AI</h2>
        <div id="bot-list-content"></div>
    </div>

    <!-- GAME SCREEN -->
    <div id="screen-game" class="screen bg-black !h-screen !pb-0">
        <div class="p-4 flex justify-between items-center bg-[#21201d]">
            <div class="flex items-center gap-2">
                <div id="ui-bot-avatar" class="w-10 h-10 bg-black rounded border border-white/10 overflow-hidden"></div>
                <div id="ui-bot-name" class="font-black text-sm uppercase">BOT</div>
            </div>
            <div id="timer-black" class="timer">10:00</div>
        </div>
        <div class="flex-1 flex items-center justify-center bg-[#161512]">
            <div id="board"></div>
        </div>
        <div class="p-4 flex justify-between items-center bg-[#21201d]">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-green-600 rounded flex items-center justify-center font-black">J</div>
                <div class="font-black text-sm uppercase">JOVAN</div>
            </div>
            <div id="timer-white" class="timer active">10:00</div>
        </div>
        <div class="p-4 flex gap-2 bg-[#262421]">
            <div id="btn-undo" class="flex-1 bg-white/10 py-4 rounded-xl font-bold uppercase text-xs text-center cursor-pointer">Undo</div>
            <div id="btn-resign" class="flex-1 bg-red-500/20 text-red-500 py-4 rounded-xl font-bold uppercase text-xs text-center cursor-pointer">Resign</div>
        </div>
    </div>

    <!-- HISTORY SCREEN -->
    <div id="screen-history" class="screen p-6">
        <h2 class="text-xl font-black mb-4 uppercase italic">Riwayat Game</h2>
        <div id="history-content" class="space-y-2"></div>
    </div>

    <!-- NAVIGATION -->
    <div class="nav-bar">
        <div id="nav-home" class="nav-item active">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z"/></svg>
            HOME
        </div>
        <div id="nav-bots" class="nav-item">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            BOTS
        </div>
        <div id="nav-history" class="nav-item">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>
            HISTORY
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = JSON.parse(window.__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = window.__app_id || 'bethel-chess-final-v2';

        const BOTS = [
            { id: 1, name: 'Martin', elo: 400, skill: 1, seed: 'm1' },
            { id: 2, name: 'Sven', elo: 1200, skill: 8, seed: 's1' },
            { id: 3, name: 'Vortex', elo: 2400, skill: 15, seed: 'v1' },
            { id: 4, name: 'Grandmaster', elo: 3200, skill: 20, seed: 'gm' }
        ];

        let game = new Chess();
        let board = null;
        let activeBot = null;
        let user = null;
        let wTime = 600, bTime = 600;
        let clockInterval = null;

        const stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        stockfish.onmessage = (e) => {
            if (e.data.startsWith('bestmove')) {
                const move = e.data.split(' ')[1];
                game.move({ from: move.slice(0, 2), to: move.slice(2, 4), promotion: 'q' });
                board.position(game.fen());
                updateGameUI();
            }
        };

        function showScreen(id) {
            $('.screen').removeClass('active');
            $(`#screen-${id}`).addClass('active').css('display', 'flex');
            $('.nav-item').removeClass('active');
            $(`#nav-${id}`).addClass('active');

            if (id === 'game') $('.nav-bar').hide();
            else $('.nav-bar').show();
            
            if (board) board.resize();
        }

        // Gunakan pointerdown untuk respon instan
        const clickEvent = 'pointerdown';

        function setupApp() {
            // Navigation
            $('#nav-home').on(clickEvent, () => showScreen('home'));
            $('#nav-bots, #go-bots').on(clickEvent, () => showScreen('bots'));
            $('#nav-history, #go-history').on(clickEvent, () => showScreen('history'));
            
            $('#btn-play-online').on(clickEvent, (e) => {
                e.preventDefault();
                alert("Mode Online segera hadir! Main lawan bot dulu.");
                showScreen('bots');
            });

            $('#btn-undo').on(clickEvent, () => {
                game.undo(); game.undo();
                board.position(game.fen());
                updateGameUI();
            });

            $('#btn-resign').on(clickEvent, () => {
                if(confirm("Yakin ingin menyerah?")) finishMatch('LOSE');
            });

            $(document).on(clickEvent, '.bot-card', function() {
                const botId = $(this).data('id');
                startNewGame(botId);
            });

            renderBots();
        }

        function startNewGame(botId) {
            activeBot = BOTS.find(b => b.id == botId);
            game = new Chess();
            wTime = 600; bTime = 600;
            
            $('#ui-bot-name').text(activeBot.name);
            $('#ui-bot-avatar').html(`<img src="https://api.dicebear.com/7.x/bottts/svg?seed=${activeBot.seed}" class="w-full h-full">`);
            
            showScreen('game');
            
            if (board) board.destroy();
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                onDragStart: (s, p) => !game.game_over() && !p.startsWith('b') && game.turn() === 'w',
                onDrop: (source, target) => {
                    const move = game.move({ from: source, to: target, promotion: 'q' });
                    if (!move) return 'snapback';
                    
                    updateGameUI();
                    stockfish.postMessage(`position fen ${game.fen()}`);
                    stockfish.postMessage(`go depth ${activeBot.skill + 2}`);
                },
                onSnapEnd: () => board.position(game.fen()),
                pieceTheme: 'https://lichess1.org/assets/piece/cburnett/{piece}.svg'
            });

            if (clockInterval) clearInterval(clockInterval);
            clockInterval = setInterval(() => {
                if (game.turn() === 'w') wTime--; else bTime--;
                const fmt = (s) => `${Math.floor(s/60)}:${(s%60).toString().padStart(2, '0')}`;
                $('#timer-white').text(fmt(wTime));
                $('#timer-black').text(fmt(bTime));
                if (wTime <= 0) finishMatch('LOSE');
                if (bTime <= 0) finishMatch('WIN');
            }, 1000);
        }

        function updateGameUI() {
            $('.timer').removeClass('active');
            if (game.turn() === 'w') $('#timer-white').addClass('active');
            else $('#timer-black').addClass('active');

            if (game.game_over()) {
                const res = game.in_checkmate() ? (game.turn() === 'w' ? 'LOSE' : 'WIN') : 'DRAW';
                finishMatch(res);
            }
        }

        async function finishMatch(res) {
            clearInterval(clockInterval);
            alert("Hasil: " + res);
            if (user) {
                await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'history'), {
                    opponent: activeBot.name, result: res, timestamp: serverTimestamp()
                });
            }
            showScreen('home');
        }

        function renderBots() {
            $('#bot-list-content').html(BOTS.map(bot => `
                <div class="bot-card card-menu" data-id="${bot.id}">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${bot.seed}" class="w-12 h-12 rounded bg-black pointer-events-none">
                    <div class="flex-1 font-black uppercase text-sm pointer-events-none">${bot.name} (ELO ${bot.elo})</div>
                    <div class="text-green-500 font-black text-xs pointer-events-none">PLAY</div>
                </div>
            `).join(''));
        }

        // Firebase & Initialization
        async function init() {
            try {
                if (window.__initial_auth_token) await signInWithCustomToken(auth, window.__initial_auth_token);
                else await signInAnonymously(auth);
            } catch(e) { console.error(e); }

            onAuthStateChanged(auth, (u) => {
                if (u) {
                    user = u;
                    onSnapshot(collection(db, 'artifacts', appId, 'users', u.uid, 'history'), (snap) => {
                        const data = snap.docs.map(d => d.data()).sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                        $('#history-content').html(data.length ? data.map(h => `
                            <div class="bg-[#262421] p-3 rounded-lg flex justify-between items-center border-l-2 ${h.result === 'WIN' ? 'border-green-500' : 'border-red-500'}">
                                <span class="font-bold text-xs uppercase">Vs ${h.opponent}</span>
                                <span class="font-black ${h.result === 'WIN' ? 'text-green-500' : 'text-red-500'} text-xs">${h.result}</span>
                            </div>
                        `).join('') : '<p class="text-gray-500 text-center py-10 italic">Belum ada riwayat.</p>');
                    });
                }
            });
            setupApp();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        window.addEventListener('resize', () => board && board.resize());
    </script>
</body>
</html>
