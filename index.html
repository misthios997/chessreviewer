<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChessReps Pro Academy</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg: #161512; --card: #262421; --accent: #81b64c; --text: #bababa; --neo-l: #ebecd0; --neo-d: #779556; }
        body, html { background-color: var(--bg); color: white; margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        
        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        /* Navigation & Screens */
        .screen { display: none; height: 100vh; overflow-y: auto; padding: 20px; }
        .screen.active { display: block; }
        
        .menu-item { background: var(--card); padding: 18px; border-radius: 8px; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; border: 1px solid #333; }
        .menu-item:active { transform: scale(0.98); }
        .menu-item.locked { opacity: 0.4; filter: grayscale(1); }
        
        /* Chess Board Screen - Scroll Locked */
        #board-screen { overflow: hidden; padding: 10px; }
        #board { width: 95vw; max-width: 400px; margin: 0 auto; border: 2px solid #333; }
        .white-1e1d7 { background-color: var(--neo-l) !important; }
        .black-3c85d { background-color: var(--neo-d) !important; }

        .coach-bar { background: #21201d; padding: 15px; border-radius: 8px; margin-top: 15px; border-left: 4px solid var(--accent); }
        .btn-back { position: absolute; top: 15px; left: 15px; background: none; border: none; color: white; font-size: 1.2rem; }
        
        .progress-mini { height: 4px; background: #333; margin-top: 5px; }
        .progress-fill { height: 100%; background: var(--accent); transition: 0.3s; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="w-100" style="max-width: 320px;">
        <h2 class="text-center mb-4 text-success fw-bold">REPS LOGIN</h2>
        <input type="text" id="username" class="form-control bg-dark text-white border-secondary mb-3" placeholder="Username">
        <input type="password" id="password" class="form-control bg-dark text-white border-secondary mb-3" placeholder="Password">
        <button onclick="handleAuth()" class="btn btn-success w-100 fw-bold">LOGIN / REGISTER</button>
    </div>
</div>

<div id="menu-screen" class="screen">
    <h4 class="mb-4 mt-3 fw-bold"><i class="fas fa-chess-knight text-success"></i> REPS ACADEMY</h4>
    <div id="main-menu-list">
        <div class="menu-item" onclick="showSubMenu('basic')">
            <i class="fas fa-graduation-cap me-3"></i> <span>Basic Class</span>
            <i class="fas fa-chevron-right ms-auto"></i>
        </div>
        <div class="menu-item locked" id="menu-mid" onclick="showSubMenu('mid')">
            <i class="fas fa-bolt me-3"></i> <span>Mid Class</span>
            <i class="fas fa-lock ms-auto"></i>
        </div>
        <div class="menu-item locked" id="menu-high" onclick="showSubMenu('high')">
            <i class="fas fa-crown me-3"></i> <span>High Class</span>
            <i class="fas fa-lock ms-auto"></i>
        </div>
        <div class="menu-item" onclick="showSubMenu('opening')">
            <i class="fas fa-book-open me-3"></i> <span>Opening Book</span>
        </div>
        <div class="menu-item" onclick="startBot()">
            <i class="fas fa-robot me-3"></i> <span>Play vs Bot (Stockfish)</span>
        </div>
    </div>
</div>

<div id="sub-menu-screen" class="screen">
    <button class="btn-back" onclick="changeScreen('menu-screen')"><i class="fas fa-arrow-left"></i></button>
    <h4 id="sub-menu-title" class="text-center mb-4 mt-2">Lessons</h4>
    <div id="sub-menu-list"></div>
</div>

<div id="board-screen" class="screen">
    <button class="btn-back" onclick="changeScreen('sub-menu-screen')"><i class="fas fa-times"></i></button>
    <div class="mt-5">
        <div id="board"></div>
        <div class="coach-bar">
            <div id="coach-msg">Selesaikan puzzle ini untuk lanjut!</div>
            <div class="progress-mini"><div class="progress-fill" id="lesson-progress"></div></div>
        </div>
        <div class="d-flex gap-2 mt-3">
            <button class="btn btn-dark flex-fill" onclick="undoMove()">Undo</button>
            <button class="btn btn-dark flex-fill" onclick="resetBoard()">Reset</button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    let board = null;
    let game = new Chess();
    let currentUser = null;
    let currentLesson = null;

    // DATABASE MATERI (Puzzle Based)
    const library = {
        basic: [
            { id: 'b1', name: "Langkah Pion", fen: "8/8/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", target: "e4", msg: "Gerakkan pion ke e4 (pusat)!" },
            { id: 'b2', name: "Langkah Kuda", fen: "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2", target: "Nf3", msg: "Keluarkan Kuda ke f3!" }
        ],
        mid: [
            { id: 'm1', name: "The Fork (Kuda)", fen: "2q3k1/8/3n4/8/1P1P4/2P5/8/6K1 b - - 0 1", target: "Ne4", msg: "Lakukan Fork! Ancam dua bidak putih sekaligus dengan Kuda." },
            { id: 'm2', name: "The Pin", fen: "4r1k1/8/4q3/4R3/8/8/8/6K1 w - - 0 1", target: "Rxe6", msg: "Gunakan Pin! Makan menteri yang terjebak." }
        ],
        opening: [
            { id: 'o1', name: "Sicilian Defense", fen: "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1", target: "c5", msg: "Balas dengan c5 untuk memulai Sicilian." },
            { id: 'o2', name: "French Defense", fen: "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1", target: "e6", msg: "Langkah e6 adalah ciri khas French Defense." },
            { id: 'o3', name: "Caro-Kann", fen: "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1", target: "c6", msg: "Langkah c6 bersiap menyerang pusat." }
        ]
    };

    // AUTH SYSTEM
    function handleAuth() {
        const user = document.getElementById('username').value;
        if(!user) return alert("Isi username!");
        
        currentUser = JSON.parse(localStorage.getItem('chess_user_' + user)) || {
            name: user,
            completed: [],
            points: 0
        };
        saveData();
        changeScreen('menu-screen');
        updateLocks();
    }

    function saveData() {
        localStorage.setItem('chess_user_' + currentUser.name, JSON.stringify(currentUser));
    }

    // NAVIGATION
    function changeScreen(screenId) {
        $('.screen').removeClass('active');
        $('#auth-screen').hide();
        $('#' + screenId).addClass('active');
        if(board) board.resize();
    }

    function showSubMenu(cat) {
        const list = document.getElementById('sub-menu-list');
        list.innerHTML = '';
        document.getElementById('sub-menu-title').innerText = cat.toUpperCase();

        library[cat].forEach((item, idx) => {
            const isDone = currentUser.completed.includes(item.id);
            const isLocked = idx > 0 && !currentUser.completed.includes(library[cat][idx-1].id) && cat !== 'opening';
            
            const div = document.createElement('div');
            div.className = `menu-item ${isLocked ? 'locked' : ''}`;
            div.innerHTML = `
                <span>${isDone ? '✅' : idx+1 + '.'} ${item.name}</span>
                ${isLocked ? '<i class="fas fa-lock ms-auto"></i>' : '<i class="fas fa-play ms-auto text-success"></i>'}
            `;
            if(!isLocked) div.onclick = () => startLesson(item);
            list.appendChild(div);
        });
        changeScreen('sub-menu-screen');
    }

    // LESSON & PUZZLE LOGIC
    function startLesson(item) {
        currentLesson = item;
        game.load(item.fen);
        changeScreen('board-screen');
        
        if(!board) {
            board = Chessboard('board', {
                draggable: true,
                position: item.fen,
                onDrop: onDrop,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
        } else {
            board.position(item.fen);
        }
        document.getElementById('coach-msg').innerText = item.msg;
        document.getElementById('lesson-progress').style.width = "0%";
    }

    function onDrop(source, target) {
        let move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';

        // Cek apakah langkah sesuai target puzzle
        if (move.san === currentLesson.target || move.to === currentLesson.target) {
            document.getElementById('coach-msg').innerText = "TEPAT! Kamu berhasil.";
            document.getElementById('lesson-progress').style.width = "100%";
            
            if(!currentUser.completed.includes(currentLesson.id)) {
                currentUser.completed.push(currentLesson.id);
                saveData();
                updateLocks();
            }
            setTimeout(() => changeScreen('sub-menu-screen'), 1500);
        } else {
            document.getElementById('coach-msg').innerText = "Bukan itu, coba lagi!";
            setTimeout(() => {
                game.undo();
                board.position(game.fen());
            }, 500);
        }
    }

    function updateLocks() {
        const basicDone = library.basic.every(l => currentUser.completed.includes(l.id));
        const midDone = library.mid.every(l => currentUser.completed.includes(l.id));

        if(basicDone) $('#menu-mid').removeClass('locked').find('.fa-lock').removeClass('fa-lock').addClass('fa-check');
        if(midDone) $('#menu-high').removeClass('locked').find('.fa-lock').removeClass('fa-lock').addClass('fa-check');
    }

    function startBot() {
        alert("Bot Mode: Putih (Kamu) vs Stockfish (Browser)");
        game.reset();
        currentLesson = { target: 'NONE' }; // bypass puzzle check
        changeScreen('board-screen');
        board.start();
        document.getElementById('coach-msg').innerText = "Bermainlah melawan Bot.";
    }

    function undoMove() { game.undo(); board.position(game.fen()); }
    function resetBoard() { if(currentLesson) startLesson(currentLesson); }

    window.addEventListener('resize', () => board && board.resize());
</script>
</body>
</html>
