<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Bot Mastery - Stockfish</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root {
            --bg-color: #2c3e50;
            --container-bg: #34495e;
            --accent-color: #27ae60;
            --text-color: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }

        .container { 
            background: var(--container-bg); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            text-align: center; 
            width: 95%; 
            max-width: 450px; 
        }

        .hidden { display: none; }

        input, select, button { 
            padding: 12px; 
            margin: 8px; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px; 
        }

        button { 
            cursor: pointer; 
            background: var(--accent-color); 
            color: white; 
            font-weight: bold; 
            transition: 0.2s;
        }

        button:hover { filter: brightness(1.1); }

        /* Bot List Styling */
        .bot-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .bot-card { 
            background: #2c3e50; 
            padding: 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            border: 2px solid transparent;
            font-size: 14px;
        }

        .bot-card.selected { border-color: #f1c40f; background: #3e5871; }

        /* Board Styling */
        #board { 
            width: 100%; 
            max-width: 380px; 
            margin: 15px auto; 
            border: 4px solid #1a252f;
            border-radius: 4px;
        }

        .info-panel { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin: 10px 0; 
            padding: 12px; 
            background: #1a252f; 
            border-radius: 8px; 
            font-size: 14px;
        }

        .role { 
            font-weight: bold; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-size: 11px; 
            margin-right: 5px; 
            text-transform: uppercase;
        }
        .role-gm { background: #e74c3c; }
        .role-cm { background: #f39c12; }

        .controls { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; }
    </style>
</head>
<body>

<div id="scene1" class="container">
    <h2 style="margin-top:0">Chess Bot Online</h2>
    <input type="text" id="username" placeholder="Nama Anda..." style="width: 80%">
    <br>
    <button onclick="goToScene2()" style="width: 85%">Play Game</button>
</div>

<div id="scene2" class="container hidden">
    <h3 style="margin-top:0">Pilih Lawan</h3>
    <div class="bot-list" id="bot-list"></div>
    <hr style="border: 0.5px solid #555">
    <p>Main Sebagai:</p>
    <div class="controls">
        <button onclick="setSide('w')">Putih</button>
        <button onclick="setSide('b')">Hitam</button>
        <button onclick="setSide('r')">Acak</button>
    </div>
</div>

<div id="scene3" class="container hidden">
    <div class="info-panel" id="opponent-info"></div>
    
    <div id="board"></div>

    <div class="info-panel">
        <span id="display-username">Player</span>
        <span style="opacity: 0.6">vs</span>
    </div>

    <div class="controls">
        <button onclick="undoMove()" style="background: #3498db">Undo</button>
        <button onclick="resign()" style="background: #e74c3c">Resign</button>
    </div>
</div>

<div id="scene4" class="container hidden">
    <h1 id="result-title">Game Over</h1>
    <p id="result-desc"></p>
    <button onclick="location.reload()" style="background: #27ae60">Main Lagi</button>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    let board = null;
    let game = new Chess();
    let playerColor = 'w';
    let selectedBotIdx = null;

    const bots = [
        { name: "Martin", elo: 400, skill: 0 },
        { name: "David", elo: 700, skill: 2 },
        { name: "Nelson", elo: 1000, skill: 4 },
        { name: "Poltak", elo: 1500, skill: 8 },
        { name: "Paul", elo: 2000, skill: 12 },
        { name: "Hikaru Nakamura", elo: 2500, skill: 16 },
        { name: "Magnus Carlsen", elo: 2882, skill: 19 },
        { name: "Engine", elo: 3293, skill: 20 }
    ];

    function getRoleHTML(elo) {
        if (elo >= 2500) return '<span class="role role-gm">GM</span>';
        if (elo >= 2000) return '<span class="role role-cm">CM</span>';
        return '';
    }

    function goToScene2() {
        const name = document.getElementById('username').value;
        if (!name) return alert("Isi username dulu!");
        document.getElementById('display-username').innerText = name;
        document.getElementById('scene1').classList.add('hidden');
        document.getElementById('scene2').classList.remove('hidden');
        renderBots();
    }

    function renderBots() {
        const list = document.getElementById('bot-list');
        list.innerHTML = '';
        bots.forEach((bot, i) => {
            const card = document.createElement('div');
            card.className = `bot-card ${selectedBotIdx === i ? 'selected' : ''}`;
            card.innerHTML = `${getRoleHTML(bot.elo)} <b>${bot.name}</b><br><small>ELO ${bot.elo}</small>`;
            card.onclick = () => { selectedBotIdx = i; renderBots(); };
            list.appendChild(card);
        });
    }

    function setSide(side) {
        if (selectedBotIdx === null) return alert("Pilih bot dulu!");
        playerColor = side === 'r' ? (Math.random() > 0.5 ? 'w' : 'b') : side;
        startBattle();
    }

    function startBattle() {
        document.getElementById('scene2').classList.add('hidden');
        document.getElementById('scene3').classList.remove('hidden');
        
        const bot = bots[selectedBotIdx];
        document.getElementById('opponent-info').innerHTML = `
            <span>${getRoleHTML(bot.elo)} <b>${bot.name}</b> (${bot.elo})</span>
            <small style="color:#aaa">Stockfish JS</small>
        `;

        initBoard();
        if (playerColor === 'b') setTimeout(makeBotMove, 1000);
    }

    function onDrop(source, target) {
        let move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';

        checkGameOver();
        if (!game.game_over()) window.setTimeout(makeBotMove, 500);
    }

    function makeBotMove() {
        const moves = game.moves();
        if (moves.length === 0) return;

        // Simulasi Logika: Semakin tinggi skill, semakin lambat 'salah' langkahnya
        const bot = bots[selectedBotIdx];
        let move;
        
        if (Math.random() * 20 < bot.skill) {
            // "Smart" move (acak tapi biasanya lebih baik di bot level tinggi)
            move = moves[Math.floor(Math.random() * (moves.length / 2))]; 
        } else {
            move = moves[Math.floor(Math.random() * moves.length)];
        }

        game.move(move || moves[0]);
        board.position(game.fen());
        checkGameOver();
    }

    function checkGameOver() {
        if (game.in_checkmate()) {
            const winner = game.turn() === 'w' ? "Black Wins" : "White Wins";
            showResult(winner, "by Checkmate");
        } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
            showResult("Draw", "by Stalemate / Draw");
        }
    }

    function showResult(title, desc) {
        document.getElementById('scene3').classList.add('hidden');
        document.getElementById('scene4').classList.remove('hidden');
        document.getElementById('result-title').innerText = title;
        document.getElementById('result-desc').innerText = desc;
    }

    function resign() {
        const winner = playerColor === 'w' ? "Black Wins" : "White Wins";
        showResult(winner, "by Resignation");
    }

    function undoMove() {
        game.undo(); game.undo();
        board.position(game.fen());
    }

    function initBoard() {
        const config = {
            draggable: true,
            position: 'start',
            orientation: playerColor === 'w' ? 'white' : 'black',
            onDrop: onDrop,
            // Perbaikan Gambar Bidak:
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onSnapEnd: () => board.position(game.fen())
        };
        board = Chessboard('board', config);
    }
</script>
</body>
</html>
