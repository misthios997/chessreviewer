<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Bot Elite</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        /* LOCK TOTAL: Mematikan Scroll & Zoom */
        * { touch-action: none; -webkit-user-select: none; user-select: none; }
        
        body, html {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            background: #121212;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 92%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            text-align: center;
            box-sizing: border-box;
        }

        .hidden { display: none !important; }

        /* UI Elements */
        input, button { 
            padding: 12px; margin: 10px 0; border-radius: 8px; border: none; 
            width: 100%; font-size: 16px; font-weight: bold;
        }
        
        button { cursor: pointer; background: #2e7d32; color: white; transition: 0.2s; }
        button:active { transform: scale(0.98); opacity: 0.8; }

        .bot-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
            max-height: 250px;
            overflow-y: auto; /* Scroll hanya di dalam list bot */
            touch-action: pan-y; 
            padding: 5px;
        }

        .bot-item {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #333;
            font-size: 12px;
            cursor: pointer;
        }

        .bot-item.active { border-color: #fbc02d; background: #333; }

        #board { width: 100%; margin: 15px 0; }
        
        .panel { 
            display: flex; justify-content: space-between; 
            padding: 10px; background: #111; border-radius: 8px; font-size: 14px;
        }

        .tag { font-size: 10px; padding: 2px 5px; border-radius: 3px; margin-right: 5px; }
        .gm { background: #d32f2f; }
        .cm { background: #f57c00; }

        /* Tap Highlight */
        .highlight { box-shadow: inset 0 0 0 5px rgba(255, 255, 0, 0.8) !important; }
    </style>
</head>
<body>

<div id="scene1" class="container">
    <h2 style="color: #4caf50">CHESS BOT PRO</h2>
    <input type="text" id="uname" placeholder="Enter Username...">
    <button onclick="toScene2()">PLAY GAME</button>
</div>

<div id="scene2" class="container hidden">
    <h3 style="margin: 0">Select Opponent</h3>
    <div class="bot-grid" id="botList"></div>
    <div style="display: flex; gap: 10px;">
        <button onclick="startGame('w')" style="background: #eee; color: #333">White</button>
        <button onclick="startGame('b')" style="background: #333">Black</button>
    </div>
</div>

<div id="scene3" class="container hidden">
    <div class="panel" id="oppInfo"></div>
    <div id="board"></div>
    <div class="panel" id="userInfo"></div>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button onclick="undo()" style="background: #1976d2">Undo</button>
        <button onclick="resign()" style="background: #c62828">Resign</button>
    </div>
</div>

<div id="scene4" class="container hidden">
    <h1 id="resTitle"></h1>
    <p id="resSub"></p>
    <button onclick="location.reload()">Back to Menu</button>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    // HARD LOCK EXECUTION
    document.addEventListener('touchstart', (e) => { if(e.touches.length > 1) e.preventDefault(); }, {passive: false});
    document.addEventListener('touchmove', (e) => { if(!e.target.closest('.bot-grid')) e.preventDefault(); }, {passive: false});

    let board, game = new Chess(), pColor = 'w', selBot = null, sqFrom = null;
    let sf = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');

    const bots = [
        { n: "Martin", e: 400, d: 1 }, { n: "David", e: 700, d: 2 },
        { n: "Nelson", e: 1000, d: 4 }, { n: "Poltak", e: 1500, d: 8 },
        { n: "Paul", e: 2000, d: 12 }, { n: "Hikaru", e: 2500, d: 18 },
        { n: "Magnus", e: 2882, d: 24 }, { n: "Engine", e: 3293, d: 26 }
    ];

    function toScene2() {
        if(!$('#uname').val()) return;
        $('#scene1').addClass('hidden');
        $('#scene2').removeClass('hidden');
        const list = $('#botList').empty();
        bots.forEach((b, i) => {
            let role = b.e >= 2500 ? '<span class="tag gm">GM</span>' : (b.e >= 2000 ? '<span class="tag cm">CM</span>' : '');
            let item = $(`<div class="bot-item ${selBot==i?'active':''}">${role}<b>${b.n}</b><br>ELO ${b.e}</div>`);
            item.click(() => { selBot = i; toScene2(); });
            list.append(item);
        });
    }

    function startGame(side) {
        if(selBot === null) return;
        pColor = side;
        $('#scene2').addClass('hidden');
        $('#scene3').removeClass('hidden');
        $('#userInfo').text($('#uname').val());
        const b = bots[selBot];
        $('#oppInfo').html(`<b>${b.n}</b> <span>ELO ${b.e}</span>`);
        
        board = Chessboard('board', {
            draggable: true,
            position: 'start',
            orientation: side === 'w' ? 'white' : 'black',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDrop: (s, t) => {
                let m = game.move({from: s, to: t, promotion: 'q'});
                if(!m) return 'snapback';
                clearTaps();
                checkOver();
                setTimeout(moveBot, 500);
            }
        });

        // TAP & MOVE ENGINE
        $('#board').on('touchstart mousedown', '.square-55d6', function() {
            let sq = $(this).data('square');
            let pc = game.get(sq);

            if (!sqFrom) {
                if (pc && pc.color === pColor[0]) {
                    sqFrom = sq;
                    $(this).addClass('highlight');
                }
            } else {
                let m = game.move({from: sqFrom, to: sq, promotion: 'q'});
                clearTaps();
                if (m) {
                    board.position(game.fen());
                    checkOver();
                    setTimeout(moveBot, 500);
                } else if (pc && pc.color === pColor[0]) {
                    sqFrom = sq;
                    $(this).addClass('highlight');
                } else {
                    sqFrom = null;
                }
            }
        });

        if(pColor === 'b') moveBot();
    }

    function clearTaps() { sqFrom = null; $('.square-55d6').removeClass('highlight'); }

    function moveBot() {
        if(game.game_over()) return;
        sf.postMessage('uci');
        sf.postMessage('position fen ' + game.fen());
        sf.postMessage('go depth ' + bots[selBot].d);
    }

    sf.onmessage = e => {
        if(e.data.includes('bestmove')) {
            let m = e.data.split(' ')[1];
            game.move({from: m.slice(0,2), to: m.slice(2,4), promotion: 'q'});
            board.position(game.fen());
            checkOver();
        }
    };

    function checkOver() {
        if (game.game_over()) {
            $('#scene3').addClass('hidden');
            $('#scene4').removeClass('hidden');
            $('#resTitle').text(game.in_checkmate() ? "CHECKMATE" : "DRAW");
            $('#resSub').text(game.turn() === 'w' ? "Black Wins" : "White Wins");
        }
    }

    function undo() { game.undo(); game.undo(); board.position(game.fen()); clearTaps(); }
    function resign() { 
        $('#scene3').addClass('hidden'); $('#scene4').removeClass('hidden');
        $('#resTitle').text("RESIGNED"); $('#resSub').text("Opponent Wins");
    }
</script>
</body>
</html>
