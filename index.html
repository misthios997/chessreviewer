<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Reviewer Pro</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    
    <style>
        :root {
            --bg: #1a1918; --panel: #262421; --green: #81b64c;
            --brilliant: #15d0b1; --best: #96bc4b; --blunder: #fa4143;
        }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        /* Coach Box */
        .coach-container { width: 100%; max-width: 400px; background: var(--panel); border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; border-bottom: 4px solid #111; box-sizing: border-box; }
        .coach-icon { font-size: 35px; background: #333; padding: 8px; border-radius: 50%; border: 2px solid var(--green); }

        /* Board Container FIX */
        #board-wrapper { width: 100%; max-width: 400px; aspect-ratio: 1/1; background: #2b2927; border: 2px solid #3d3a37; position: relative; }
        #board { width: 100% !important; height: 100% !important; }

        /* Panel Bawah */
        .ui-panel { width: 100%; max-width: 400px; background: var(--panel); padding: 15px; border-radius: 8px; margin-top: 10px; box-sizing: border-box; }
        .nav-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 5px; cursor: pointer; color: #fff; font-weight: bold; font-size: 22px; background: #3d3a37; }
        .btn-green { background: var(--green); font-size: 16px; margin-top: 8px; box-shadow: 0 4px 0 #5d8437; }
        .btn-green:active { transform: translateY(2px); box-shadow: none; }

        textarea { width: 100%; padding: 10px; background: #121211; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 12px; margin-bottom: 10px; }
        
        .eval-box { background: #121211; padding: 12px; border-radius: 5px; border-left: 6px solid #444; display: flex; justify-content: space-between; align-items: center; }
        .move-info { font-weight: bold; font-size: 18px; }
        .quality-tag { font-size: 13px; font-weight: 800; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="coach-container">
        <div class="coach-icon" id="coachIco">👨‍🏫</div>
        <div style="font-size: 13px;" id="coachMsg">Halo! Saya Coach. Paste PGN game kamu di bawah dan klik <b>START</b>.</div>
    </div>

    <div id="board-wrapper">
        <div id="board"></div>
    </div>

    <div class="ui-panel">
        <div class="nav-row">
            <button class="btn" onclick="goPrev()"> ❮ </button>
            <button class="btn" onclick="board.flip()" style="font-size:14px;">Flip</button>
            <button class="btn" onclick="goNext()"> ❯ </button>
        </div>

        <textarea id="pgnArea" rows="3" placeholder="Paste PGN di sini (contoh: 1. e4 e5...)"></textarea>
        <button class="btn btn-green" style="width:100%" onclick="startReview()">START GAME REVIEW</button>

        <div class="eval-box" id="evalBar" style="margin-top:15px;">
            <div>
                <div id="moveName" class="move-info">Langkah --</div>
                <div id="moveQual" class="quality-tag">MENUNGGU</div>
            </div>
            <div id="moveScore" style="font-size: 20px; font-family: monospace;">0.0</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var engine = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        var historyMoves = [];
        var moveIdx = -1;
        var lastEval = 0.3;

        // Inisialisasi Papan dengan Trik Anti-Black-Screen
        function initBoard() {
            var cfg = {
                position: 'start',
                draggable: false,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = Chessboard('board', cfg);
            
            // Trik 1: Paksa resize setelah 500ms
            setTimeout(function() {
                board.resize();
            }, 500);

            // Trik 2: Paksa resize lagi setelah 1500ms (untuk koneksi lambat)
            setTimeout(function() {
                board.resize();
            }, 1500);
        }

        // Fungsi Tombol Start
        function startReview() {
            var pgnData = $('#pgnArea').val();
            if (!pgnData || !game.load_pgn(pgnData)) {
                alert("Format PGN salah atau kosong!");
                return;
            }

            historyMoves = game.history();
            game.reset();
            board.start();
            moveIdx = -1;
            lastEval = 0.3;
            
            $('#coachMsg').html("Review Aktif! Klik panah <b>❯</b> untuk menganalisis.");
            $('#moveQual').text("SIAP");
            console.log("Review started. Moves found: " + historyMoves.length);
        }

        function goNext() {
            if (moveIdx < historyMoves.length - 1) {
                moveIdx++;
                var move = historyMoves[moveIdx];
                game.move(move);
                board.position(game.fen());
                analyze();
            }
        }

        function goPrev() {
            if (moveIdx >= 0) {
                game.undo();
                moveIdx--;
                board.position(game.fen());
                $('#moveName').text("Langkah " + (moveIdx + 1));
            }
        }

        function analyze() {
            $('#coachMsg').text("Coach sedang berpikir...");
            engine.postMessage("position fen " + game.fen());
            engine.postMessage("go depth 12");

            engine.onmessage = function(e) {
                if (e.data.includes("score cp")) {
                    var cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                    var score = (game.turn() === 'b' ? cp : -cp) / 100;
                    showResult(score);
                }
            };
        }

        function showResult(score) {
            var move = historyMoves[moveIdx];
            var diff = score - lastEval;
            var label = "Good", color = "var(--green)", icon = "🙂";

            // Klasifikasi Langkah
            if (Math.abs(diff) < 0.2) { label = "Best Move"; color = "var(--best)"; icon = "🎯"; }
            else if (diff > 1.8) { label = "Brilliant!!"; color = "var(--brilliant)"; icon = "🤩"; }
            else if (diff < -2.0) { label = "Blunder??"; color = "var(--blunder)"; icon = "😱"; }
            else if (diff < -1.0) { label = "Mistake?"; color = "#e58f2a"; icon = "🥴"; }

            $('#moveName').text((moveIdx + 1) + ". " + move);
            $('#moveScore').text((score > 0 ? "+" : "") + score.toFixed(1));
            $('#moveQual').text(label).css('color', color);
            $('#evalBar').css('border-left-color', color);
            
            $('#coachIco').text(icon);
            $('#coachMsg').html(`Langkah <b>${move}</b> adalah <b>${label}</b>.`);
            lastEval = score;
        }

        $(document).ready(initBoard);
    </script>
</body>
</html>
