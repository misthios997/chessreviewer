<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Practice Chess | Neo Final</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        body { background-color: #312e2b; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        .bg-chess-dark { background-color: #262421; }
        .bg-chess-button { background-color: #454241; }
        .bg-chess-green { background-color: #81b64c; }
        .active-side { border: 3px solid #81b64c !important; background: #3d3a37; }
        #mainBoard { width: 90vw; max-width: 400px; margin: 0 auto; display: block !important; }
        .white-1e1d7 { background-color: #ebecd0 !important; }
        .black-3c85d { background-color: #779556 !important; }
        .scroll-v { overflow-y: auto; max-height: 75vh; }
    </style>
</head>
<body>

<div id="screen-menu" class="flex flex-col items-center justify-center min-h-screen p-4">
    <h1 class="text-4xl font-black mb-10 italic uppercase tracking-tighter">Practice Chess</h1>
    <div class="grid grid-cols-1 gap-4 w-full max-w-xs">
        <button onclick="nav('screen-setup')" class="bg-chess-green py-5 rounded-xl font-bold text-xl active:scale-95 shadow-lg">Play Bot</button>
        <button onclick="nav('screen-training')" class="bg-chess-button py-4 rounded-xl font-semibold active:scale-95">Training</button>
        <button class="bg-chess-button opacity-50 py-4 rounded-xl font-semibold cursor-not-allowed">Game Review</button>
        <button onclick="alert('History Kosong')" class="bg-chess-button py-4 rounded-xl font-semibold">History</button>
    </div>
</div>

<div id="screen-setup" class="hidden min-h-screen p-4 flex flex-col items-center justify-center">
    <div class="w-full max-w-md bg-chess-dark p-6 rounded-2xl space-y-4">
        <div onclick="nav('screen-menu')" class="text-gray-400 text-sm mb-2 cursor-pointer">← Kembali</div>
        <h2 class="text-xl font-bold text-center border-b border-gray-700 pb-2">SETTINGS</h2>
        
        <label class="text-[10px] text-gray-400 block uppercase">Pilih Bot</label>
        <select id="bot-sel" class="w-full bg-[#3d3a37] p-3 rounded-lg outline-none">
            <option value="0|Martin|400">Martin (400)</option>
            <option value="5|Nelson|1200">Nelson (1200)</option>
            <option value="18|Hikaru|2500">Hikaru (2500)</option>
            <option value="20|Magnus|2882">Magnus (2882)</option>
            <option value="20|Fischer|3100">Fischer (3100)</option>
        </select>

        <label class="text-[10px] text-gray-400 block uppercase">Pilih Sisi</label>
        <div class="flex gap-2">
            <button onclick="sSide('w')" id="btn-w" class="flex-1 bg-chess-button py-3 rounded-lg font-bold active-side">White</button>
            <button onclick="sSide('b')" id="btn-b" class="flex-1 bg-chess-button py-3 rounded-lg font-bold">Black</button>
        </div>

        <label class="text-[10px] text-gray-400 block uppercase">Varian</label>
        <select id="var-sel" class="w-full bg-[#3d3a37] p-3 rounded-lg outline-none">
            <option value="standard">Standard</option>
            <option value="crazyhouse">Crazyhouse</option>
            <option value="all-queen">All Queen</option>
            <option value="all-in-one">All In One</option>
        </select>

        <button onclick="startPlay()" class="w-full bg-chess-green py-5 rounded-xl font-black text-xl shadow-xl active:bg-green-400">MULAI MAIN</button>
    </div>
</div>

<div id="screen-game" class="hidden h-screen flex flex-col p-2 bg-[#312e2b]">
    <div class="flex items-center gap-2 mb-2">
        <button onclick="location.reload()" class="bg-chess-button px-3 py-1 rounded text-xs font-bold uppercase">Back</button>
        <div class="flex-1 flex justify-between bg-[#262421] p-2 rounded">
            <span id="bot-name" class="font-bold text-sm text-green-400">Bot</span>
            <span class="bg-black px-2 rounded font-mono text-sm">None</span>
        </div>
    </div>

    <div class="flex-1 flex flex-col items-center justify-center">
        <div id="mainBoard"></div>
    </div>

    <div id="tip-box" class="hidden bg-blue-900/40 p-2 mt-2 rounded text-[11px] border border-blue-500/50">
        <b class="text-blue-300">INFO:</b> <span id="tip-txt"></span>
    </div>

    <div class="flex justify-between items-center p-2 mt-2 bg-[#262421] rounded">
        <span class="font-bold text-sm uppercase">You</span>
        <span class="bg-black px-2 rounded font-mono text-sm text-yellow-500">None</span>
    </div>

    <div class="grid grid-cols-3 gap-2 mt-4 pb-6">
        <button onclick="undo()" class="bg-chess-button py-3 rounded font-bold text-xs">UNDO</button>
        <button class="bg-chess-button py-3 rounded font-bold text-xs opacity-40">REDO</button>
        <button onclick="location.reload()" class="bg-red-900 py-3 rounded font-bold text-xs">RESIGN</button>
    </div>
</div>

<div id="screen-training" class="hidden h-screen p-6 flex flex-col">
    <button onclick="nav('screen-menu')" class="mb-4 text-gray-400">← Kembali</button>
    <h2 class="text-2xl font-black mb-4 italic uppercase border-b border-gray-700 pb-2">Training</h2>
    <div class="flex-1 scroll-v space-y-4">
        <div onclick="train('r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3', 'Italian Game', 'Langkah Bc4 menekan pion f7. Ini adalah awal dari serangan agresif.')" class="bg-chess-dark p-4 rounded-xl border-l-4 border-chess-green active:bg-gray-800 cursor-pointer">
            <h3 class="font-bold">Italian Game</h3>
            <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-wider">Serangan klasik pada f7</p>
        </div>
        <div onclick="train('rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq c6 0 2', 'Sicilian Defense', 'Hitam membalas e4 dengan c5 untuk mengontrol petak d4 dari samping.')" class="bg-chess-dark p-4 rounded-xl border-l-4 border-blue-500 active:bg-gray-800 cursor-pointer">
            <h3 class="font-bold">Sicilian Defense</h3>
            <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-wider">Pertahanan paling populer</p>
        </div>
        <div onclick="train('rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 1 2', 'Alien Gambit', 'Varian E4 yang sangat agresif. Mengorbankan posisi untuk serangan cepat.')" class="bg-chess-dark p-4 rounded-xl border-l-4 border-purple-500 active:bg-gray-800 cursor-pointer">
            <h3 class="font-bold">Alien Gambit</h3>
            <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-wider">Agresivitas tinggi</p>
        </div>
    </div>
</div>

<script>
    let board = null;
    let game = new Chess();
    let pSide = 'w';
    let sf = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
    let lv = 0;

    // NEO PIECES
    const pTheme = (p) => {
        return `https://www.chess.com/chess-themes/pieces/neo/150/${p.toLowerCase()}.png`;
    };

    function nav(id) {
        document.querySelectorAll('body > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function sSide(s) {
        pSide = s;
        $('#btn-w, #btn-b').removeClass('active-side');
        $(`#btn-${s}`).addClass('active-side');
    }

    function onDrop(source, target) {
        let move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';
        setTimeout(botMove, 400);
    }

    function botMove() {
        if (game.game_over()) return;
        sf.postMessage(`position fen ${game.fen()}`);
        sf.postMessage(`go depth ${lv + 4}`);
        sf.onmessage = (e) => {
            if (e.data.startsWith('bestmove')) {
                const m = e.data.split(' ')[1];
                game.move({ from: m.substring(0,2), to: m.substring(2,4), promotion: 'q' });
                board.position(game.fen());
            }
        };
    }

    function startPlay() {
        const b = $('#bot-sel').val().split('|');
        lv = parseInt(b[0]);
        $('#bot-name').text(b[1]);
        nav('screen-game');
        
        // RE-INITIALIZE BOARD (FIX UNTUK TOMBOL GA WORK)
        setTimeout(() => {
            game = new Chess();
            const v = $('#var-sel').val();
            if(v === 'all-queen') game.load('qqqqkqqq/pppppppp/8/8/8/8/PPPPPPPP/QQQQKQQQ w KQkq - 0 1');
            if(v === 'all-in-one') game.load('rqnbknqr/pppppppp/8/8/8/8/PPPPPPPP/RQNBKNQR w KQkq - 0 1'); // Simple start
            
            board = Chessboard('mainBoard', {
                draggable: true,
                position: game.fen(),
                orientation: pSide === 'white' || pSide === 'w' ? 'white' : 'black',
                onDrop: onDrop,
                onSnapEnd: () => board.position(game.fen()),
                pieceTheme: pTheme
            });
            if (pSide === 'b') botMove();
        }, 500); // Memberikan jeda agar DOM ter-render sempurna
    }

    function train(fen, name, tip) {
        nav('screen-game');
        $('#bot-name').text("Study: " + name);
        $('#tip-txt').text(tip);
        $('#tip-box').removeClass('hidden');
        
        setTimeout(() => {
            game = new Chess(fen);
            board = Chessboard('mainBoard', {
                draggable: true,
                position: fen,
                onDrop: onDrop,
                pieceTheme: pTheme
            });
        }, 500);
    }

    function undo() {
        game.undo(); game.undo();
        board.position(game.fen());
    }

    // Fix Board Resizing
    $(window).resize(() => { if(board) board.resize(); });
</script>
</body>
</html>
