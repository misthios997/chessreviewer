<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Academy Pro - Learning Path</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg-dark: #21201d; --bg-sidebar: #262421; --accent: #81b64c; --neo-light: #ebecd0; --neo-dark: #779556; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        /* Board Theme */
        .white-1e1d7 { background-color: var(--neo-light) !important; }
        .black-3c85d { background-color: var(--neo-dark) !important; }
        
        .sidebar { background: var(--bg-sidebar); min-height: 100vh; border-right: 1px solid #3d3b38; }
        .nav-link { color: #bababa; padding: 12px 20px; transition: 0.2s; cursor: pointer; border-left: 3px solid transparent; }
        .nav-link:hover, .nav-link.active { background: #312e2b; color: white; border-left: 3px solid var(--accent); }
        .nav-link.locked { opacity: 0.5; cursor: not-allowed; }

        .coach-card { background: #2b2926; border-radius: 10px; border-left: 4px solid var(--accent); position: relative; }
        .chat-box { height: 180px; overflow-y: auto; background: #1a1917; border-radius: 5px; padding: 10px; font-size: 0.85rem; }
        
        .move-history { height: 150px; overflow-y: auto; background: #2b2926; border: 1px solid #3d3b38; padding: 10px; font-family: monospace; }
        .lesson-node { padding: 10px; margin-bottom: 5px; border-radius: 5px; background: #363430; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .lesson-node.locked { opacity: 0.4; pointer-events: none; }
        .lesson-node.completed { border-right: 5px solid var(--accent); }
        
        #board { width: 100%; max-width: 450px; margin: 0 auto; }
        .badge-lock { font-size: 0.7rem; background: #cc3333; padding: 3px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 sidebar p-0">
            <div class="p-4 text-center">
                <h4 class="text-success fw-bold">CHESS ACADEMY</h4>
                <div class="small text-secondary" id="rank-display">Rank: Newbie</div>
            </div>
            <div class="nav flex-column">
                <a class="nav-link active" onclick="showPath('basic')"><i class="fas fa-seedling me-2"></i> Basic Class</a>
                <a class="nav-link" id="link-mid" onclick="showPath('mid')"><i class="fas fa-chess-knight me-2"></i> Mid Class <i class="fas fa-lock float-end mt-1 small"></i></a>
                <a class="nav-link" id="link-high" onclick="showPath('high')"><i class="fas fa-crown me-2"></i> High Class <i class="fas fa-lock float-end mt-1 small"></i></a>
                <a class="nav-link border-top border-secondary mt-2" onclick="showPath('opening')"><i class="fas fa-book-open me-2"></i> Opening Book</a>
                <a class="nav-link" onclick="location.reload()"><i class="fas fa-robot me-2"></i> Play vs Bot</a>
            </div>
        </nav>

        <main class="col-md-9 col-lg-6 p-4">
            <div id="board"></div>
            <div class="mt-3 p-3 bg-dark rounded d-flex justify-content-between align-items: center;">
                <div>
                    <span id="status" class="badge bg-success">Giliran Putih</span>
                    <small id="lesson-name" class="ms-2 text-secondary">Pilih Materi</small>
                </div>
                <button class="btn btn-sm btn-outline-warning" onclick="undo()">Undo Move</button>
            </div>
            <div class="move-history mt-2" id="pgn-history">
                Riwayat langkah akan muncul di sini...
            </div>
        </main>

        <aside class="col-md-12 col-lg-4 p-4">
            <div class="coach-card p-3 mb-3">
                <h6><i class="fas fa-user-tie text-success me-2"></i>Coach Pribadi</h6>
                <div class="chat-box" id="coach-talk">
                    Selamat datang! Selesaikan materi <b>Basic Class</b> untuk membuka tingkat menengah.
                </div>
            </div>

            <div class="curriculum-box">
                <h6 class="mb-3">Daftar Pelajaran <span id="category-label" class="badge bg-secondary">Basic</span></h6>
                <div id="lesson-list">
                    </div>
            </div>
        </aside>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    let board = null;
    let game = new Chess();
    let userProgress = JSON.parse(localStorage.getItem('chess_v2_data')) || {
        completed: [],
        lastCategory: 'basic',
        points: 0
    };

    const curriculum = {
        basic: [
            { id: 'b1', name: "Cara Jalan Pion", fen: "8/8/8/8/8/8/PPPPPPPP/8 w - - 0 1", coach: "Pion hanya bisa maju. Pada langkah pertama, pion bisa maju 2 kotak sekaligus!" },
            { id: 'b2', name: "Kekuatan Kuda", fen: "8/8/8/8/8/2N5/8/8 w - - 0 1", coach: "Kuda melompat dengan pola huruf 'L'. Ia satu-satunya perwira yang bisa melompati bidak lain." },
            { id: 'b3', name: "Rokade (Castling)", fen: "r3k2r/pppppppp/8/8/8/8/PPPPPPPP/R3K2R w KQkq - 0 1", coach: "Rokade adalah cara terbaik mengamankan Raja. Pastikan tidak ada bidak di antara Raja dan Benteng." }
        ],
        mid: [
            { id: 'm1', name: "Taktik Garpu (Fork)", fen: "6k1/8/3n4/8/1P1P4/2P5/8/6K1 b - - 0 1", coach: "Gunakan Kuda untuk mengancam dua bidak lawan sekaligus!" },
            { id: 'm2', name: "Pinning", fen: "4r1k1/8/4q3/4R3/8/8/8/6K1 w - - 0 1", coach: "Gunakan Benteng untuk mengunci Menteri lawan agar tidak bisa bergerak." }
        ],
        high: [
            { id: 'h1', name: "Oposisi Raja", fen: "8/4k3/8/4K3/8/8/8/8 w - - 0 1", coach: "Dalam endgame, posisi Raja sangat vital. Kontrol ruang di depan Raja lawan." },
            { id: 'h2', name: "Promosi Pion", fen: "4k3/P7/8/8/8/8/8/4K3 w - - 0 1", coach: "Bawa pion ke baris terakhir untuk mengubahnya menjadi Menteri!" }
        ],
        opening: [
            { id: 'o1', name: "Italian Game", fen: "r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3", coach: "Opening paling populer untuk pemula. Fokus pada petak lemah f7." }
        ]
    };

    function initBoard() {
        board = Chessboard('board', {
            draggable: true,
            position: 'start',
            onDrop: handleMove,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });
        showPath('basic');
        checkLocks();
    }

    function handleMove(source, target) {
        let move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';

        updateStatus();
        speakCoach(`Kamu melangkah ${move.san}. Analisis: Langkah ini bagus untuk kontrol area.`);
        
        // Simpan progress setiap langkah (simulasi belajar)
        userProgress.points += 5;
        save();
    }

    function updateStatus() {
        let moves = game.history();
        document.getElementById('pgn-history').innerText = moves.join(' ');
        document.getElementById('status').innerText = game.turn() === 'w' ? 'Giliran Putih' : 'Giliran Hitam';
    }

    function showPath(cat) {
        const list = document.getElementById('lesson-list');
        const label = document.getElementById('category-label');
        list.innerHTML = '';
        label.innerText = cat.toUpperCase();

        curriculum[cat].forEach((lesson, index) => {
            const isCompleted = userProgress.completed.includes(lesson.id);
            const isLocked = index > 0 && !userProgress.completed.includes(curriculum[cat][index-1].id) && cat !== 'opening';

            const div = document.createElement('div');
            div.className = `lesson-node ${isCompleted ? 'completed' : ''} ${isLocked ? 'locked' : ''}`;
            div.innerHTML = `
                <span>${isCompleted ? '✅' : '⚪'} ${lesson.name}</span>
                ${isLocked ? '<span class="badge-lock">LOCKED</span>' : '<i class="fas fa-play text-success small"></i>'}
            `;
            
            div.onclick = () => {
                if(!isLocked) startLesson(lesson);
            };
            list.appendChild(div);
        });
    }

    function startLesson(lesson) {
        game.load(lesson.fen);
        board.position(lesson.fen);
        speakCoach(lesson.coach);
        document.getElementById('lesson-name').innerText = lesson.name;
        
        // Beri tanda selesai setelah 3 detik (sebagai simulasi user paham)
        setTimeout(() => {
            if(!userProgress.completed.includes(lesson.id)) {
                userProgress.completed.push(lesson.id);
                speakCoach("Hebat! Materi ini selesai. Materi berikutnya terbuka.");
                save();
                showPath(document.getElementById('category-label').innerText.toLowerCase());
                checkLocks();
            }
        }, 5000);
    }

    function checkLocks() {
        // Jika Basic Selesai semua, buka Mid
        const basicDone = curriculum.basic.every(l => userProgress.completed.includes(l.id));
        const midDone = curriculum.mid.every(l => userProgress.completed.includes(l.id));

        if(basicDone) document.getElementById('link-mid').classList.remove('locked'), document.getElementById('link-mid').querySelector('.fa-lock').className = 'fas fa-check-circle text-success float-end mt-1';
        if(midDone) document.getElementById('link-high').classList.remove('locked'), document.getElementById('link-high').querySelector('.fa-lock').className = 'fas fa-check-circle text-success float-end mt-1';
        
        // Update Rank
        let rank = "Newbie";
        if(basicDone) rank = "Intermediate";
        if(midDone) rank = "Advanced";
        document.getElementById('rank-display').innerText = "Rank: " + rank;
    }

    function speakCoach(msg) {
        const box = document.getElementById('coach-talk');
        box.innerHTML = `<div class="text-success mb-1"><b>Coach:</b></div>${msg}`;
        box.scrollTop = 0;
    }

    function save() {
        localStorage.setItem('chess_v2_data', JSON.stringify(userProgress));
    }

    function undo() {
        game.undo();
        board.position(game.fen());
        updateStatus();
    }

    window.onload = initBoard;
    $(window).resize(() => board.resize());
</script>
</body>
</html>
