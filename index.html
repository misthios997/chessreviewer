<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Reviewer - Cloud Ultra</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root { --bg: #161512; --panel: #262421; --green: #81b64c; --light: #dee3e6; --dark: #8ca2ad; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        #chess-board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 92vw; height: 92vw; max-width: 380px; border: 4px solid #333; }
        .square { display: flex; justify-content: center; align-items: center; position: relative; }
        .white { background-color: var(--light); }
        .black { background-color: var(--dark); }
        .piece { width: 90%; height: 90%; z-index: 10; pointer-events: none; }
        .eval-icon { position: absolute; top: -5%; right: -5%; width: 45%; height: 45%; border-radius: 50%; z-index: 100; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: white; border: 1.5px solid #fff; }
        #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .ui-card { width: 100%; max-width: 400px; background: var(--panel); padding: 15px; border-radius: 8px; box-sizing: border-box; margin-top: 10px; }
        .btn { padding: 12px; border: none; border-radius: 4px; font-weight: bold; color: white; cursor: pointer; }
        .btn-nav { flex: 1; background: #3d3a37; font-size: 24px; }
        .btn-main { width: 100%; background: #444; margin-top: 10px; padding: 16px; font-size: 16px; transition: 0.3s; }
        .active-btn { background: var(--green) !important; box-shadow: 0 4px 0 #5d8437; }
        #list { max-height: 120px; overflow-y: auto; background: #111; margin-bottom: 10px; border: 1px solid #444; border-radius: 4px; }
        .game-item { padding: 15px; border-bottom: 1px solid #333; color: var(--green); cursor: pointer; }
        .selected { background: #2d4a1a !important; color: white !important; }
        #scoreDisplay { font-size: 28px; font-weight: bold; color: var(--green); }
    </style>
</head>
<body>

<div id="loading-overlay">
    <h1 id="load-pct" style="font-size: 60px; color: var(--green); margin: 0;">0%</h1>
    <p>Menganalisis via Cloud Server (Anti-Stuck)...</p>
</div>

<div id="chess-board"></div>

<div class="ui-card">
    <div style="display:flex; gap:5px; margin-bottom: 10px;">
        <input type="text" id="userInp" placeholder="Username Chess.com" style="flex:1; padding:12px; background:#111; color:white; border:1px solid #444; border-radius:4px;">
        <button class="btn" style="background:#555;" onclick="loadGames()">CARI</button>
    </div>
    <div id="list"></div>
    <div style="display:flex; gap:10px;"><button class="btn btn-nav" onclick="go(-1)">❮</button><button class="btn btn-nav" onclick="go(1)">❯</button></div>
    <button class="btn btn-main" id="btnAnalisis" onclick="startAnalysis()">ANALISIS INSTAN</button>
    <div id="status" style="margin-top:15px; padding:12px; background:#000; border-left:5px solid #444; display:flex; justify-content:space-between; align-items:center;">
        <div><div id="moveDisplay" style="font-weight:bold;">Langkah --</div><div id="labelDisplay" style="font-size:12px; font-weight:bold;">SIAP</div></div>
        <div id="scoreDisplay">0.0</div>
    </div>
</div>

<script>
    let game = new Chess(), gHistory = [], gIdx = -1, analysisResults = [], selectedPgn = "";

    function drawBoard() {
        const b = document.getElementById('chess-board'); b.innerHTML = '';
        const pos = game.board();
        for(let r=7; r>=0; r--) {
            for(let c=0; c<8; c++) {
                const sq = document.createElement('div');
                sq.className = `square ${(r+c)%2==0 ? 'black' : 'white'}`;
                const p = pos[7-r][c];
                if(p) {
                    const img = document.createElement('img');
                    img.className = 'piece';
                    img.src = `https://www.chess.com/chess-themes/pieces/neo/150/${p.color}${p.type}.png`;
                    sq.appendChild(img);
                }
                const res = analysisResults[gIdx];
                if(res && gHistory[gIdx] && gHistory[gIdx].to === (String.fromCharCode(97+c)+(r+1))) {
                    const icon = document.createElement('div');
                    icon.className = 'eval-icon';
                    icon.style.backgroundColor = res.color;
                    icon.innerText = res.sym;
                    sq.appendChild(icon);
                }
                b.appendChild(sq);
            }
        }
    }

    async function loadGames() {
        const u = document.getElementById('userInp').value;
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = "<div style='padding:10px;'>Memuat...</div>";
        try {
            const archives = await fetch(`https://api.chess.com/pub/player/${u}/games/archives`).then(r => r.json());
            const last = await fetch(archives.archives[archives.archives.length-1]).then(r => r.json());
            listDiv.innerHTML = "";
            last.games.reverse().slice(0,10).forEach(g => {
                const item = document.createElement('div');
                item.className = 'game-item';
                const opp = g.white.username.toLowerCase() === u.toLowerCase() ? g.black.username : g.white.username;
                item.innerText = `vs ${opp} (${g.time_class})`;
                item.onclick = () => {
                    selectedPgn = g.pgn;
                    document.querySelectorAll('.game-item').forEach(x => x.classList.remove('selected'));
                    item.classList.add('selected');
                    document.getElementById('btnAnalisis').classList.add('active-btn');
                };
                listDiv.appendChild(item);
            });
        } catch(e) { listDiv.innerHTML = "Gagal Ambil Data."; }
    }

    async function fetchCloudEval(fen) {
        try {
            const res = await fetch(`https://lichess.org/api/cloud-eval?fen=${encodeURIComponent(fen)}`);
            if (!res.ok) return null;
            const data = await res.json();
            if (data.pvs && data.pvs[0]) {
                if (data.pvs[0].cp !== undefined) return data.pvs[0].cp / 100;
                if (data.pvs[0].mate !== undefined) return data.pvs[0].mate > 0 ? 20 : -20;
            }
            return null;
        } catch { return null; }
    }

    async function startAnalysis() {
        if(!selectedPgn) return alert("Pilih lawan dulu!");
        document.getElementById('loading-overlay').style.display = 'flex';
        
        let temp = new Chess();
        temp.load_pgn(selectedPgn);
        gHistory = temp.history({verbose: true});
        temp.reset();
        analysisResults = [];
        let lastScore = 0.2;

        for(let i=0; i < gHistory.length; i++) {
            temp.move(gHistory[i].san);
            document.getElementById('load-pct').innerText = Math.round(((i+1)/gHistory.length)*100) + "%";
            
            // Ambil dari Cloud Lichess (Depth Tinggi & Instan)
            let currentScore = await fetchCloudEval(temp.fen());
            
            // Fallback jika tidak ada data cloud (evaluasi statis sederhana)
            if (currentScore === null) currentScore = lastScore;

            const diff = currentScore - lastScore;
            const isWhite = temp.turn() === 'b'; // Skor setelah langkah putih
            
            let res = { sym: '✓', color: '#81b64c', label: 'Good' };
            
            // Logika Penilaian
            if (diff < -1.8) res = { sym: '??', color: '#fa4143', label: 'Blunder' };
            else if (diff < -0.9) res = { sym: '?', color: '#e6912c', label: 'Mistake' };
            else if (diff > 0.8) res = { sym: '!!', color: '#15d0b1', label: 'Brilliant' };
            else if (diff > 0.4) res = { sym: '!', color: '#5c8bb0', label: 'Great' };
            else if (Math.abs(diff) < 0.15) res = { sym: '★', color: '#96bc4b', label: 'Best' };

            analysisResults.push({...res, score: currentScore});
            lastScore = currentScore;
        }
        game.reset(); gIdx = -1;
        document.getElementById('loading-overlay').style.display = 'none';
        drawBoard();
    }

    function go(d) {
        if(d === 1 && gIdx < gHistory.length - 1) { gIdx++; game.move(gHistory[gIdx].san); }
        else if(d === -1 && gIdx >= 0) { game.undo(); gIdx--; }
        const r = analysisResults[gIdx];
        if(r) {
            document.getElementById('moveDisplay').innerText = `${gIdx+1}. ${gHistory[gIdx].san}`;
            document.getElementById('scoreDisplay').innerText = (r.score > 0 ? "+" : "") + r.score.toFixed(1);
            document.getElementById('labelDisplay').innerText = r.label;
            document.getElementById('labelDisplay').style.color = r.color;
        }
        drawBoard();
    }
    window.onload = drawBoard;
</script>
</body>
</html>
