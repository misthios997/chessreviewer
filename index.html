<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Practice Chess Neo Fix</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        body { background-color: #312e2b; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        .bg-chess-dark { background-color: #262421; }
        .bg-chess-green { background-color: #81b64c; }
        .active-side { border: 3px solid #81b64c !important; }
        #mainBoard { width: 92vw; max-width: 400px; margin: 0 auto; }
        /* Warna Papan Neo */
        .white-1e1d7 { background-color: #ebecd0 !important; }
        .black-3c85d { background-color: #779556 !important; }
        .scroll-v { overflow-y: auto; max-height: 75vh; padding-bottom: 50px; }
    </style>
</head>
<body>

<div id="screen-menu" class="flex flex-col items-center justify-center min-h-screen p-4">
    <h1 class="text-4xl font-black mb-10 italic uppercase">PRACTICE CHESS</h1>
    <div class="grid grid-cols-1 gap-4 w-full max-w-xs">
        <button onclick="showNav('screen-setup')" class="bg-chess-green py-5 rounded-xl font-bold text-xl shadow-lg active:scale-95 transition-all">Play Bot</button>
        <button onclick="showNav('screen-training')" class="bg-[#454241] py-4 rounded-xl font-semibold active:scale-95">Training Mode</button>
    </div>
</div>

<div id="screen-setup" class="hidden min-h-screen p-4 flex flex-col justify-center">
    <div class="bg-chess-dark p-6 rounded-2xl shadow-2xl space-y-5 max-w-md mx-auto w-full">
        <button onclick="showNav('screen-menu')" class="text-gray-400 text-sm">← KEMBALI</button>
        <h2 class="text-xl font-bold text-center border-b border-gray-700 pb-2 uppercase">Settings</h2>
        
        <div>
            <label class="text-xs text-gray-400 block mb-1">PILIH BOT</label>
            <select id="bot-sel" class="w-full bg-[#3d3a37] p-3 rounded-lg outline-none border border-gray-600">
                <option value="0|Martin|400">Martin (400)</option>
                <option value="5|Nelson|1200">Nelson (1200)</option>
                <option value="15|Gusein|2250">Gusein (2250)</option>
                <option value="20|Magnus|2882">Magnus (2882)</option>
            </select>
        </div>

        <div>
            <label class="text-xs text-gray-400 block mb-1">SISI</label>
            <div class="flex gap-2">
                <button onclick="setS('w')" id="sw" class="flex-1 bg-[#454241] py-3 rounded-lg font-bold active-side">WHITE</button>
                <button onclick="setS('b')" id="sb" class="flex-1 bg-[#454241] py-3 rounded-lg font-bold">BLACK</button>
            </div>
        </div>

        <button onclick="initGame()" class="w-full bg-chess-green py-5 rounded-xl font-black text-xl shadow-xl active:bg-green-400">MULAI MAIN</button>
    </div>
</div>

<div id="screen-game" class="hidden h-screen flex flex-col p-2 bg-[#312e2b]">
    <div class="flex items-center gap-2 mb-2">
        <button onclick="location.reload()" class="bg-[#454241] px-4 py-1 rounded text-xs font-bold uppercase">Back</button>
        <div class="flex-1 flex justify-between bg-chess-dark p-2 rounded">
            <span id="bot-n" class="font-bold text-sm">Bot</span>
            <span class="bg-black px-2 rounded font-mono text-sm">--:--</span>
        </div>
    </div>

    <div class="flex-1 flex items-center justify-center">
        <div id="mainBoard"></div>
    </div>

    <div id="tip-box" class="hidden bg-blue-900/40 p-3 mt-2 rounded border border-blue-500/50">
        <p class="text-blue-300 text-[10px] font-bold uppercase mb-1">Analisis:</p>
        <p id="tip-t" class="text-xs italic text-gray-200"></p>
    </div>

    <div class="flex justify-between items-center p-2 mt-2 bg-chess-dark rounded">
        <span class="font-bold text-sm">ANDA</span>
        <span class="bg-black px-2 rounded font-mono text-sm text-yellow-500">--:--</span>
    </div>

    <div class="grid grid-cols-2 gap-2 mt-4 pb-6">
        <button onclick="undo()" class="bg-[#454241] py-3 rounded font-bold text-xs uppercase">Undo</button>
        <button onclick="location.reload()" class="bg-red-900 py-3 rounded font-bold text-xs uppercase">Resign</button>
    </div>
</div>

<div id="screen-training" class="hidden h-screen p-6 flex flex-col">
    <button onclick="showNav('screen-menu')" class="mb-4 text-gray-400 font-bold">← KEMBALI</button>
    <h2 class="text-2xl font-black mb-4 italic border-b border-gray-700 pb-2">TRAINING ACADEMY</h2>
    <div class="flex-1 scroll-v space-y-4">
        <div onclick="startT('r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3', 'Italian Game', 'Fokus menyerang pion f7 dengan Gajah c4. Langkah paling klasik untuk pemula.')" class="bg-chess-dark p-4 rounded-xl border-l-4 border-green-500 active:bg-gray-800">
            <h3 class="font-bold">1. Italian Game</h3>
            <p class="text-[10px] text-gray-400 mt-1 uppercase">Serangan pada f7</p>
        </div>
        <div onclick="startT('rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq c6 0 2', 'Sicilian Defense', 'Hitam membalas e4 dengan c5 untuk mengontrol pusat secara asimetris.')" class="bg-chess-dark p-4 rounded-xl border-l-4 border-blue-500 active:bg-gray-800">
            <h3 class="font-bold">2. Sicilian Defense</h3>
            <p class="text-[10px] text-gray-400 mt-1 uppercase">Kontrol petak d4</p>
        </div>
        <div onclick="startT('rnbqkbnr/pppp1ppp/8/4p3/4P3/Q7/PPPP1PPP/RNB1KBNR b KQkq - 1 2', 'Early Queen Attack', 'Putih mengeluarkan menteri terlalu cepat. Hukum dengan mengembangkan perwira!')" class="bg-chess-dark p-4 rounded-xl border-l-4 border-red-500 active:bg-gray-800">
            <h3 class="font-bold">3. Punishing Early Queen</h3>
            <p class="text-[10px] text-gray-400 mt-1 uppercase">Disiplin Opening</p>
        </div>
        <div onclick="startT('rnbqkbnr/ppp1pppp/8/3p4/2PP4/8/PP2PPPP/RNBQKBNR b KQkq c3 0 2', 'Queen\'s Gambit', 'Putih menawarkan pion c4. Jika dimakan, Putih akan dominan di pusat.')" class="bg-chess-dark p-4 rounded-xl border-l-4 border-yellow-500 active:bg-gray-800">
            <h3 class="font-bold">4. Queen\'s Gambit</h3>
            <p class="text-[10px] text-gray-400 mt-1 uppercase">Penguasaan Pusat</p>
        </div>
        <div onclick="startT('rnbqkbnr/pp1ppppp/8/2p5/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 1 2', 'Open Sicilian', 'Persiapan Putih untuk d4. Hitam harus siap dengan pertukaran pion pusat.')" class="bg-chess-dark p-4 rounded-xl border-l-4 border-purple-500 active:bg-gray-800">
            <h3 class="font-bold">5. Open Sicilian Intro</h3>
            <p class="text-[10px] text-gray-400 mt-1 uppercase">Transisi Midgame</p>
        </div>
    </div>
</div>

<script>
    let board = null;
    let game = new Chess();
    let side = 'w';
    let sf = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');

    function showNav(id) {
        $('body > div').addClass('hidden');
        $('#' + id).removeClass('hidden');
    }

    function setS(s) {
        side = s;
        $('#sw, #sb').removeClass('active-side');
        $(`#s${s}`).addClass('active-side');
    }

    function onDrop(source, target) {
        let m = game.move({ from: source, to: target, promotion: 'q' });
        if (m === null) return 'snapback';
        setTimeout(botM, 400);
    }

    function botM() {
        if (game.game_over()) return;
        sf.postMessage(`position fen ${game.fen()}`);
        sf.postMessage(`go depth 12`);
        sf.onmessage = function(e) {
            if (e.data.startsWith('bestmove')) {
                const move = e.data.split(' ')[1];
                game.move({ from: move.substring(0, 2), to: move.substring(2, 4), promotion: 'q' });
                board.position(game.fen());
            }
        };
    }

    function initGame() {
        const d = $('#bot-sel').val().split('|');
        $('#bot-n').text(d[1] + " (" + d[2] + ")");
        showNav('screen-game');
        $('#tip-box').addClass('hidden');

        // Delay 300ms agar board muncul sempurna
        setTimeout(() => {
            game = new Chess();
            board = Chessboard('mainBoard', {
                draggable: true,
                position: 'start',
                orientation: side === 'w' ? 'white' : 'black',
                onDrop: onDrop,
                onSnapEnd: () => board.position(game.fen()),
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            if (side === 'b') botM();
        }, 300);
    }

    function startT(fen, name, tip) {
        showNav('screen-game');
        $('#bot-n').text("STUDY: " + name);
        $('#tip-t').text(tip);
        $('#tip-box').removeClass('hidden');

        setTimeout(() => {
            game = new Chess(fen);
            board = Chessboard('mainBoard', {
                draggable: true,
                position: fen,
                onDrop: onDrop,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
        }, 300);
    }

    function undo() {
        game.undo(); game.undo();
        board.position(game.fen());
    }
</script>
</body>
</html>
