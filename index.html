<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Reviewer Pro - Ultra Fixed</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <style>
        :root { 
            --bg: #1a1917; --panel: #262421; --green: #81b64c; 
            --brilliant: #15d0b1; --blunder: #fa4143; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        /* Coach Panel */
        .coach-panel { width: 100%; max-width: 400px; background: var(--panel); border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; border-bottom: 4px solid #3d3a37; }
        .avatar { font-size: 35px; background: #333; padding: 5px; border-radius: 50%; border: 2px solid var(--green); }

        /* Papan Catur Fix */
        #board-box { width: 95vw; max-width: 380px; aspect-ratio: 1/1; background: #2b2927; border: 3px solid #444; border-radius: 4px; position: relative; }
        #board { width: 100% !important; height: 100% !important; }

        /* Controls */
        .controls { width: 100%; max-width: 400px; background: var(--panel); padding: 15px; border-radius: 8px; box-sizing: border-box; margin-top: 10px; }
        .nav-btns { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-move { flex: 1; padding: 15px; border: none; border-radius: 6px; background: #3d3a37; color: white; font-weight: bold; font-size: 24px; cursor: pointer; }
        .btn-move:active { background: #4a4744; }

        .btn-start { width: 100%; padding: 16px; border: none; border-radius: 6px; font-weight: bold; color: white; background: var(--green); font-size: 18px; margin-bottom: 15px; box-shadow: 0 4px 0 #5d8437; }
        
        textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #121211; color: white; margin-bottom: 10px; box-sizing: border-box; font-size: 12px; }
        
        .info { background: #121211; padding: 12px; border-radius: 6px; border-left: 5px solid #444; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="coach-panel">
        <div class="avatar" id="coachIco">👨‍🏫</div>
        <div style="font-size: 13px;" id="coachText">Coach: Masukkan PGN dan klik <b>START</b>.</div>
    </div>

    <div id="board-box">
        <div id="board"></div>
    </div>

    <div class="controls">
        <div class="nav-btns">
            <button class="btn-move" onclick="handlePrev()"> ❮ </button>
            <button class="btn-move" onclick="board.flip()" style="font-size:16px;">Flip</button>
            <button class="btn-move" onclick="handleNext()"> ❯ </button>
        </div>

        <textarea id="pgnInput" rows="3" placeholder="Paste PGN Game kamu di sini..."></textarea>
        <button class="btn-start" onclick="startReviewNow()">START GAME REVIEW</button>
        
        <div class="info" id="statusBox">
            <span id="moveInfo" style="font-weight:bold;">Langkah --</span>
            <span id="evalScore" style="color:#aaa;">0.0</span>
        </div>
    </div>

    <script>
        var board = null;
        var game = new Chess();
        var stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        var moves = [];
        var index = -1;
        var lastScore = 0.3;

        // Inisialisasi Papan
        function setupBoard() {
            var config = {
                position: 'start',
                draggable: false,
                // Gunakan link gambar HTTPS yang lebih aman
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = Chessboard('board', config);
            
            // Paksa muncul di layar HP (Resize fix)
            setTimeout(() => { 
                board.resize(); 
                if ($('.square-55d63').length === 0) {
                    $('#coachText').html("<span style='color:red;'>Gagal muat bidak! Pastikan internet aktif.</span>");
                }
            }, 1000);
        }

        // Tombol Start Review
        function startReviewNow() {
            var pgn = $('#pgnInput').val();
            if (!pgn || !game.load_pgn(pgn)) {
                alert("PGN Error: Pastikan PGN sudah di-paste dengan benar!");
                return;
            }
            moves = game.history();
            game.reset();
            board.start();
            index = -1;
            lastScore = 0.3;
            $('#coachText').text("Review dimulai! Gunakan tombol panah.");
            $('#statusBox').css('border-left-color', '#444');
        }

        function handleNext() {
            if (index < moves.length - 1) {
                index++;
                game.move(moves[index]);
                board.position(game.fen());
                analyze();
            }
        }

        function handlePrev() {
            if (index >= 0) {
                game.undo();
                index--;
                board.position(game.fen());
                $('#moveInfo').text("Langkah " + (index + 1));
            }
        }

        function analyze() {
            $('#coachText').text("Menganalisis...");
            stockfish.postMessage("position fen " + game.fen());
            stockfish.postMessage("go depth 12");
            
            stockfish.onmessage = function(e) {
                if (e.data.includes("score cp")) {
                    var cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                    var score = (game.turn() === 'b' ? cp : -cp) / 100;
                    updateUI(score);
                }
            };
        }

        function updateUI(score) {
            var diff = score - lastScore;
            var label = "Good", color = "var(--green)", icon = "🙂";

            if (diff > 1.5) { label = "Brilliant!!"; color = "var(--brilliant)"; icon = "🤩"; }
            else if (diff < -1.8) { label = "Blunder??"; color = "var(--blunder)"; icon = "😱"; }
            
            $('#moveInfo').text((index + 1) + ". " + moves[index]);
            $('#evalScore').text(score.toFixed(1));
            $('#statusBox').css('border-left-color', color);
            $('#coachIco').text(icon);
            $('#coachText').html(`Langkah itu <b>${label}</b>! Score: ${score.toFixed(1)}`);
            lastScore = score;
        }

        $(document).ready(setupBoard);
    </script>
</body>
</html>
