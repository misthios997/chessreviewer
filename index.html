<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Bot Mastery</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c3e50; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #34495e; padding: 20px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 600px; }
        .hidden { display: none; }
        input, select, button { padding: 10px; margin: 10px; border-radius: 5px; border: none; font-size: 16px; }
        button { cursor: pointer; background: #27ae60; color: white; font-weight: bold; transition: 0.3s; }
        button:hover { background: #2ecc71; }
        .bot-card { background: #2c3e50; padding: 10px; margin: 5px; border-radius: 5px; cursor: pointer; border: 2px solid transparent; }
        .bot-card.selected { border-color: #f1c40f; }
        #board { width: 400px; margin: 0 auto; }
        .info-panel { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; padding: 10px; background: #1a252f; border-radius: 5px; }
        .role { font-weight: bold; padding: 2px 6px; border-radius: 3px; font-size: 12px; margin-right: 5px; }
        .role-gm { background: #e74c3c; color: white; }
        .role-cm { background: #f39c12; color: white; }
    </style>
</head>
<body>

<div id="scene1" class="container">
    <h1>Chess Bot</h1>
    <input type="text" id="username" placeholder="Masukkan Username..." maxlength="15">
    <br>
    <button onclick="goToScene2()">Play Game</button>
</div>

<div id="scene2" class="container hidden">
    <h2>Pilih Bot</h2>
    <div id="bot-list">
        </div>
    <div class="settings">
        <p>Main Sebagai:</p>
        <button onclick="setSide('w')">White</button>
        <button onclick="setSide('b')">Black</button>
        <button onclick="setSide('r')">Random</button>
    </div>
</div>

<div id="scene3" class="container hidden">
    <div class="info-panel" id="opponent-info">
        </div>
    
    <div id="board"></div>

    <div class="info-panel" id="player-info">
        <span id="display-username">Player</span>
    </div>

    <div class="controls">
        <button onclick="undoMove()">Undo</button>
        <button onclick="game.reset(); board.start();">Reset</button>
        <button onclick="resign()" style="background:#c0392b">Resign</button>
    </div>
</div>

<div id="scene4" class="container hidden">
    <h1 id="result-title">Game Over</h1>
    <p id="result-desc"></p>
    <button onclick="restartGame()">Back to Menu</button>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    let board = null;
    let game = new Chess();
    let playerColor = 'w';
    let userNickname = "";
    let selectedBot = null;

    const bots = [
        { name: "Martin", elo: 400, skill: 0 },
        { name: "David", elo: 700, skill: 2 },
        { name: "Nelson", elo: 1000, skill: 5 },
        { name: "Poltak", elo: 1500, skill: 10 },
        { name: "Paul", elo: 2000, skill: 14 },
        { name: "Hikaru Nakamura", elo: 2500, skill: 18 },
        { name: "Magnus Carlsen", elo: 2882, skill: 20 },
        { name: "Engine", elo: 3293, skill: 20 }
    ];

    function getRole(elo) {
        if (elo >= 2500) return '<span class="role role-gm">(GM)</span>';
        if (elo >= 2000) return '<span class="role role-cm">(CM)</span>';
        return '';
    }

    // Scene Navigation
    function goToScene2() {
        userNickname = document.getElementById('username').value || "Guest";
        document.getElementById('scene1').classList.add('hidden');
        document.getElementById('scene2').classList.remove('hidden');
        renderBots();
    }

    function renderBots() {
        const list = document.getElementById('bot-list');
        list.innerHTML = '';
        bots.forEach((bot, index) => {
            const card = document.createElement('div');
            card.className = `bot-card ${selectedBot === index ? 'selected' : ''}`;
            card.innerHTML = `${getRole(bot.elo)} ${bot.name} (ELO ${bot.elo})`;
            card.onclick = () => {
                selectedBot = index;
                renderBots();
            };
            list.appendChild(card);
        });
    }

    function setSide(side) {
        if (selectedBot === null) return alert("Pilih bot dulu!");
        playerColor = side === 'r' ? (Math.random() > 0.5 ? 'w' : 'b') : side;
        startBattle();
    }

    function startBattle() {
        document.getElementById('scene2').classList.add('hidden');
        document.getElementById('scene3').classList.remove('hidden');
        document.getElementById('display-username').innerText = userNickname;
        
        const bot = bots[selectedBot];
        document.getElementById('opponent-info').innerHTML = `
            <div>${getRole(bot.elo)} <strong>${bot.name}</strong> (ELO ${bot.elo})</div>
            <div style="font-size: 10px; color: #bdc3c7;">Stockfish AI</div>
        `;

        initBoard();
        if (playerColor === 'b') {
            setTimeout(makeRandomMove, 500); // Simple AI move for demo
        }
    }

    // Logic Game
    function onDrop(source, target) {
        let move = game.move({
            from: source,
            to: target,
            promotion: 'q'
        });

        if (move === null) return 'snapback';

        window.setTimeout(makeMoveByBot, 250);
        checkGameOver();
    }

    function makeMoveByBot() {
        if (game.game_over()) return;

        // Simulasi tingkat kesulitan berdasarkan skill bot
        const possibleMoves = game.moves();
        if (possibleMoves.length === 0) return;

        let move;
        const botSkill = bots[selectedBot].skill;
        
        // Sederhananya: Semakin tinggi skill, semakin besar kemungkinan pilih move terbaik (Stockfish Lite logic)
        if (Math.random() * 20 < botSkill) {
            move = possibleMoves[Math.floor(Math.random() * possibleMoves.length)]; // Placeholder logic
        } else {
            move = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
        }

        game.move(move);
        board.position(game.fen());
        checkGameOver();
    }

    function checkGameOver() {
        if (game.in_checkmate()) {
            showResult(game.turn() === 'w' ? "Black Wins" : "White Wins", "by Checkmate");
        } else if (game.in_draw() || game.in_stalemate()) {
            showResult("Draw", "by Stalemate / Draw");
        }
    }

    function showResult(title, desc) {
        document.getElementById('scene3').classList.add('hidden');
        document.getElementById('scene4').classList.remove('hidden');
        document.getElementById('result-title').innerText = title;
        document.getElementById('result-desc').innerText = desc;
    }

    function resign() {
        showResult(playerColor === 'w' ? "Black Wins" : "White Wins", "by Resignation");
    }

    function undoMove() {
        game.undo();
        game.undo();
        board.position(game.fen());
    }

    function restartGame() {
        location.reload();
    }

    function initBoard() {
        const config = {
            draggable: true,
            position: 'start',
            orientation: playerColor === 'w' ? 'white' : 'black',
            onDrop: onDrop,
            onSnapEnd: () => board.position(game.fen())
        };
        board = Chessboard('board', config);
    }
</script>
</body>
</html>
