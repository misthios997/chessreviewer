<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Reviewer Pro - Coach & Stockfish</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root { 
            --bg: #1a1917; --panel: #262421; --green: #81b64c; 
            --brilliant: #15d0b1; --great: #5c8bb0; --best: #96bc4b; 
            --good: #96bc4b; --inaccuracy: #f0c15c; --mistake: #e58f2a; 
            --miss: #ff6b6b; --blunder: #fa4143; 
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        /* Coach Area */
        .coach-panel { width: 100%; max-width: 400px; background: var(--panel); border-radius: 8px; padding: 15px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; border-bottom: 4px solid #3d3a37; box-sizing: border-box; }
        .coach-avatar { font-size: 40px; background: #333; padding: 10px; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--green); }
        .coach-msg { font-size: 14px; line-height: 1.4; flex: 1; }

        /* Board Area - FIX PAPAN HILANG */
        #board-resizer { width: 100%; max-width: 400px; aspect-ratio: 1/1; margin-bottom: 15px; position: relative; background: #2b2927; border: 2px solid #3d3a37; border-radius: 4px; overflow: hidden; }
        #board { width: 100% !important; height: 100% !important; }

        /* Controls */
        .main-panel { width: 100%; max-width: 400px; background: var(--panel); padding: 15px; border-radius: 8px; box-sizing: border-box; }
        .nav-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-nav { flex: 1; padding: 18px; border: none; border-radius: 6px; background: #3d3a37; color: white; font-weight: bold; cursor: pointer; font-size: 24px; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-nav:active { background: #45423f; transform: scale(0.95); }
        .btn-flip { flex: 0.4; font-size: 14px; background: #444; }

        .btn-start { width: 100%; padding: 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; background: var(--green); font-size: 18px; margin-bottom: 15px; box-shadow: 0 4px 0 #5d8437; }
        .btn-start:active { transform: translateY(2px); box-shadow: 0 2px 0 #5d8437; }
        
        input, textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #121211; color: white; margin-bottom: 10px; box-sizing: border-box; font-size: 14px; }
        .game-item { padding: 10px; border-bottom: 1px solid #333; color: var(--green); cursor: pointer; font-size: 13px; }
        
        .info-bar { background: #121211; padding: 15px; border-radius: 6px; border-left: 6px solid #444; display: flex; justify-content: space-between; align-items: center; }
        .move-text { font-weight: bold; font-size: 18px; }
        .eval-score { font-family: monospace; font-size: 18px; color: #aaa; }
    </style>
</head>
<body>

    <div class="coach-panel">
        <div id="coachAvatar" class="coach-avatar">👨‍🏫</div>
        <div id="coachMsg" class="coach-msg">Halo! Saya Coach Stockfish. Masukkan PGN atau cari game kamu, lalu klik <b>Start Review</b>.</div>
    </div>

    <div id="board-resizer">
        <div id="board"></div>
    </div>

    <div class="main-panel">
        <div class="nav-row">
            <button class="btn-nav" onclick="handlePrev()"> ❮ </button>
            <button class="btn-nav btn-flip" onclick="board.flip()">🔄</button>
            <button class="btn-nav" onclick="handleNext()"> ❯ </button>
        </div>

        <input type="text" id="usernameInput" placeholder="Username Chess.com">
        <button onclick="fetchChessGames()" style="width:100%; padding:10px; background:#444; color:white; border:none; border-radius:4px; margin-bottom:10px; cursor:pointer;">Cari Game Terbaru</button>
        <div id="gameList" style="max-height: 100px; overflow-y: auto; margin-bottom: 10px;"></div>

        <textarea id="pgnInput" rows="3" placeholder="PGN akan otomatis terisi di sini..."></textarea>
        
        <button class="btn-start" onclick="startGameReview()">START GAME REVIEW</button>
        
        <div class="info-bar" id="statusPanel">
            <div>
                <span id="moveDisplay" class="move-text">Langkah --</span><br>
                <small id="qualityLabel" style="text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">SIAP</small>
            </div>
            <div id="evalDisplay" class="eval-score">0.0</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var engine = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        var historyMoves = [];
        var currentIdx = -1;
        var lastScore = 0.3;
        var isAnalyzing = false;

        // 1. Inisialisasi Papan dengan Fix Image
        function initBoard() {
            var config = {
                position: 'start',
                draggable: false,
                // Menggunakan HTTPS CDN yang stabil untuk gambar bidak
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = Chessboard('board', config);
            $(window).resize(board.resize);
            
            // Paksa muncul di mobile
            setTimeout(board.resize, 500);
        }

        // 2. Ambil Game dari Chess.com
        async function fetchChessGames() {
            const user = $('#usernameInput').val();
            if(!user) return alert("Masukkan username!");
            $('#gameList').html("Memuat game...");
            
            try {
                const now = new Date();
                const r = await fetch(`https://api.chess.com/pub/player/${user}/games/${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}`);
                const data = await r.json();
                $('#gameList').empty();
                
                if(data.games) {
                    data.games.reverse().slice(0, 5).forEach(g => {
                        let opponent = (g.white.username.toLowerCase() === user.toLowerCase()) ? g.black.username : g.white.username;
                        $(`<div class="game-item">vs ${opponent} (${g.white.username === user ? 'Putih' : 'Hitam'})</div>`)
                        .click(() => { 
                            $('#pgnInput').val(g.pgn); 
                            updateCoach("👨‍🎓", "Game dipilih! Sekarang klik tombol hijau <b>Start Game Review</b>.");
                        }).appendTo('#gameList');
                    });
                }
            } catch(e) { $('#gameList').html("Gagal mengambil data."); }
        }

        // 3. Logika Start Game Review (FIXED)
        function startGameReview() {
            const pgn = $('#pgnInput').val();
            if (!pgn || !game.load_pgn(pgn)) {
                return alert("PGN tidak valid atau kosong!");
            }

            historyMoves = game.history();
            game.reset();
            board.start();
            currentIdx = -1;
            lastScore = 0.3;
            
            updateCoach("👨‍🏫", "Review dimulai! Gunakan tombol panah ❯ untuk melihat analisis setiap langkah.");
            $('#qualityLabel').text("Review Aktif").css('color', '#aaa');
            $('#moveDisplay').text("Posisi Awal");
        }

        function handleNext() {
            if (currentIdx < historyMoves.length - 1 && !isAnalyzing) {
                currentIdx++;
                const move = historyMoves[currentIdx];
                game.move(move);
                board.position(game.fen());
                runAnalysis(move);
            }
        }

        function handlePrev() {
            if (currentIdx >= 0) {
                game.undo();
                currentIdx--;
                board.position(game.fen());
                $('#moveDisplay').text(currentIdx >= 0 ? `Langkah ${currentIdx + 1}` : "Posisi Awal");
                updateCoach("🤔", "Kembali ke langkah sebelumnya...");
            }
        }

        // 4. Integrasi Stockfish & Coach
        function runAnalysis(moveText) {
            isAnalyzing = true;
            updateCoach("🧐", "Sebentar, biar saya hitung kualitas langkah ini...");
            
            engine.postMessage("position fen " + game.fen());
            engine.postMessage("go depth 12");

            engine.onmessage = function(e) {
                if (e.data.includes("score cp")) {
                    const cp = parseInt(e.data.match(/score cp (-?\d+)/)[1]);
                    const score = (game.turn() === 'b' ? cp : -cp) / 100;
                    provideFeedback(moveText, score);
                    isAnalyzing = false;
                }
            };
        }

        function provideFeedback(move, score) {
            const diff = score - lastScore;
            let label = "Good", color = "var(--good)", icon = "🙂";

            // Kategori Kualitas Langkah
            if (diff > 2.0) { label = "Brilliant!!"; color = "var(--brilliant)"; icon = "🤩"; }
            else if (diff > 1.0) { label = "Great Move!"; color = "var(--great)"; icon = "🔥"; }
            else if (Math.abs(diff) < 0.2) { label = "Best Move"; color = "var(--best)"; icon = "🎯"; }
            else if (diff < -2.0) { label = "Blunder??"; color = "var(--blunder)"; icon = "😱"; }
            else if (diff < -1.0) { label = "Mistake?"; color = "var(--mistake)"; icon = "🥴"; }
            else if (diff < -0.5) { label = "Inaccuracy?!"; color = "var(--inaccuracy)"; icon = "🤨"; }

            $('#moveDisplay').text(`${currentIdx + 1}. ${move}`);
            $('#evalDisplay').text(score > 0 ? `+${score.toFixed(1)}` : score.toFixed(1));
            $('#qualityLabel').text(label).css('color', color);
            $('#statusPanel').css('border-left-color', color);
            
            updateCoach(icon, `Langkah <b>${move}</b> itu <b>${label}</b>. Evaluasi sekarang <b>${score.toFixed(1)}</b>.`);
            lastScore = score;
        }

        function updateCoach(avatar, msg) {
            $('#coachAvatar').text(avatar);
            $('#coachMsg').html(msg);
        }

        $(document).ready(initBoard);
    </script>
</body>
</html>
