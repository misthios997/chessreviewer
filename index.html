<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChessReps Pro - Auth Fixed</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg: #0a0a0a; --card: #1a1a1a; --accent: #81b64c; --text-muted: #8b8987; --neo-l: #ebecd0; --neo-d: #779556; }
        body { background-color: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 15px; width: 100%; max-width: 380px; border: 1px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

        .screen { display: none; height: 100vh; overflow-y: auto; padding-bottom: 80px; }
        .screen.active { display: block; }
        .container { max-width: 450px; margin: 0 auto; padding: 20px; }

        .course-card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #2a2a2a; display: flex; gap: 15px; align-items: center; cursor: pointer; }
        .course-img { width: 60px; height: 60px; border-radius: 8px; }
        .progress-bar-wrap { height: 4px; background: #333; border-radius: 2px; margin-top: 8px; }
        .progress-fill { height: 100%; background: #9b51e0; width: 0%; transition: 0.4s; }

        #board { width: 100vw; max-width: 400px; margin: 0 auto; }
        .white-1e1d7 { background-color: var(--neo-l) !important; }
        .black-3c85d { background-color: var(--neo-d) !important; }
        
        .coach-msg-box { background: #1a1a1a; padding: 15px; border-left: 4px solid var(--accent); margin-top: 15px; min-height: 60px; }
        .btn-neo { font-weight: bold; border-radius: 8px; padding: 10px; transition: 0.2s; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <h2 class="text-center mb-4 fw-bold text-success">ChessReps</h2>
        <div class="mb-3">
            <input type="text" id="auth-user" class="form-control bg-dark text-white border-secondary" placeholder="Username">
        </div>
        <div class="mb-4">
            <input type="password" id="auth-pass" class="form-control bg-dark text-white border-secondary" placeholder="Password">
        </div>
        <div class="d-grid gap-2">
            <button onclick="handleAuth('login')" class="btn btn-success btn-neo">MASUK (LOGIN)</button>
            <button onclick="handleAuth('register')" class="btn btn-outline-light btn-neo">DAFTAR AKUN BARU</button>
        </div>
        <p id="auth-msg" class="text-center mt-3 small text-danger"></p>
    </div>
</div>

<div id="menu-screen" class="screen">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
            <h4 class="fw-bold m-0">Halo, <span id="user-name-display" class="text-success">...</span></h4>
            <button onclick="logout()" class="btn btn-sm btn-dark">Keluar</button>
        </div>

        <div class="course-card" onclick="openCategory('basic')">
            <img src="https://images.chesscomfiles.com/uploads/v1/piece_set/neo/150/wp.png" class="course-img">
            <div class="flex-grow-1">
                <div class="fw-bold">Basic Modules</div>
                <div class="progress-bar-wrap"><div class="progress-fill" id="pb-basic"></div></div>
            </div>
        </div>

        <div class="course-card" onclick="openCategory('mid')">
            <img src="https://images.chesscomfiles.com/uploads/v1/piece_set/neo/150/wn.png" class="course-img">
            <div class="flex-grow-1">
                <div class="fw-bold">Mid Class</div>
                <div class="progress-bar-wrap"><div class="progress-fill" id="pb-mid"></div></div>
            </div>
        </div>

        <div class="course-card" onclick="openCategory('high')">
            <img src="https://images.chesscomfiles.com/uploads/v1/piece_set/neo/150/wr.png" class="course-img">
            <div class="flex-grow-1">
                <div class="fw-bold">High Class</div>
                <div class="progress-bar-wrap"><div class="progress-fill" id="pb-high"></div></div>
            </div>
        </div>

        <div class="course-card" onclick="startBotMode()">
            <i class="fas fa-robot fa-3x text-secondary mx-2"></i>
            <div class="fw-bold">Play vs Bot</div>
        </div>
    </div>
</div>

<div id="sub-screen" class="screen">
    <div class="container">
        <button class="btn btn-link text-white text-decoration-none p-0 mb-4" onclick="changeScreen('menu-screen')">← Kembali</button>
        <h4 id="sub-header" class="fw-bold mb-3">Materi</h4>
        <div id="lesson-list"></div>
    </div>
</div>

<div id="board-screen" class="screen">
    <div class="container p-0">
        <div class="p-3 d-flex justify-content-between align-items-center">
            <button class="btn btn-sm text-secondary" onclick="exitLesson()">Tutup</button>
            <div id="header-title" class="small fw-bold">Pelajaran</div>
            <div style="width:40px"></div>
        </div>
        
        <div id="board"></div>

        <div class="px-3">
            <div class="coach-msg-box">
                <div id="coach-text" class="small text-white-50">Ikuti instruksi...</div>
            </div>
            <div class="row gx-2 mt-3">
                <div class="col-6"><button class="btn btn-dark w-100" onclick="undo()">Undo</button></div>
                <div class="col-6"><button class="btn btn-dark w-100" onclick="reset()">Reset</button></div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    let board = null, game = new Chess(), currentUser = null, activeLesson = null, isBot = false;

    const db = {
        basic: [
            { id: 'b1', name: "Pawn Move", fen: "8/8/8/8/8/8/PPPPPPPP/8 w - - 0 1", goal: "e4", msg: "Gerakkan pion ke e4 untuk mengontrol pusat." },
            { id: 'b2', name: "Knight Move", fen: "8/8/8/8/8/8/8/1N6 w - - 0 1", goal: "Nc3", msg: "Kuda melompat dengan pola L. Gerakkan ke c3." }
        ],
        mid: [
            { id: 'm1', name: "Promotion", fen: "4k3/P7/8/8/8/8/8/4K3 w - - 0 1", goal: "a8=Q", msg: "Promosikan pion menjadi Menteri!" },
            { id: 'm2', name: "En Passant", fen: "rnbqkbnr/pp1ppppp/8/2pP4/8/8/PPP1PPPP/RNBQKBNR w KQkq c6 0 2", goal: "dxc6", msg: "Gunakan En Passant untuk memakan pion lawan." }
        ],
        high: [
            { id: 'h1', name: "Ladder Mate", fen: "6k1/8/8/8/8/8/1R6/2R3K1 w - - 0 1", goal: "Rc8#", msg: "Gunakan benteng secara bergantian untuk skakmat tangga!" }
        ]
    };

    // --- AUTH LOGIC ---
    function handleAuth(type) {
        const u = $('#auth-user').val().trim(), p = $('#auth-pass').val();
        const error = $('#auth-msg');
        if(!u || !p) return error.text("Username/Password kosong!");

        let accounts = JSON.parse(localStorage.getItem('chess_accounts')) || {};

        if(type === 'register') {
            if(accounts[u]) return error.text("Username sudah terdaftar!");
            accounts[u] = { pass: p, done: [] };
            localStorage.setItem('chess_accounts', JSON.stringify(accounts));
            alert("Pendaftaran Berhasil! Silakan Login.");
        } else {
            if(!accounts[u] || accounts[u].pass !== p) return error.text("Login Gagal! Akun tidak ditemukan/salah.");
            currentUser = { name: u, ...accounts[u] };
            loginSuccess();
        }
    }

    function loginSuccess() {
        $('#user-name-display').text(currentUser.name);
        updateProgressBars();
        changeScreen('menu-screen');
        $('#auth-screen').fadeOut();
    }

    function saveProgress() {
        let accounts = JSON.parse(localStorage.getItem('chess_accounts'));
        accounts[currentUser.name].done = currentUser.done;
        localStorage.setItem('chess_accounts', JSON.stringify(accounts));
        updateProgressBars();
    }

    // --- NAVIGATION ---
    function openCategory(cat) {
        const list = $('#lesson-list').empty();
        $('#sub-header').text(cat.toUpperCase());
        db[cat].forEach(item => {
            const isDone = currentUser.done.includes(item.id);
            list.append(`
                <div class="course-card" onclick='startLesson(${JSON.stringify(item)})'>
                    <div class="fw-bold">${item.name} ${isDone ? '✅' : ''}</div>
                </div>
            `);
        });
        changeScreen('sub-screen');
    }

    function startLesson(item) {
        activeLesson = item; isBot = false;
        game.load(item.fen);
        changeScreen('board-screen');
        $('#header-title').text(item.name);
        $('#coach-text').text(item.msg);
        initBoard(item.fen);
    }

    function startBotMode() {
        isBot = true; game.reset();
        changeScreen('board-screen');
        $('#header-title').text("VS Bot (Easy)");
        initBoard('start');
    }

    function initBoard(pos) {
        if(board) board.destroy();
        board = Chessboard('board', {
            draggable: true, position: pos, onDrop: handleDrop,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });
    }

    function handleDrop(src, tgt) {
        let move = game.move({ from: src, to: tgt, promotion: 'q' });
        if (!move) return 'snapback';

        if(isBot) {
            setTimeout(() => {
                const moves = game.moves();
                if(moves.length > 0) {
                    game.move(moves[Math.floor(Math.random()*moves.length)]);
                    board.position(game.fen());
                }
            }, 400);
        } else {
            // Perbaikan Logika Ladder Mate
            const isLadderMate = (activeLesson.id === 'h1' && game.in_checkmate());
            if(move.san === activeLesson.goal || isLadderMate) {
                $('#coach-text').html("<b class='text-success'>Luar Biasa!</b> Materi ini telah kamu selesaikan.");
                if(!currentUser.done.includes(activeLesson.id)) {
                    currentUser.done.push(activeLesson.id);
                    saveProgress();
                }
            } else {
                game.undo(); return 'snapback';
            }
        }
    }

    function updateProgressBars() {
        ['basic', 'mid', 'high'].forEach(cat => {
            const total = db[cat].length;
            const done = db[cat].filter(l => currentUser.done.includes(l.id)).length;
            $(`#pb-${cat}`).css('width', (done/total*100) + '%');
        });
    }

    function changeScreen(id) {
        $('.screen').removeClass('active');
        $('#'+id).addClass('active');
        if(board) board.resize();
    }

    function exitLesson() { changeScreen(isBot ? 'menu-screen' : 'sub-screen'); }
    function undo() { game.undo(); board.position(game.fen()); }
    function reset() { if(isBot) game.reset(); else game.load(activeLesson.fen); board.position(game.fen()); }
    function logout() { location.reload(); }
</script>
</body>
</html>
